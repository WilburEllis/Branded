// ═══ CP / BRANDED PAIRING CALCULATOR ═══
// Added 2026-10-22, per Nathan: a location-locked list of his top CP
// (crop-protection) products paired with whichever Branded adjuvant
// products he's chosen for them, so a rep can do the exact same
// qty/rate/GPA → gallons-needed math as the Blend Calculator above, but for
// CP + Branded tank mixes instead of a fertilizer blend truck.
//
// Data model (two new Supabase tables, see Price Updates/cp_pairings_setup.sql):
//   cp_pairings(id, location_id, season, cp_product, qty_unit, rate_min,
//     rate_max, default_qty, default_gpa, label_rate, sort_order)
//   cp_pairing_branded(id, cp_pairing_id, sku_item, sort_order)
// Branded partners are NOT duplicated into their own rate columns -- they
// reference `sku_item` and read rate_min/rate_max/rate_unit live off txData,
// same source of truth as every other price/rate in this tool.
//
// Deliberately locked, not auto-recomputed: Nathan picks which CP products
// to track per location (informed by the separate CP+Branded Pairing
// dashboard's attachment-rate data, a totally different file/process) and
// that list stays fixed until he edits it again next season -- there is no
// code path here that silently reshuffles it off fresh sales data.
//
// The CP product's own Rate UOM is picked by Nathan per product -- added
// 2026-10-26. The original version hardcoded it off qty_unit alone, which
// silently assumed every gal-packaged CP active is rated fl oz/ac and every
// lb-packaged one is rated oz/ac. Real labels vary -- qt/ac, pt/ac, gal/ac,
// and straight lb/ac are all common too -- so it's now a real picker,
// constrained to units cpAcresForProduct() below actually knows how to
// convert (an unparseable free-text unit would silently break the math).
const CP_RATE_UNITS = ["fl oz/ac", "qt/ac", "pt/ac", "gal/ac", "oz/ac", "lb/ac"];

// Converts (qty purchased, in qty_unit) + (rate, in rateUnit) into acres
// treated -- the CP-product-side equivalent of cpPartnerQtyPerAcre below,
// just inverted (quantity+rate -> acres instead of acres -> quantity).
// qty_unit "gal" assumes a liquid product (total fl oz = qty*128, total qt =
// qty*4, total pt = qty*8); qty_unit "lb" assumes dry/by-weight (total oz =
// qty*16). All six CP_RATE_UNITS values are covered; an unrecognized pairing
// (e.g. "lb/ac" rate on a "gal" product) returns 0 rather than a nonsense
// number.
function cpAcresForProduct(qty, qtyUnit, rate, rateUnit) {
  if (!(qty > 0) || !(rate > 0) || !rateUnit) return 0;
  const u = rateUnit.toLowerCase();
  if (qtyUnit === "lb") {
    if (u.indexOf("lb") !== -1) return qty / rate;
    if (u.indexOf("oz") !== -1) return (qty * 16) / rate;
    return 0;
  }
  if (u.indexOf("oz") !== -1) return (qty * 128) / rate;
  if (u.indexOf("qt") !== -1) return (qty * 4) / rate;
  if (u.indexOf("pt") !== -1) return (qty * 8) / rate;
  if (u.indexOf("gal") !== -1) return qty / rate;
  return 0;
}

// Mirrors calcPPA's unit parsing (see top of file) but returns a quantity
// (gal or lb of BRANDED PARTNER needed per acre), not a price -- the two
// are the same underlying unit-conversion logic, just stopped one step
// earlier. Liquid branch only (upg lookup) plus the dry/by-weight branch
// for a lb-packaged partner rated e.g. "lb/100gal" (same CUT-RATE-style
// convention calcPPA already handles) -- every other branded adjuvant in
// this catalog is liquid.
function cpPartnerQtyPerAcre(p, sprayVolGPA) {
  if (!p || p.rate_min == null || !p.rate_unit) return null;
  const u = p.rate_unit.toLowerCase();
  const per100 = u.indexOf("/100") !== -1;
  const carrierFactor = per100 ? (sprayVolGPA / 100) : 1;
  const isDry = p.pkg && /\d+\s*LB/i.test(p.pkg);
  if (isDry) {
    if (u.indexOf("lb") !== -1) return { qty: p.rate_min * carrierFactor, unit: "lb" };
    if (u.indexOf("oz") !== -1) return { qty: (p.rate_min / 16) * carrierFactor, unit: "lb" };
    return null;
  }
  const upg = u.indexOf("qt") !== -1 ? 4 : u.indexOf("pt") !== -1 ? 8 : u.indexOf("oz") !== -1 ? 128 : u.indexOf("gal") !== -1 ? 1 : 128;
  return { qty: (p.rate_min / upg) * carrierFactor, unit: "gal" };
}

function fmtQty(n) { return new Intl.NumberFormat("en-US", { maximumFractionDigits: 2, minimumFractionDigits: 2 }).format(n); }

// Floating "click the rate to edit it, bounded by the label range" popover --
// same UX as the standalone CP Pairing Calculator, re-implemented in React
// (single shared popover instance rather than one DOM node per pill, so a
// re-render never fights the open editor for focus).
// Single-rate popover (2026-10-26 redesign, per Nathan: "only allow one
// rate" -- a Branded partner's txData rate_min/rate_max is the real label
// RANGE, shown here as reference text only; the rep/admin always sets one
// working point within it, never a sub-range, so every downstream
// quantity/profit number is a single figure instead of a min-max spread.
function CPRatePopover({ editing, onClose, onChange, onReset }) {
  // Local text buffer, separate from the committed numeric `rate` (2026-10-30
  // fix -- Nathan: "now i cant enter .5"). The input used to be driven
  // directly by the parent's numeric `rate` prop; typing "." as the first
  // character after select-all (the normal way to start a decimal like
  // ".5") produced `Number(".")` = NaN, which the onChange guard correctly
  // refused to propagate up -- but with nothing else holding the typed
  // character, the next render just redrew the OLD numeric value over it,
  // so the "." visually vanished before a digit could ever follow it. A
  // local string buffer drives what's actually displayed, so a not-yet-a-
  // number intermediate string survives on screen; the live preview
  // (onChange(n, false), unchanged) still fires on every keystroke that
  // DOES parse, same as before.
  const [text, setText] = useState("");
  const inputRef = useRef(null);
  useEffect(() => {
    if (!editing) return;
    const val = String(editing.rate);
    setText(val);
    // Explicit focus+select, not the native `autoFocus` attribute --
    // confirmed via a real interactive test (2026-10-30) that `autoFocus`
    // doesn't reliably select the text on first mount. Two separate
    // problems found there, both fixed here: (1) `autoFocus` itself races
    // React's own event wiring on a just-inserted node. (2) Even calling
    // `.select()` ourselves right after `setText(val)` doesn't work --
    // `setText` only SCHEDULES a re-render, it doesn't update the DOM
    // synchronously, so `.select()` was running against the input's OLD
    // value (empty, on first open) and selecting nothing; the real re-
    // render then landed afterward and reset the cursor to the end.
    // Setting the DOM's own `.value` directly here, immediately before
    // selecting, sidesteps that timing gap entirely -- React's own render
    // sets the same value right after, a harmless no-op.
    if (inputRef.current) {
      inputRef.current.value = val;
      inputRef.current.focus();
      inputRef.current.select();
    }
  }, [editing?.key]);
  if (!editing) return null;
  const { label, rate, boundMin, boundMax, unit, rect } = editing;
  const isLocked = boundMin === boundMax;
  const left = Math.max(12, Math.min(rect.left, window.innerWidth - 242));
  const top = (rect.bottom + 150 > window.innerHeight) ? rect.top - 150 : rect.bottom + 8;
  // Commit (clamp + persist) -- same math the old onBlur always did, now
  // also reachable from Enter so hitting Enter both finalizes the value
  // AND closes the popover, per Nathan's request.
  function commit(andClose) {
    const n = Number(text);
    onChange(clampNum(Number.isNaN(n) ? boundMin : n, boundMin, boundMax), true);
    if (andClose) onClose();
  }
  return (
    <div style={{ position: "fixed", left, top: Math.max(12, top), zIndex: 200, width: 230, background: S.card, border: "1px solid " + S.border, borderRadius: 14, boxShadow: "0 22px 60px rgba(0,0,0,.35)", padding: "14px 16px 12px" }}>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 3 }}>
        <strong style={{ fontSize: 15 }}>{label}</strong>
        <button onClick={onClose} style={{ border: "none", background: "transparent", fontSize: 18, lineHeight: 1, color: S.muted, cursor: "pointer" }}>&times;</button>
      </div>
      <p style={{ margin: "0 0 10px", fontSize: 11, color: S.muted }}>
        {isLocked ? "Fixed rate: " + boundMin + " " + unit + " — not adjustable" : "Label range: " + boundMin + "–" + boundMax + " " + unit}
      </p>
      {/* Real bug fixed 2026-10-30: Nathan reported clicking a rate's down
          arrow made the number "continue to roll higher or lower" on its
          own. Root cause -- this was `type="number" step="any"` with a
          React-controlled value. Per spec, step="any" has no defined
          increment, so the browser's native spin button has nothing solid
          to step by; combined with React resetting the DOM's value on every
          re-render, clicking the arrow could desync the browser's internal
          step state from the controlled value and keep stepping on its
          own -- a well-known class of bug for number inputs, not unique to
          this app. Fixed by dropping `type="number"`/`step` entirely (same
          fix applied to the 3 CP Pairing Calculator inputs below this
          component) -- no native spinner at all, so the bug class can't
          happen; nothing downstream relied on the input being type=number
          anyway (every value here is already parsed with Number()/
          parseFloat() wherever it's actually used). */}
      <div style={{ display: "flex", alignItems: "center", gap: 6, marginBottom: 10 }}>
        <input ref={inputRef} type="text" inputMode="decimal" value={text} disabled={isLocked}
          onFocus={e => e.target.select()} onMouseUp={e => e.preventDefault()}
          onChange={e => {
            setText(e.target.value);
            const n = Number(e.target.value);
            if (!Number.isNaN(n)) onChange(n, false);
          }}
          onBlur={() => commit(false)}
          onKeyDown={e => {
            if (e.key === "Enter") { e.preventDefault(); commit(true); }
            else if (e.key === "Escape") { e.preventDefault(); onClose(); }
          }}
          style={{ width: 0, flex: 1, border: "1px solid " + S.border, borderRadius: 8, padding: "7px 6px", font: "inherit", fontSize: 15, fontWeight: 700, textAlign: "center", outline: "none", background: S.inputBg, color: S.text }} />
        <span style={{ color: S.muted, fontSize: 12, whiteSpace: "nowrap" }}>{unit}</span>
      </div>
      <div style={{ display: "flex", justifyContent: "flex-end" }}>
        <button onClick={onReset} style={{ border: "none", background: "transparent", color: S.green, fontSize: 12, fontWeight: 700, cursor: "pointer" }}>Reset to default</button>
      </div>
    </div>
  );
}
function clampNum(n, lo, hi) { return Math.min(Math.max(n, lo), hi); }

function CPPairingCalculator({ activeLocation, locations, txData, isAdmin, district, overridesMap, hideCost, profile }) {
  const [pairings, setPairings] = useState([]);
  const [loading, setLoading] = useState(true);
  const [loadError, setLoadError] = useState("");
  const [showManage, setShowManage] = useState(false);

  const [showRequest, setShowRequest] = useState(false);
  // Pending "Request a Product" count, admin-only -- small red badge on
  // "Manage Pairings" so it's noticed without opening the modal, same
  // pattern as the header's 🔔 Access Requests badge.
  const [pendingRequestCount, setPendingRequestCount] = useState(0);
  async function refreshPendingRequestCount() {
    if (!isAdmin) return;
    const { count } = await supabaseClient.from("cp_product_requests").select("id", { count: "exact", head: true }).eq("status", "pending");
    setPendingRequestCount(count || 0);
  }
  useEffect(() => { refreshPendingRequestCount(); }, [isAdmin]);

  // Per-CP-product working state, keyed by cp_pairings.id.
  const [qty, setQty] = useState({});
  const [rate, setRate] = useState({});
  const [gpa, setGpa] = useState({});
  // Branded-partner rate overrides, keyed "cpPairingId|skuItem" -> a single
  // number (session-local; an admin's edit also persists to
  // cp_pairing_branded.default_rate below so it sticks for everyone next
  // time, same "locked until changed" philosophy as the CP product side).
  const [partnerOverrides, setPartnerOverrides] = useState({});
  const [editing, setEditing] = useState(null); // CPRatePopover target
  const [addingPartnerTo, setAddingPartnerTo] = useState(null); // AddBrandedPartnerModal target (a cp_pairings row)

  // "Add CP Product" templates -- every distinct CP product already
  // configured at ANY location (e.g. Rio Hondo's Glyphosate/Glufosinate/
  // Warrant/Atrazine/Acephate/Transform), deduped by name, each carrying
  // its already-chosen Branded partners, so a user at a different location
  // can copy the whole pairing in one click instead of re-building it from
  // scratch or waiting on an admin. Loaded once (not scoped to
  // activeLocation -- the read RLS policy now allows seeing every
  // location's pairings for exactly this purpose).
  const [templates, setTemplates] = useState([]);
  const [templatesLoaded, setTemplatesLoaded] = useState(false);
  async function loadTemplates() {
    const { data, error } = await supabaseClient
      .from("cp_pairings")
      .select("*, cp_pairing_branded(*)")
      .order("created_at", { ascending: true });
    if (!error && data) {
      const byName = new Map();
      data.forEach(row => {
        const key = row.cp_product.trim().toLowerCase();
        const existing = byName.get(key);
        // Prefer whichever same-named row has the most Branded partners
        // attached -- the more "complete" template to copy from.
        if (!existing || (row.cp_pairing_branded || []).length > (existing.cp_pairing_branded || []).length) {
          byName.set(key, row);
        }
      });
      setTemplates([...byName.values()].sort((a, b) => a.cp_product.localeCompare(b.cp_product)));
    }
    setTemplatesLoaded(true);
  }

  async function loadPairings() {
    if (!activeLocation) { setPairings([]); setLoading(false); return; }
    setLoading(true); setLoadError("");
    const { data, error } = await supabaseClient
      .from("cp_pairings")
      .select("*, cp_pairing_branded(*)")
      .eq("location_id", activeLocation)
      .order("sort_order", { ascending: true });
    if (error) { setLoadError(error.message); setPairings([]); }
    else setPairings(data || []);
    setLoading(false);
  }
  useEffect(() => { loadPairings(); }, [activeLocation]);
  useEffect(() => { loadTemplates(); }, []);

  function qtyFor(row) { return qty[row.id] !== undefined ? qty[row.id] : String(row.default_qty); }
  function rateFor(row) { return rate[row.id] !== undefined ? rate[row.id] : String(row.rate_min === row.rate_max ? row.rate_min : (row.rate_min + row.rate_max) / 2); }
  function gpaFor(row) { return gpa[row.id] !== undefined ? gpa[row.id] : String(row.default_gpa); }

  function openEditor(e, row, partner, curRate) {
    const key = row.id + "|" + partner.sku_item;
    setEditing({
      key, bpId: partner.bpId, label: partner.name, rate: curRate,
      boundMin: partner.rate_min, boundMax: partner.rate_max, unit: partner.rate_unit,
      cpProduct: row.cp_product,
      rect: e.currentTarget.getBoundingClientRect(),
    });
  }
  function changeEditor(newRate, commit) {
    setEditing(prev => prev && ({ ...prev, rate: newRate }));
    if (!editing) return;
    setPartnerOverrides(prev => ({ ...prev, [editing.key]: newRate }));
    // An admin's committed edit also persists as the location's new default
    // (sticks for every rep next time, not just this session) -- a
    // non-admin's edit stays local-only (and would be rejected by RLS
    // anyway if it tried to write).
    if (commit && isAdmin && editing.bpId) {
      supabaseClient.from("cp_pairing_branded").update({ default_rate: newRate }).eq("id", editing.bpId).then(({ error }) => {
        if (!error) {
          setPairings(prev => prev.map(r => ({
            ...r, cp_pairing_branded: (r.cp_pairing_branded || []).map(b => b.id === editing.bpId ? { ...b, default_rate: newRate } : b)
          })));
          Analytics.track("cp_partner_rate_changed", { cp_product: editing.cpProduct, partner: editing.label, rate: newRate, unit: editing.unit, location: activeLocation });
        }
      });
    }
  }
  function resetEditor() {
    if (!editing) return;
    setPartnerOverrides(prev => { const n = { ...prev }; delete n[editing.key]; return n; });
    if (isAdmin && editing.bpId) {
      supabaseClient.from("cp_pairing_branded").update({ default_rate: null }).eq("id", editing.bpId).then(({ error }) => {
        if (!error) setPairings(prev => prev.map(r => ({
          ...r, cp_pairing_branded: (r.cp_pairing_branded || []).map(b => b.id === editing.bpId ? { ...b, default_rate: null } : b)
        })));
      });
    }
    setEditing(null);
  }

  // Self-added Branded partners are PRIVATE to whoever added them (2026-10-30,
  // revised same day per Nathan: "should each acct hold their own additional
  // products... and not that gets added to the location that others...
  // cant remove?") -- a rep's own exploratory comparisons never show up for
  // anyone else at that location, only what's admin-required (added_by ==
  // null) is shared/visible to everyone. Admin sees everything here too
  // (not just via Manage Pairings), for oversight. This is the single
  // source of truth for "what does THIS viewer see paired with this CP
  // product" -- both the tile list and the Add-partner modal's duplicate-
  // exclusion list are built from it, so a rep is never blocked from
  // adding something that looks new from their own point of view just
  // because a different rep already added the same sku privately.
  function visiblePartnersFor(row) {
    return (row.cp_pairing_branded || []).filter(bp => isAdmin || bp.added_by == null || bp.added_by === profile?.id);
  }

  // Self-service remove (2026-10-30, per Nathan): a user can only remove a
  // Branded partner THEY personally added -- never one an admin set up via
  // Manage Pairings (admin-added rows have added_by = null, which the RLS
  // self-service delete policy in cp_pairings_self_service.sql already
  // guarantees can't match `added_by = auth.uid()` for anyone -- that's
  // what actually enforces "admin-required pairings can't be removed at
  // the location level", not anything client-side). The ✕ itself is only
  // ever rendered when bp.added_by === profile.id (see the tile render
  // below), so this never gets called for a row the current user doesn't
  // own, but the RLS is the real backstop either way.
  const [removeErr, setRemoveErr] = useState("");
  async function removeOwnBrandedPartner(bp, cpProduct) {
    if (!window.confirm("Remove this Branded product from your comparison?")) return;
    setRemoveErr("");
    const { error } = await supabaseClient.from("cp_pairing_branded").delete().eq("id", bp.id);
    if (error) { setRemoveErr(error.message); return; }
    Analytics.track("cp_self_remove_partner", { cp_product: cpProduct, partner_item: bp.sku_item, location: activeLocation });
    loadPairings();
  }

  if (!activeLocation) {
    return <div style={{ padding: "30px 10px", textAlign: "center", color: S.muted, fontSize: 13 }}>Pick a location above to see its CP Pairing Calculator.</div>;
  }
  if (loading) return <div style={{ padding: "30px 10px", textAlign: "center", color: S.muted, fontSize: 13 }}>Loading…</div>;
  if (loadError) return <div style={{ padding: "30px 10px", textAlign: "center", color: "#ef4444", fontSize: 13 }}>Couldn't load CP pairings: {loadError}</div>;

  const locName = locations.find(l => l.id === activeLocation)?.name || activeLocation;

  return (
    <div>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 10, flexWrap: "wrap", gap: 8 }}>
        <div style={{ fontSize: 10, color: S.muted, textTransform: "uppercase", letterSpacing: 1 }}>
          {locName}'s CP Products {pairings.length > 0 ? "(" + pairings.length + ")" : ""}
        </div>
        <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
          <button onClick={() => setShowAddCp(true)} style={{ fontSize: 10, fontWeight: 700, color: S.onAccent, background: S.green, border: "none", padding: "5px 10px", borderRadius: 6, cursor: "pointer" }}>
            + Add CP Product
          </button>
          <button onClick={() => setShowRequest(true)} style={{ fontSize: 10, fontWeight: 700, color: S.amber, background: "rgba(232,162,48,.1)", border: "1px solid rgba(232,162,48,.3)", padding: "5px 10px", borderRadius: 6, cursor: "pointer" }}>
            📩 Request a Product
          </button>
          {isAdmin && (
            <button onClick={() => setShowManage(true)} style={{ position: "relative", fontSize: 10, fontWeight: 700, color: S.purple, background: "rgba(176,125,232,.1)", border: "1px solid rgba(176,125,232,.3)", padding: "5px 10px", borderRadius: 6, cursor: "pointer" }}>
              ⚙️ Manage Pairings
              {pendingRequestCount > 0 && (
                <span style={{ position: "absolute", top: -6, right: -6, fontSize: 9, fontWeight: 800, color: "#fff", background: "#ef4444", borderRadius: 10, padding: "1px 5px", lineHeight: 1.4 }}>
                  {pendingRequestCount}
                </span>
              )}
            </button>
          )}
        </div>
      </div>

      {removeErr && (
        <div style={{ color: "#ef4444", fontSize: 12, fontWeight: 600, background: "rgba(239,68,68,.1)", border: "1px solid rgba(239,68,68,.3)", borderRadius: 8, padding: "8px 10px", marginBottom: 12 }}>{removeErr}</div>
      )}

      {pairings.length === 0 && (
        <div style={{ padding: "40px 10px", textAlign: "center", color: S.muted, fontSize: 13 }}>
          No CP products locked in for {locName} yet. Click "+ Add CP Product" above to copy one already set up elsewhere, or "Request a Product" if it's not on that list yet.
        </div>
      )}

      {pairings.map(row => {
        const q = parseFloat(qtyFor(row)) || 0;
        const r = parseFloat(rateFor(row)) || 0;
        const g = parseFloat(gpaFor(row)) || 0;
        const acres = cpAcresForProduct(q, row.qty_unit, r, row.rate_unit);
        const finished = acres * g;
        const branded = visiblePartnersFor(row).slice().sort((a, b) => (a.sort_order || 0) - (b.sort_order || 0));
        return (
          <div key={row.id} style={{ background: S.card, border: "1px solid " + S.border, borderRadius: 16, marginBottom: 14, overflow: "hidden", boxShadow: "0 6px 20px rgba(0,0,0,.16)" }}>
            <div style={{ padding: "13px 16px", fontSize: 15, fontWeight: 800, color: "#fff", background: "linear-gradient(135deg,#1e4a2c,#2d6b3f)", letterSpacing: .2 }}>
              {row.cp_product}
            </div>
            <div style={{ display: "grid", gridTemplateColumns: "minmax(230px,320px) 1fr" }}>

              {/* LEFT: application inputs for the CP product itself */}
              <div style={{ padding: 16, borderRight: "1px solid " + S.border }}>
                <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10, marginBottom: 10 }}>
                  <div>
                    <label style={{ display: "block", fontSize: 9, fontWeight: 700, textTransform: "uppercase", letterSpacing: .5, color: S.muted, marginBottom: 4 }}>Quantity</label>
                    <div style={{ display: "flex", alignItems: "center", border: "1.5px solid " + S.border, borderRadius: 8, background: S.inputBg }}>
                      <input type="text" inputMode="decimal" value={qtyFor(row)}
                        onFocus={e => e.target.select()} onMouseUp={e => e.preventDefault()}
                        onChange={e => setQty(prev => ({ ...prev, [row.id]: e.target.value }))}
                        style={{ width: 0, flex: 1, border: "none", background: "transparent", padding: "9px 4px 9px 10px", color: S.text, font: "inherit", fontSize: 14, fontWeight: 700, outline: "none" }} />
                      <span style={{ padding: "0 10px", fontSize: 11, color: S.muted }}>{row.qty_unit}</span>
                    </div>
                  </div>
                  <div>
                    <label style={{ display: "block", fontSize: 9, fontWeight: 700, textTransform: "uppercase", letterSpacing: .5, color: S.muted, marginBottom: 4 }}>Rate (UOM)</label>
                    <div style={{ display: "flex", alignItems: "center", border: "1.5px solid " + S.border, borderRadius: 8, background: S.inputBg }}>
                      <input type="text" inputMode="decimal" value={rateFor(row)}
                        onFocus={e => e.target.select()} onMouseUp={e => e.preventDefault()}
                        onChange={e => setRate(prev => ({ ...prev, [row.id]: e.target.value }))}
                        style={{ width: 0, flex: 1, border: "none", background: "transparent", padding: "9px 4px 9px 10px", color: S.text, font: "inherit", fontSize: 14, fontWeight: 700, outline: "none" }} />
                      <span style={{ padding: "0 10px", fontSize: 11, color: S.muted, whiteSpace: "nowrap" }}>{row.rate_unit}</span>
                    </div>
                  </div>
                </div>
                <div style={{ marginBottom: 14 }}>
                  <label style={{ display: "block", fontSize: 9, fontWeight: 700, textTransform: "uppercase", letterSpacing: .5, color: S.muted, marginBottom: 4 }}>Spray Volume</label>
                  <div style={{ display: "flex", alignItems: "center", border: "1.5px solid " + S.border, borderRadius: 8, background: S.inputBg }}>
                    <input type="text" inputMode="decimal" value={gpaFor(row)}
                      onFocus={e => e.target.select()} onMouseUp={e => e.preventDefault()}
                      onChange={e => setGpa(prev => ({ ...prev, [row.id]: e.target.value }))}
                      style={{ width: 0, flex: 1, border: "none", background: "transparent", padding: "9px 4px 9px 10px", color: S.text, font: "inherit", fontSize: 14, fontWeight: 700, outline: "none" }} />
                    <span style={{ padding: "0 10px", fontSize: 11, color: S.muted }}>gal/ac</span>
                  </div>
                </div>
                <div style={{ background: "rgba(232,162,48,.1)", border: "1px solid rgba(232,162,48,.3)", borderRadius: 10, padding: "10px 12px" }}>
                  <div style={{ fontSize: 9, fontWeight: 700, textTransform: "uppercase", letterSpacing: .5, color: S.amber, marginBottom: 2 }}>Acres Treated</div>
                  {acres > 0 ? (<React.Fragment>
                    <div style={{ fontSize: 22, fontWeight: 800, color: S.text, lineHeight: 1 }}>{acres.toFixed(1)}</div>
                    <div style={{ fontSize: 11, color: S.muted, marginTop: 4 }}>{fmtQty(finished)} gal finished spray</div>
                  </React.Fragment>) : (
                    <div style={{ fontSize: 12, color: S.muted }}>Enter quantity &amp; rate</div>
                  )}
                </div>
              </div>

              {/* RIGHT: paired Branded products */}
              <div style={{ padding: 16, display: "grid", gridTemplateColumns: "repeat(auto-fit,minmax(150px,1fr))", gap: 12, alignContent: "start" }}>
                {branded.length === 0 && (
                  <div style={{ fontSize: 12, color: S.muted, gridColumn: "1/-1" }}>
                    No Branded products paired with {row.cp_product} yet. Click "+ Add New Branded Product" below.
                  </div>
                )}
                {branded.map(bp => {
                  const p = txData.find(x => String(x.item) === String(bp.sku_item));
                  const name = p?.name || bp.sku_item;
                  const rateUnit = p?.rate_unit || "";
                  const key = row.id + "|" + bp.sku_item;
                  const ov = partnerOverrides[key];
                  // One working rate only (2026-10-26, per Nathan) -- never a
                  // sub-range. Falls back to the locked default_rate an admin
                  // set (persists for everyone), then to the midpoint of the
                  // real label range if nobody's set one yet.
                  const midpoint = (p && p.rate_min != null && p.rate_max != null) ? (p.rate_min + p.rate_max) / 2 : null;
                  const curRate = ov != null ? ov : (bp.default_rate != null ? bp.default_rate : midpoint);
                  const overridden = p && curRate != null && bp.default_rate != null && curRate !== midpoint;
                  const needed = (p && curRate != null && acres > 0) ? cpPartnerQtyPerAcre({ ...p, rate_min: curRate }, g) : null;
                  const totalQty = needed ? needed.qty * acres : null;
                  // Profit per pairing -- reuses the app's own resolvePrice()
                  // (same district/location/override cascade every other
                  // price in this app goes through) against the Branded
                  // partner's real cost. Skipped for a dry_oz_price product
                  // (EMPLOY-style) since that needs calcPPA's oz_per_unit
                  // basis conversion, not a flat price-minus-cost -- no real
                  // CP-paired Branded product is dry_oz_price today, so this
                  // is a deliberate "don't silently guess" gap, not an
                  // oversight. Always shown -- Nathan wants reps to see which
                  // pairings make more money, even though they never see
                  // raw cost figures anywhere else in the app.
                  const priced = (p && !p.dry_oz_price) ? resolvePrice(p, district, activeLocation, overridesMap) : null;
                  const sellPrice = priced ? (priced.target != null ? priced.target : priced.floor) : null;
                  const profit = (sellPrice != null && totalQty != null) ? (sellPrice - (p.cost || 0)) * totalQty : null;
                  // Only the person who personally added this pairing can
                  // remove it from here -- an admin-set-up pairing has
                  // added_by = null and never matches, so it never shows an
                  // ✕ in this view at all (it's "required" at this
                  // location; Manage Pairings is still the only way to
                  // remove one of those, admin-only).
                  const canRemove = bp.added_by && profile?.id && bp.added_by === profile.id;
                  return (
                    <div key={bp.id} style={{ position: "relative", background: S.inputBg, border: "1px solid " + S.border, borderRadius: 10, padding: "10px 12px" }}>
                      {canRemove && (
                        <span onClick={() => removeOwnBrandedPartner(bp, row.cp_product)} title="Remove this Branded product"
                          style={{ position: "absolute", top: 6, right: 8, fontSize: 13, color: S.muted, cursor: "pointer", lineHeight: 1 }}>
                          &times;
                        </span>
                      )}
                      <div style={{ fontSize: 12.5, fontWeight: 700, marginBottom: 6, color: S.text, paddingRight: canRemove ? 14 : 0 }}>
                        {name}{p?.pkg ? <span style={{ fontWeight: 600, color: S.muted }}> · {p.pkg}</span> : null}
                      </div>
                      {p && curRate != null ? (
                        <React.Fragment>
                          <button onClick={e => openEditor(e, row, { sku_item: bp.sku_item, bpId: bp.id, name, rate_min: p.rate_min, rate_max: p.rate_max, rate_unit: rateUnit }, curRate)}
                            style={{ fontSize: 10, fontWeight: 800, letterSpacing: .3, border: "none", borderRadius: 999, padding: "3px 8px", cursor: "pointer", background: overridden ? S.amber : "rgba(76,175,106,.14)", color: overridden ? S.onAccent : S.green }}>
                            {fmtQty(curRate).replace(/\.00$/, "") + " " + rateUnit}
                          </button>
                          {/* Same label-rate pill used throughout Pricing (ProductCard's
                              rateStr + rate_note, 🌿 amber pill) -- reused here verbatim
                              rather than reinvented, per Nathan. */}
                          {(() => {
                            const rateStr = p.rate_min != null ? (p.rate_min === p.rate_max ? p.rate_min + " " + rateUnit : p.rate_min + "-" + p.rate_max + " " + rateUnit) : null;
                            return (rateStr || p.rate_note) ? (
                              <div style={{ display: "inline-flex", alignItems: "center", background: "rgba(232,162,48,.1)", border: "1px solid rgba(232,162,48,.25)", borderRadius: 6, padding: "4px 8px", marginTop: 6 }}>
                                <span style={{ fontSize: 10, color: S.amber }}>🌿 {rateStr || ""}{rateStr && p.rate_note ? " · " : ""}{p.rate_note || ""}</span>
                              </div>
                            ) : null;
                          })()}
                        </React.Fragment>
                      ) : (
                        <div style={{ fontSize: 10, color: S.muted }}>No rate data</div>
                      )}
                      <div style={{ fontSize: 9, fontWeight: 700, textTransform: "uppercase", letterSpacing: .5, color: S.muted, marginTop: 9, marginBottom: 2 }}>Needed</div>
                      <div style={{ fontSize: 18, fontWeight: 800, color: S.text }}>
                        {totalQty != null ? fmtQty(totalQty) + " " + needed.unit : "—"}
                      </div>
                      <div style={{ fontSize: 9, fontWeight: 700, textTransform: "uppercase", letterSpacing: .5, color: S.muted, marginTop: 9, marginBottom: 2 }}>Profit</div>
                      <div style={{ fontSize: 15, fontWeight: 800, color: profit == null ? S.muted : (profit >= 0 ? S.green : "#ef4444") }}>
                        {profit != null ? "$" + fmtQty(profit) : "—"}
                      </div>
                    </div>
                  );
                })}
                <button onClick={() => setAddingPartnerTo(row)}
                  style={{ background: "transparent", border: "1.5px dashed " + S.border, borderRadius: 10, padding: "10px 12px", cursor: "pointer", color: S.muted, fontSize: 12, fontWeight: 700, display: "flex", alignItems: "center", justifyContent: "center", minHeight: 76 }}>
                  + Add New Branded Product
                </button>
              </div>

            </div>
          </div>
        );
      })}

      <CPRatePopover editing={editing} onClose={() => setEditing(null)} onChange={changeEditor} onReset={resetEditor} />

      {addingPartnerTo && (
        <AddBrandedPartnerModal
          cpPairing={addingPartnerTo} locName={locName} profile={profile} txData={txData}
          existingSkuItems={visiblePartnersFor(addingPartnerTo).map(bp => String(bp.sku_item))}
          onClose={() => setAddingPartnerTo(null)}
          onSaved={() => { loadPairings(); setAddingPartnerTo(null); }} />
      )}

      {showAddCp && (
        <AddCpProductModal
          activeLocation={activeLocation} locName={locName} profile={profile} txData={txData}
          templates={templatesLoaded ? templates : []} templatesLoaded={templatesLoaded}
          existingNames={pairings.map(r => r.cp_product.trim().toLowerCase())}
          onClose={() => setShowAddCp(false)}
          onSaved={() => { loadPairings(); loadTemplates(); }} />
      )}

      {showRequest && (
        <RequestCpProductModal
          activeLocation={activeLocation} locName={locName} profile={profile}
          onClose={() => setShowRequest(false)} />
      )}

      {showManage && (
        <ManageCPPairings
          activeLocation={activeLocation} locName={locName} txData={txData} locations={locations}
          pairings={pairings} onClose={() => { setShowManage(false); refreshPendingRequestCount(); }}
          onSaved={() => { loadPairings(); loadTemplates(); }} />
      )}
    </div>
  );
}

// "Add New Branded Product" -- self-service: pair ANY Branded product onto
// an already-set-up CP product at the viewer's own location, so they can
// compare profit across options (2026-10-30, per Nathan). Same RLS as
// AddCpProductModal's branded-row inserts (own-location-only via the
// cp_pairings join, see cp_pairings_self_service.sql) -- no new SQL needed,
// this reuses the self-service insert policy already in place.
//
// This creates a genuinely NEW CP+Branded combination (unlike "+ Add CP
// Product" above, which only ever copies an already-existing, presumably
// already-reviewed pairing) -- so per Nathan's explicit instruction, this
// is the one place in the app that requires an active legal-label
// acknowledgment before the Add action is even clickable, not just a
// passive notice someone could skim past.
function AddBrandedPartnerModal({ cpPairing, locName, profile, txData, existingSkuItems, onClose, onSaved }) {
  const [search, setSearch] = useState("");
  const [confirmed, setConfirmed] = useState(false);
  const [busyItem, setBusyItem] = useState(null);
  const [err, setErr] = useState("");

  const results = search.trim().length >= 2
    ? txData.filter(p => p.name.toLowerCase().includes(search.toLowerCase()) && !existingSkuItems.includes(String(p.item))).slice(0, 8)
    : [];

  async function addPartner(p) {
    if (!confirmed) return;
    setErr(""); setBusyItem(p.item);
    const { error } = await supabaseClient.from("cp_pairing_branded").insert({
      cp_pairing_id: cpPairing.id, sku_item: p.item, sort_order: existingSkuItems.length, added_by: profile?.id || null,
    });
    setBusyItem(null);
    if (error) { setErr(error.message); return; }
    Analytics.track("cp_self_add_partner", { cp_product: cpPairing.cp_product, partner: p.name, location: cpPairing.location_id });
    onSaved();
  }

  return (
    <div style={{ position: "fixed", inset: 0, zIndex: 300, background: "rgba(0,0,0,.5)", display: "flex", alignItems: "flex-start", justifyContent: "center", overflowY: "auto", padding: "40px 14px" }} onClick={onClose}>
      <div onClick={e => e.stopPropagation()} style={{ width: "min(480px,100%)", background: S.card, border: "1px solid " + S.border, borderRadius: 14, padding: 18 }}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 6 }}>
          <strong style={{ fontSize: 15 }}>Add Branded Product — {cpPairing.cp_product}</strong>
          <button onClick={onClose} style={{ border: "none", background: "transparent", fontSize: 20, color: S.muted, cursor: "pointer" }}>&times;</button>
        </div>
        <p style={{ fontSize: 11, color: S.muted, margin: "0 0 12px" }}>
          For {locName}. Pick a Branded product to compare its profit on {cpPairing.cp_product} against your other options.
        </p>

        <div style={{ background: "rgba(232,162,48,.1)", border: "1px solid rgba(232,162,48,.3)", borderRadius: 10, padding: "10px 12px", marginBottom: 12 }}>
          <div style={{ fontSize: 12, fontWeight: 700, color: S.amber, marginBottom: 6 }}>⚠️ Read both labels first</div>
          <div style={{ fontSize: 11.5, color: S.text, lineHeight: 1.4, marginBottom: 8 }}>
            Pairing a Branded product with {cpPairing.cp_product} here doesn't check whether they're legally allowed to be applied together. Read {cpPairing.cp_product}'s label AND the Branded product's label before adding one — confirm the combination (tank mix) is legal and follows both labels' directions for use.
          </div>
          <label style={{ display: "flex", alignItems: "flex-start", gap: 8, fontSize: 11.5, color: S.text, cursor: "pointer" }}>
            <input type="checkbox" checked={confirmed} onChange={e => setConfirmed(e.target.checked)} style={{ marginTop: 2, flexShrink: 0 }} />
            I've read both labels and confirmed this combination is legal to apply together.
          </label>
        </div>

        {err && <div style={{ color: "#ef4444", fontSize: 12, fontWeight: 600, marginBottom: 10 }}>{err}</div>}

        <div style={{ position: "relative" }}>
          <input type="search" placeholder={confirmed ? "Type to search Branded products..." : "Confirm you've read both labels first"} value={search}
            disabled={!confirmed}
            onChange={e => setSearch(e.target.value)}
            style={{ width: "100%", background: confirmed ? S.inputBg : S.tag, border: "1px solid " + S.border, borderRadius: 8, color: S.text, fontSize: 13, padding: "8px 10px", outline: "none", boxSizing: "border-box", opacity: confirmed ? 1 : .6 }} />
          {results.length > 0 && (
            <div style={{ position: "relative", marginTop: 6, background: S.card, border: "1px solid " + S.border, borderRadius: 8, maxHeight: 260, overflowY: "auto" }}>
              {results.map(p => (
                <div key={p.item} onClick={() => addPartner(p)}
                  style={{ padding: "9px 10px", cursor: busyItem ? "default" : "pointer", borderBottom: "1px solid " + S.border, opacity: busyItem && busyItem !== p.item ? .5 : 1 }}>
                  <div style={{ fontSize: 13, fontWeight: 600, color: S.text }}>{p.name}</div>
                  <div style={{ fontSize: 10.5, color: S.muted, marginTop: 1 }}>
                    {p.pkg ? p.pkg + " · " : ""}#{p.item}{p.rate_min != null ? " · " + p.rate_min + (p.rate_max !== p.rate_min ? "–" + p.rate_max : "") + " " + p.rate_unit : " · no rate data"}
                  </div>
                </div>
              ))}
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

// "Add CP Product" -- self-service copy of an already-configured CP
// product (+ its paired Branded skus) from any location onto the viewer's
// own location. No admin needed: the CP product's rate_min/rate_max/
// rate_unit and the Branded skus it pairs with are copied verbatim from
// the template; only the AGRONOMIC pairing structure is copied, never a
// price -- pricing still resolves per-viewer the normal way once it's on
// their own location. See cp_pairings_self_service.sql for the RLS that
// allows this (own-location-only insert, self-added-only delete).
function AddCpProductModal({ activeLocation, locName, profile, txData, templates, templatesLoaded, existingNames, onClose, onSaved }) {
  const [busyKey, setBusyKey] = useState(null);
  const [err, setErr] = useState("");
  const [done, setDone] = useState([]);

  async function copyTemplate(tpl) {
    setErr(""); setBusyKey(tpl.id);
    const { data: newRow, error: insertErr } = await supabaseClient.from("cp_pairings").insert({
      location_id: activeLocation, cp_product: tpl.cp_product, qty_unit: tpl.qty_unit, rate_unit: tpl.rate_unit,
      rate_min: tpl.rate_min, rate_max: tpl.rate_max, default_qty: tpl.default_qty, default_gpa: tpl.default_gpa,
      label_rate: tpl.label_rate, sort_order: existingNames.length + done.length, added_by: profile?.id || null,
    }).select().single();
    if (insertErr) { setErr(insertErr.message); setBusyKey(null); return; }

    const branded = (tpl.cp_pairing_branded || []).slice().sort((a, b) => (a.sort_order || 0) - (b.sort_order || 0));
    if (branded.length > 0) {
      const { error: brandedErr } = await supabaseClient.from("cp_pairing_branded").insert(
        branded.map((bp, i) => ({
          cp_pairing_id: newRow.id, sku_item: bp.sku_item, default_rate: bp.default_rate,
          sort_order: i, added_by: profile?.id || null,
        }))
      );
      if (brandedErr) { setErr(brandedErr.message); setBusyKey(null); return; }
    }
    Analytics.track("cp_self_add_product", { product: tpl.cp_product, location: activeLocation, partner_count: branded.length });
    setDone(prev => [...prev, tpl.cp_product]);
    setBusyKey(null);
    onSaved();
  }

  const available = templates.filter(t => !existingNames.includes(t.cp_product.trim().toLowerCase()));

  return (
    <div style={{ position: "fixed", inset: 0, zIndex: 300, background: "rgba(0,0,0,.5)", display: "flex", alignItems: "flex-start", justifyContent: "center", overflowY: "auto", padding: "40px 14px" }} onClick={onClose}>
      <div onClick={e => e.stopPropagation()} style={{ width: "min(560px,100%)", background: S.card, border: "1px solid " + S.border, borderRadius: 14, padding: 18 }}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 6 }}>
          <strong style={{ fontSize: 15 }}>Add CP Product — {locName}</strong>
          <button onClick={onClose} style={{ border: "none", background: "transparent", fontSize: 20, color: S.muted, cursor: "pointer" }}>&times;</button>
        </div>
        <p style={{ fontSize: 11, color: S.muted, margin: "0 0 14px" }}>
          Copies the rate and the already-chosen Branded partners straight from whichever location set it up — your own location's prices still apply once it's here. Don't see what you need? Try "Request a Product" instead.
        </p>
        {err && <div style={{ color: "#ef4444", fontSize: 12, fontWeight: 600, background: "rgba(239,68,68,.1)", border: "1px solid rgba(239,68,68,.3)", borderRadius: 8, padding: "8px 10px", marginBottom: 12 }}>{err}</div>}

        {!templatesLoaded && <div style={{ textAlign: "center", color: S.muted, fontSize: 13, padding: 20 }}>Loading…</div>}

        {templatesLoaded && available.length === 0 && (
          <div style={{ textAlign: "center", color: S.muted, fontSize: 13, padding: 20 }}>
            {templates.length === 0 ? "No CP products set up anywhere yet." : "Every available CP product is already set up at " + locName + "."}
          </div>
        )}

        {available.map(tpl => {
          const branded = (tpl.cp_pairing_branded || []);
          const names = branded.map(bp => txData.find(x => String(x.item) === String(bp.sku_item))?.name).filter(Boolean);
          const justAdded = done.includes(tpl.cp_product);
          return (
            <div key={tpl.id} style={{ border: "1px solid " + S.border, borderRadius: 10, padding: 12, marginBottom: 8, display: "flex", justifyContent: "space-between", alignItems: "center", gap: 10 }}>
              <div style={{ minWidth: 0 }}>
                <div style={{ fontSize: 13, fontWeight: 700 }}>{tpl.cp_product}</div>
                <div style={{ fontSize: 11, color: S.muted, marginTop: 2 }}>
                  {tpl.rate_min === tpl.rate_max ? tpl.rate_min : tpl.rate_min + "–" + tpl.rate_max} {tpl.rate_unit}
                  {names.length > 0 ? " · pairs with " + names.join(", ") : " · no Branded partners yet"}
                </div>
              </div>
              <button onClick={() => copyTemplate(tpl)} disabled={busyKey === tpl.id || justAdded}
                style={{ flexShrink: 0, fontSize: 11, fontWeight: 700, color: S.onAccent, background: justAdded ? S.muted : S.green, border: "none", borderRadius: 8, padding: "7px 12px", cursor: justAdded ? "default" : "pointer", opacity: busyKey === tpl.id ? .6 : 1 }}>
                {justAdded ? "✓ Added" : busyKey === tpl.id ? "Adding…" : "+ Add"}
              </button>
            </div>
          );
        })}
      </div>
    </div>
  );
}

// "Request a Product" -- a user types the name of a Crop Protection
// product they'd like Nathan to add/pair, lands in cp_product_requests for
// admin triage from Manage Pairings.
function RequestCpProductModal({ activeLocation, locName, profile, onClose }) {
  const [name, setName] = useState("");
  const [note, setNote] = useState("");
  const [saving, setSaving] = useState(false);
  const [err, setErr] = useState("");
  const [sent, setSent] = useState(false);

  async function submit() {
    if (!name.trim()) { setErr("Enter the product name."); return; }
    setErr(""); setSaving(true);
    const { error } = await supabaseClient.from("cp_product_requests").insert({
      location_id: activeLocation, requested_by: profile?.id || null,
      requester_name: profile?.display_name || profile?.name || "", product_name: name.trim(),
      note: note.trim() || null,
    });
    setSaving(false);
    if (error) { setErr(error.message); return; }
    Analytics.track("cp_product_requested", { product: name.trim(), location: activeLocation });
    setSent(true);
  }

  return (
    <div style={{ position: "fixed", inset: 0, zIndex: 300, background: "rgba(0,0,0,.5)", display: "flex", alignItems: "flex-start", justifyContent: "center", overflowY: "auto", padding: "40px 14px" }} onClick={onClose}>
      <div onClick={e => e.stopPropagation()} style={{ width: "min(460px,100%)", background: S.card, border: "1px solid " + S.border, borderRadius: 14, padding: 18 }}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 6 }}>
          <strong style={{ fontSize: 15 }}>Request a Product — {locName}</strong>
          <button onClick={onClose} style={{ border: "none", background: "transparent", fontSize: 20, color: S.muted, cursor: "pointer" }}>&times;</button>
        </div>
        {sent ? (
          <div style={{ textAlign: "center", padding: "20px 0" }}>
            <div style={{ fontSize: 28, marginBottom: 8 }}>✅</div>
            <div style={{ fontSize: 13, fontWeight: 600, marginBottom: 4 }}>Sent to Nathan</div>
            <div style={{ fontSize: 11, color: S.muted }}>He'll set up "{name.trim()}" and its Branded pairing when he gets to it.</div>
          </div>
        ) : (
          <React.Fragment>
            <p style={{ fontSize: 11, color: S.muted, margin: "0 0 14px" }}>
              Not on the "Add CP Product" list yet? Tell Nathan which Crop Protection product you'd like added and paired up.
            </p>
            {err && <div style={{ color: "#ef4444", fontSize: 12, fontWeight: 600, marginBottom: 10 }}>{err}</div>}
            <input placeholder="Crop Protection product name" value={name} onChange={e => setName(e.target.value)}
              onFocus={e => e.target.select()} onMouseUp={e => e.preventDefault()}
              style={{ width: "100%", background: S.inputBg, border: "1px solid " + S.border, borderRadius: 8, color: S.text, fontSize: 13, padding: "8px 10px", outline: "none", boxSizing: "border-box", marginBottom: 8 }} />
            <textarea placeholder="Anything else to add? (optional — Branded partner you'd want paired with it, label rate, etc.)" value={note} onChange={e => setNote(e.target.value)}
              rows={3}
              style={{ width: "100%", background: S.inputBg, border: "1px solid " + S.border, borderRadius: 8, color: S.text, fontSize: 13, padding: "8px 10px", outline: "none", boxSizing: "border-box", marginBottom: 12, resize: "vertical", font: "inherit" }} />
            <div style={{ display: "flex", gap: 8 }}>
              <button onClick={submit} disabled={saving} style={{ fontSize: 12, fontWeight: 700, color: S.onAccent, background: S.amber, border: "none", borderRadius: 8, padding: "8px 14px", cursor: "pointer", opacity: saving ? .6 : 1 }}>
                {saving ? "Sending…" : "📩 Send Request"}
              </button>
              <button onClick={onClose} style={{ fontSize: 12, fontWeight: 700, color: S.muted, background: "transparent", border: "1px solid " + S.border, borderRadius: 8, padding: "8px 14px", cursor: "pointer" }}>Cancel</button>
            </div>
          </React.Fragment>
        )}
      </div>
    </div>
  );
}

function ManageCPPairings({ activeLocation, locName, txData, locations, pairings, onClose, onSaved }) {
  const [adding, setAdding] = useState(false);
  const [newName, setNewName] = useState("");
  const [newQtyUnit, setNewQtyUnit] = useState("gal");
  const [newRateUnit, setNewRateUnit] = useState("fl oz/ac");
  const [newRateMin, setNewRateMin] = useState("");
  const [newRateMax, setNewRateMax] = useState("");
  const [newDefaultQty, setNewDefaultQty] = useState("270");
  const [newDefaultGpa, setNewDefaultGpa] = useState("10");
  const [newLabelRate, setNewLabelRate] = useState("");
  const [saveErr, setSaveErr] = useState("");
  const [partnerSearch, setPartnerSearch] = useState({}); // cp_pairing_id -> search text

  // "Request a Product" triage -- every PENDING request across every
  // location, not just activeLocation, so nothing gets missed just because
  // the admin happens to have a different location picked above.
  const [requests, setRequests] = useState([]);
  const [requestsLoading, setRequestsLoading] = useState(true);
  async function loadRequests() {
    setRequestsLoading(true);
    const { data } = await supabaseClient.from("cp_product_requests").select("*").eq("status", "pending").order("created_at", { ascending: false });
    setRequests(data || []);
    setRequestsLoading(false);
  }
  useEffect(() => { loadRequests(); }, []);

  async function decideRequest(id, status) {
    setSaveErr("");
    const req = requests.find(r => r.id === id);
    const { error } = await supabaseClient.from("cp_product_requests").update({ status, decided_at: new Date().toISOString() }).eq("id", id);
    if (error) { setSaveErr(error.message); return; }
    Analytics.track("cp_request_decided", { product: req?.product_name, decision: status, requested_location: req?.location_id });
    loadRequests();
  }

  function addFromRequest(req) {
    setNewName(req.product_name);
    setAdding(true);
  }

  async function addCpProduct() {
    setSaveErr("");
    const rMin = parseFloat(newRateMin), rMax = parseFloat(newRateMax || newRateMin);
    if (!newName.trim() || !Number.isFinite(rMin)) { setSaveErr("Enter a product name and a rate."); return; }
    const { error } = await supabaseClient.from("cp_pairings").insert({
      location_id: activeLocation, cp_product: newName.trim(), qty_unit: newQtyUnit, rate_unit: newRateUnit,
      rate_min: rMin, rate_max: Number.isFinite(rMax) ? rMax : rMin,
      default_qty: parseFloat(newDefaultQty) || 270, default_gpa: parseFloat(newDefaultGpa) || 10,
      label_rate: newLabelRate.trim() || null, sort_order: pairings.length,
    });
    if (error) { setSaveErr(error.message); return; }
    Analytics.track("cp_admin_add_product", { product: newName.trim(), location: activeLocation });
    setNewName(""); setNewRateMin(""); setNewRateMax(""); setNewLabelRate(""); setAdding(false);
    onSaved();
  }

  async function removeCpProduct(id) {
    const row = pairings.find(r => r.id === id);
    if (!window.confirm("Remove this CP product and its paired Branded products for " + locName + "?")) return;
    setSaveErr("");
    const { error } = await supabaseClient.from("cp_pairings").delete().eq("id", id);
    if (error) { setSaveErr(error.message); return; }
    Analytics.track("cp_admin_remove_product", { product: row?.cp_product, location: activeLocation });
    onSaved();
  }

  // Every write below now surfaces its error into saveErr instead of failing
  // silently (2026-10-26 fix -- Nathan reported adding a Branded partner
  // "doesn't do anything", and none of these calls were checking `error` at
  // all, so a rejected write -- RLS, a bad sku_item, anything -- looked
  // identical to a successful no-op from the UI's point of view).
  async function addBrandedPartner(cpPairingId, p) {
    setSaveErr("");
    const cpRow = pairings.find(r => r.id === cpPairingId);
    const existing = cpRow?.cp_pairing_branded || [];
    const { error } = await supabaseClient.from("cp_pairing_branded").insert({ cp_pairing_id: cpPairingId, sku_item: p.item, sort_order: existing.length });
    if (error) { setSaveErr(error.message); return; }
    Analytics.track("cp_admin_add_partner", { cp_product: cpRow?.cp_product, partner: p.name, location: activeLocation });
    setPartnerSearch(prev => ({ ...prev, [cpPairingId]: "" }));
    onSaved();
  }

  async function removeBrandedPartner(id) {
    setSaveErr("");
    let cpProduct = null, partnerItem = null;
    for (const row of pairings) {
      const bp = (row.cp_pairing_branded || []).find(b => b.id === id);
      if (bp) { cpProduct = row.cp_product; partnerItem = bp.sku_item; break; }
    }
    const { error } = await supabaseClient.from("cp_pairing_branded").delete().eq("id", id);
    if (error) { setSaveErr(error.message); return; }
    Analytics.track("cp_admin_remove_partner", { cp_product: cpProduct, partner_item: partnerItem, location: activeLocation });
    onSaved();
  }

  return (
    <div style={{ position: "fixed", inset: 0, zIndex: 300, background: "rgba(0,0,0,.5)", display: "flex", alignItems: "flex-start", justifyContent: "center", overflowY: "auto", padding: "40px 14px" }} onClick={onClose}>
      <div onClick={e => e.stopPropagation()} style={{ width: "min(640px,100%)", background: S.card, border: "1px solid " + S.border, borderRadius: 14, padding: 18 }}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 12 }}>
          <strong style={{ fontSize: 15 }}>Manage CP Pairings — {locName}</strong>
          <button onClick={onClose} style={{ border: "none", background: "transparent", fontSize: 20, color: S.muted, cursor: "pointer" }}>&times;</button>
        </div>
        <p style={{ fontSize: 11, color: S.muted, margin: "0 0 14px" }}>
          This list is locked for the season — it won't change until you edit it here again, no matter what the sales data does.
        </p>
        {saveErr && <div style={{ color: "#ef4444", fontSize: 12, fontWeight: 600, background: "rgba(239,68,68,.1)", border: "1px solid rgba(239,68,68,.3)", borderRadius: 8, padding: "8px 10px", marginBottom: 12 }}>{saveErr}</div>}

        {!requestsLoading && requests.length > 0 && (
          <div style={{ border: "1px solid rgba(232,162,48,.35)", background: "rgba(232,162,48,.08)", borderRadius: 10, padding: 12, marginBottom: 14 }}>
            <div style={{ fontSize: 12, fontWeight: 800, color: S.amber, marginBottom: 8 }}>📩 Product Requests ({requests.length})</div>
            {requests.map(req => {
              const reqLocName = locations.find(l => l.id === req.location_id)?.name || req.location_id;
              return (
                <div key={req.id} style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", gap: 8, padding: "7px 0", borderTop: "1px solid rgba(232,162,48,.25)" }}>
                  <div style={{ minWidth: 0 }}>
                    <div style={{ fontSize: 12.5, fontWeight: 700 }}>{req.product_name}</div>
                    <div style={{ fontSize: 10.5, color: S.muted, marginTop: 1 }}>
                      {reqLocName}{req.requester_name ? " · " + req.requester_name : ""} · {new Date(req.created_at).toLocaleDateString()}
                    </div>
                    {req.note && <div style={{ fontSize: 11, color: S.muted, marginTop: 3, fontStyle: "italic" }}>"{req.note}"</div>}
                  </div>
                  <div style={{ display: "flex", gap: 6, flexShrink: 0 }}>
                    <button onClick={() => addFromRequest(req)} title="Pre-fill the Add CP Product form below with this name"
                      style={{ fontSize: 10, fontWeight: 700, color: S.onAccent, background: S.green, border: "none", borderRadius: 6, padding: "4px 8px", cursor: "pointer" }}>+ Add</button>
                    <button onClick={() => decideRequest(req.id, "done")} title="Mark done"
                      style={{ fontSize: 10, fontWeight: 700, color: S.green, background: "transparent", border: "1px solid rgba(76,175,106,.4)", borderRadius: 6, padding: "4px 8px", cursor: "pointer" }}>✓</button>
                    <button onClick={() => decideRequest(req.id, "dismissed")} title="Dismiss"
                      style={{ fontSize: 10, fontWeight: 700, color: S.muted, background: "transparent", border: "1px solid " + S.border, borderRadius: 6, padding: "4px 8px", cursor: "pointer" }}>✕</button>
                  </div>
                </div>
              );
            })}
          </div>
        )}

        {pairings.map(row => {
          const search = partnerSearch[row.id] || "";
          const results = search.trim().length >= 2
            ? txData.filter(p => p.name.toLowerCase().includes(search.toLowerCase())).slice(0, 8)
            : [];
          return (
            <div key={row.id} style={{ border: "1px solid " + S.border, borderRadius: 10, padding: 12, marginBottom: 10 }}>
              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 6 }}>
                <div>
                  <strong style={{ fontSize: 13 }}>{row.cp_product}</strong>
                  <span style={{ fontSize: 11, color: S.muted, marginLeft: 8 }}>
                    {row.rate_min === row.rate_max ? row.rate_min : row.rate_min + "–" + row.rate_max} {row.rate_unit}
                  </span>
                </div>
                <button onClick={() => removeCpProduct(row.id)} style={{ border: "none", background: "transparent", color: "#ef4444", fontSize: 11, cursor: "pointer" }}>Remove</button>
              </div>
              <div style={{ display: "flex", flexWrap: "wrap", gap: 6, marginBottom: 8 }}>
                {(row.cp_pairing_branded || []).map(bp => {
                  const p = txData.find(x => String(x.item) === String(bp.sku_item));
                  return (
                    <span key={bp.id} style={{ fontSize: 11, background: S.tag, border: "1px solid " + S.border, borderRadius: 999, padding: "3px 8px", display: "flex", alignItems: "center", gap: 5 }}>
                      {p?.name || bp.sku_item}{p?.pkg ? <span style={{ color: S.muted }}>· {p.pkg}</span> : null}
                      <span onClick={() => removeBrandedPartner(bp.id)} style={{ cursor: "pointer", color: S.muted }}>&times;</span>
                    </span>
                  );
                })}
              </div>
              <div style={{ fontSize: 10, color: S.amber, marginBottom: 5 }}>
                ⚠️ Read both labels before pairing — confirm the tank mix is legal and follows both labels' directions for use.
              </div>
              <div style={{ position: "relative" }}>
                <input type="search" placeholder="+ Add Branded partner (type to search)..." value={search}
                  onChange={e => setPartnerSearch(prev => ({ ...prev, [row.id]: e.target.value }))}
                  style={{ width: "100%", background: S.inputBg, border: "1px solid " + S.border, borderRadius: 8, color: S.text, fontSize: 13, padding: "7px 10px", outline: "none", boxSizing: "border-box" }} />
                {results.length > 0 && (
                  <div style={{ position: "absolute", top: "calc(100% + 4px)", left: 0, right: 0, zIndex: 10, background: S.card, border: "1px solid " + S.border, borderRadius: 8, maxHeight: 220, overflowY: "auto", boxShadow: "0 8px 24px rgba(0,0,0,.4)" }}>
                    {results.map(p => (
                      <div key={p.item} onClick={() => addBrandedPartner(row.id, p)}
                        style={{ padding: "8px 10px", cursor: "pointer", borderBottom: "1px solid " + S.border }}>
                        <div style={{ fontSize: 13, fontWeight: 600, color: S.text }}>{p.name}</div>
                        <div style={{ fontSize: 10.5, color: S.muted, marginTop: 1 }}>
                          {p.pkg ? p.pkg + " · " : ""}#{p.item}{p.rate_min != null ? " · " + p.rate_min + (p.rate_max !== p.rate_min ? "–" + p.rate_max : "") + " " + p.rate_unit : " · no rate data"}
                        </div>
                      </div>
                    ))}
                  </div>
                )}
              </div>
            </div>
          );
        })}

        <div style={{ borderTop: "1px solid " + S.border, paddingTop: 12, marginTop: 4 }}>
          {!adding ? (
            <button onClick={() => setAdding(true)} style={{ fontSize: 12, fontWeight: 700, color: S.onAccent, background: S.green, border: "none", borderRadius: 8, padding: "8px 14px", cursor: "pointer" }}>+ Add CP Product</button>
          ) : (
            <div>
              <div style={{ display: "grid", gridTemplateColumns: "2fr 1fr", gap: 8, marginBottom: 8 }}>
                <input placeholder="CP product name (e.g. Roundup PowerMax 3)" value={newName} onChange={e => setNewName(e.target.value)}
                  style={{ background: S.inputBg, border: "1px solid " + S.border, borderRadius: 8, color: S.text, fontSize: 13, padding: "8px 10px", outline: "none" }} />
                <select value={newQtyUnit} onChange={e => setNewQtyUnit(e.target.value)}
                  style={{ background: S.inputBg, border: "1px solid " + S.border, borderRadius: 8, color: S.text, fontSize: 13, padding: "8px 10px", outline: "none" }}>
                  <option value="gal">Liquid (gal, rated fl oz/ac)</option>
                  <option value="lb">Dry (lb, rated oz wt/ac)</option>
                </select>
              </div>
              <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1.2fr", gap: 8, marginBottom: 8 }}>
                <input placeholder="Rate min" type="number" value={newRateMin} onChange={e => setNewRateMin(e.target.value)}
                  style={{ background: S.inputBg, border: "1px solid " + S.border, borderRadius: 8, color: S.text, fontSize: 13, padding: "8px 10px", outline: "none" }} />
                <input placeholder="Rate max (optional)" type="number" value={newRateMax} onChange={e => setNewRateMax(e.target.value)}
                  style={{ background: S.inputBg, border: "1px solid " + S.border, borderRadius: 8, color: S.text, fontSize: 13, padding: "8px 10px", outline: "none" }} />
                <select value={newRateUnit} onChange={e => setNewRateUnit(e.target.value)}
                  style={{ background: S.inputBg, border: "1px solid " + S.border, borderRadius: 8, color: S.text, fontSize: 13, padding: "8px 10px", outline: "none" }}>
                  {CP_RATE_UNITS.map(u => <option key={u} value={u}>{u}</option>)}
                </select>
              </div>
              <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 8, marginBottom: 8 }}>
                <input placeholder="Default qty" type="number" value={newDefaultQty} onChange={e => setNewDefaultQty(e.target.value)}
                  style={{ background: S.inputBg, border: "1px solid " + S.border, borderRadius: 8, color: S.text, fontSize: 13, padding: "8px 10px", outline: "none" }} />
                <input placeholder="Default GPA" type="number" value={newDefaultGpa} onChange={e => setNewDefaultGpa(e.target.value)}
                  style={{ background: S.inputBg, border: "1px solid " + S.border, borderRadius: 8, color: S.text, fontSize: 13, padding: "8px 10px", outline: "none" }} />
              </div>
              <input placeholder="Label rate note (optional, e.g. source/context)" value={newLabelRate} onChange={e => setNewLabelRate(e.target.value)}
                style={{ width: "100%", background: S.inputBg, border: "1px solid " + S.border, borderRadius: 8, color: S.text, fontSize: 13, padding: "8px 10px", outline: "none", boxSizing: "border-box", marginBottom: 8 }} />
              {saveErr && <div style={{ color: "#ef4444", fontSize: 11, marginBottom: 8 }}>{saveErr}</div>}
              <div style={{ display: "flex", gap: 8 }}>
                <button onClick={addCpProduct} style={{ fontSize: 12, fontWeight: 700, color: S.onAccent, background: S.green, border: "none", borderRadius: 8, padding: "8px 14px", cursor: "pointer" }}>Save</button>
                <button onClick={() => setAdding(false)} style={{ fontSize: 12, fontWeight: 700, color: S.muted, background: "transparent", border: "1px solid " + S.border, borderRadius: 8, padding: "8px 14px", cursor: "pointer" }}>Cancel</button>
              </div>
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

// ═══ PROFITABILITY SHEET ═══
// Column config for the My Sheet table header row -- `key` is the sort key
// (matches the field name on each `rows` entry, or "name" for r.p.name);
// `key: null` marks non-sortable columns (drag handle, Notes, delete).
const SHEET_HEADERS = [
  { label: "", key: null },
  { label: "Product", key: "name" },
  { label: "Rate/ac", key: "rate" },
  { label: "Cost", key: "cost" },
  { label: "Price", key: "price" },
  { label: "Cost/ac", key: "costAc" },
  { label: "Price/ac", key: "priceAc" },
  { label: "Profit/ac", key: "profitAc" },
  { label: "Margin", key: "marginPct" },
  { label: "Notes", key: null },
  { label: "", key: null },
];

function ProfitSheet({ defaultDistrict, txData, natData, overridesMap, session, canEdit, isAdmin, seesAllDistricts, landedCosts, labelUrls, onCategoryChange, onBulkCategoryChange }) {
  const [dist, setDist] = useState(defaultDistrict === "wtx" ? "wtx" : "etx");
  const [tier, setTier] = useState("floor"); // wholesale | floor | target
  const [search, setSearch] = useState("");
  const [catFilter, setCatFilter] = useState("ALL");
  const [sheetItems, setSheetItems] = useState([]); // [{item, rate}]
  const [dragItem, setDragItem] = useState(null);
  const [dragOverItem, setDragOverItem] = useState(null);
  // Column sort for the My Sheet table. Sorts within each category group,
  // so it layers on top of (rather than replaces) the existing drag-to-
  // reorder-within-category feature -- drag is disabled while a sort is
  // active since the two ways of ordering rows would otherwise conflict.
  const [sortCol, setSortCol] = useState(null); // null | 'name' | 'rate' | 'cost' | 'price' | 'costAc' | 'priceAc' | 'profitAc' | 'marginPct'
  const [sortDir, setSortDir] = useState("desc"); // 'asc' | 'desc'
  function onSortClick(key) {
    if (sortCol === key) { setSortDir(d => d === "desc" ? "asc" : "desc"); }
    else { setSortCol(key); setSortDir(key === "name" ? "asc" : "desc"); }
  }
  const [showPrintPanel, setShowPrintPanel] = useState(false);
  const [printTitle, setPrintTitle] = useState("");
  const [printCols, setPrintCols] = useState({ rate: true, cost: false, price: true, priceLabel: true, costAc: false, priceAc: true, profitAc: false, marginPct: false, notes: false });
  const [printColors, setPrintColors] = useState(true);
  const [printShowSubheader, setPrintShowSubheader] = useState(true); // the "East TX · Wholesale pricing · <date>" line
  const [bidMode, setBidMode] = useState(false);
  // Bid Mode is a convenience action, not a locked/derived state -- checking
  // it hides the two internal-facing signals (price tier/edited label, the
  // district+tier subheader) that Nathan doesn't want a customer seeing on a
  // bid sheet; unchecking restores both. The two underlying checkboxes stay
  // independently editable at any time either way.
  function toggleBidMode(checked) {
    setBidMode(checked);
    setPrintCols(prev => ({ ...prev, priceLabel: !checked }));
    setPrintShowSubheader(!checked);
  }
  const searchRef = useRef(null);

  // ── N-Dure (UAN/Urea) sheet-wide comparison rate ──
  // Shared across every N-treatment row on the sheet so cost/price/ac stays
  // apples-to-apples between NDURE 2.0, DCD 25, and TRIPLE -- each product's
  // own qt/tn dosage (n_treat_low_rate / n_treat_urea_rate) still varies per
  // row via the existing Rate/ac cell; only the carrier application volume
  // (gal/ac of UAN or lbs/ac of urea) is synced. Defaults are the midpoint
  // of each range (10-30 gal/ac, 50-200 lbs/ac).
  const [nTreatBasis, setNTreatBasis] = useState("uan"); // "uan" | "urea"
  const [uanGalRate, setUanGalRate] = useState(20);
  const [ureaLbsRate, setUreaLbsRate] = useState(125);

  // ── Price dial-in (local what-if edits, never auto-written to Supabase) ──
  const [priceOverrides, setPriceOverrides] = useState({}); // key: "item|tier|dist" -> {item, productName, pkg, tier, dist, isNat, newPrice, originalPrice}
  const [showSavePrices, setShowSavePrices] = useState(false);
  const [emailedToFrank, setEmailedToFrank] = useState(false);
  const [generatedSql, setGeneratedSql] = useState("");

  // ── Cost dial-in (same local-edit-then-SQL pattern as price, but for
  //    landed_costs -- Nathan wants to punch in the real, actual landed
  //    cost he's paying at a location right on the sheet, then push it to
  //    the master landed_costs table once he's confirmed it's right. ──
  const [showSaveCosts, setShowSaveCosts] = useState(false);
  const [generatedCostSql, setGeneratedCostSql] = useState("");

  // Landed cost wins whenever it exists for this item+district, regardless
  // of price tier (including Wholesale) -- manufactured cost is only a
  // fallback for items/districts with no landed data at all. landedCosts is
  // loaded once at the App level and shared with ProductCard too.
  function costFor(p) {
    const landed = landedCosts[p.item]?.[dist];
    if (landed) return { cost: landed.avg_cost, source: "Landed", low: landed.low_cost, high: landed.high_cost, nLots: landed.n_lots };
    return { cost: p.cost, source: "Mfg" };
  }

  // ── Saved lists ──
  const [savedSheets, setSavedSheets] = useState([]);
  const [savedSheetsLoaded, setSavedSheetsLoaded] = useState(false);
  const [currentSheetId, setCurrentSheetId] = useState(null);
  const [currentSheetName, setCurrentSheetName] = useState("");
  const [showSaveDialog, setShowSaveDialog] = useState(false);
  const [saveNameInput, setSaveNameInput] = useState("");
  const [showLoadDialog, setShowLoadDialog] = useState(false);
  const [saveError, setSaveError] = useState("");

  // ── Category management ──
  const [editingCatItem, setEditingCatItem] = useState(null);
  const [showManageCats, setShowManageCats] = useState(false);
  const [catError, setCatError] = useState("");

  // ── Category pill order (shared, admin/manager-editable) ──
  const [catOrder, setCatOrder] = useState([]);
  const [catOrderLoaded, setCatOrderLoaded] = useState(false);
  const [dragCat, setDragCat] = useState(null);
  const [dragOverCat, setDragOverCat] = useState(null);
  const pillRowRef = useRef(null);

  useEffect(() => {
    if (catOrderLoaded) return;
    (async () => {
      const { data, error } = await supabaseClient.from("category_order").select("*").order("sort_order");
      if (!error) setCatOrder((data || []).map(r => r.category));
      setCatOrderLoaded(true);
    })();
  }, [catOrderLoaded]);

  async function reorderCategory(fromCat, toCat) {
    if (!fromCat || !toCat || fromCat === toCat) return;
    const current = cats.filter(c => c !== "ALL");
    const next = [...current];
    const fromIdx = next.indexOf(fromCat);
    const toIdx = next.indexOf(toCat);
    if (fromIdx === -1 || toIdx === -1) return;
    const [moved] = next.splice(fromIdx, 1);
    next.splice(toIdx, 0, moved);
    setCatOrder(next);
    const rows = next.map((c, i) => ({ category: c, sort_order: i, updated_at: new Date().toISOString() }));
    await supabaseClient.from("category_order").upsert(rows);
  }

  // ── Category colors (shared, admin/manager-editable) ──
  const [categoryColors, setCategoryColors] = useState({}); // { [category]: hex }
  const [categoryColorsLoaded, setCategoryColorsLoaded] = useState(false);

  useEffect(() => {
    if (categoryColorsLoaded) return;
    (async () => {
      const { data, error } = await supabaseClient.from("category_colors").select("*");
      if (!error) {
        const map = {};
        (data || []).forEach(r => { map[r.category] = r.color; });
        setCategoryColors(map);
      }
      setCategoryColorsLoaded(true);
    })();
  }, [categoryColorsLoaded]);

  function colorForCategory(cat) {
    return categoryColors[cat] || guessCategoryColor(cat);
  }

  // Translucent full-row tint for a category, e.g. "#e67e22" -> "#e67e2226" (~15% opacity).
  function catRowBg(cat) {
    return colorForCategory(cat) + "26";
  }

  async function setCategoryColorValue(cat, hex) {
    setCategoryColors(prev => ({ ...prev, [cat]: hex }));
    await supabaseClient.from("category_colors").upsert({ category: cat, color: hex, updated_at: new Date().toISOString() });
  }

  // Solid text color that reads on top of a solid category-color band --
  // simple relative-luminance check, not full WCAG math, just enough to
  // decide white vs. near-black for a header bar.
  function contrastTextFor(hex) {
    const h = (hex || "").replace("#", "");
    if (h.length < 6) return "#111";
    const r = parseInt(h.slice(0, 2), 16), g = parseInt(h.slice(2, 4), 16), b = parseInt(h.slice(4, 6), 16);
    const luminance = (0.299 * r + 0.587 * g + 0.114 * b) / 255;
    return luminance > 0.6 ? "#141e15" : "#ffffff";
  }

  // Groups a `rows`-shaped array (each with a `.p.cat`) into contiguous
  // category blocks, ordered to match the same catOrder the category pills
  // already use -- so "grouped by product type" always matches the order
  // Nathan already curated there, not just whatever order items were added
  // to the sheet in.
  function groupRowsByCategory(rowsIn) {
    const byCat = new Map();
    for (const r of rowsIn) {
      const cat = r.p.cat || "Uncategorized";
      if (!byCat.has(cat)) byCat.set(cat, []);
      byCat.get(cat).push(r);
    }
    const present = [...byCat.keys()];
    const ordered = catOrder.filter(c => present.includes(c));
    const rest = present.filter(c => !catOrder.includes(c)).sort();
    return [...ordered, ...rest].map(cat => ({ cat, items: byCat.get(cat) }));
  }

  // Sorts each category group's items in place by the active sort column --
  // 'name' compares product names A-Z/Z-A, everything else compares numeric
  // values high-low/low-high. Nulls (no data for that field) always sort to
  // the bottom regardless of direction. Leaves group order/composition
  // untouched, so this composes cleanly with the existing category grouping.
  function sortGroupItems(groups, col, dir) {
    if (!col) return groups;
    return groups.map(g => {
      const items = [...g.items].sort((a, b) => {
        const av = col === "name" ? a.p.name : a[col];
        const bv = col === "name" ? b.p.name : b[col];
        if (av == null && bv == null) return 0;
        if (av == null) return 1;
        if (bv == null) return -1;
        const cmp = typeof av === "string" ? av.localeCompare(bv) : av - bv;
        return dir === "asc" ? cmp : -cmp;
      });
      return { cat: g.cat, items };
    });
  }

  useEffect(() => {
    if (!session?.user?.id || savedSheetsLoaded) return;
    (async () => {
      const { data, error } = await supabaseClient.from("saved_sheets").select("*").eq("user_id", session.user.id).order("updated_at", { ascending: false });
      if (!error) setSavedSheets(data || []);
      setSavedSheetsLoaded(true);
    })();
  }, [session, savedSheetsLoaded]);

  async function saveSheet(asNew) {
    if (!saveNameInput.trim()) return;
    setSaveError("");
    const payload = {
      user_id: session.user.id,
      name: saveNameInput.trim(),
      items: sheetItems,
      district: dist,
      tier: tier,
      updated_at: new Date().toISOString(),
    };
    let result;
    if (currentSheetId && !asNew) {
      result = await supabaseClient.from("saved_sheets").update(payload).eq("id", currentSheetId).select().single();
    } else {
      result = await supabaseClient.from("saved_sheets").insert(payload).select().single();
    }
    if (result.error) { setSaveError(result.error.message); return; }
    setCurrentSheetId(result.data.id);
    setCurrentSheetName(result.data.name);
    setSavedSheets(prev => {
      const exists = prev.some(s => s.id === result.data.id);
      return exists ? prev.map(s => s.id === result.data.id ? result.data : s) : [result.data, ...prev];
    });
    setShowSaveDialog(false);
