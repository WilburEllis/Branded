// Solid colored divider row shown between category groups in My Sheet --
// click the label to rename the category (same renameCategoryEverywhere used
// in Manage Categories, just editable inline here too since that's the more
// natural place to fix a label while you're staring at a specific sheet).
//
// "Uncategorized" is a display-only fallback (groupRowsByCategory's
// `r.p.cat || "Uncategorized"`), not a real stored category -- no product
// actually has cat === "Uncategorized", so the normal rename flow would
// silently do nothing for this bucket (renameCategoryEverywhere looks up
// products BY that exact cat string). It gets a different click behavior
// instead: a dropdown of REAL categories that assigns every item currently
// sitting in this bucket to whichever one you pick (assignCategoryToItems).
function SheetGroupHeader({ cat, count, color, textColor, colSpan, onRename, allCats, onAssignCategory, canDrag, isAdmin, isDragging, isDragOver, onHandleDragStart, onHandleDragEnd, onRowDragOver, onRowDrop }) {
  const isUncat = cat === "Uncategorized";
  const [editing, setEditing] = useState(false);
  const [val, setVal] = useState(cat);
  const [saving, setSaving] = useState(false);
  const [picking, setPicking] = useState(false);
  const [pickErr, setPickErr] = useState("");
  async function commit() {
    if (!val.trim() || val.trim() === cat) { setEditing(false); return; }
    setSaving(true);
    await onRename(cat, val.trim());
    setSaving(false);
    setEditing(false);
  }
  async function commitAssign(newCat) {
    if (!newCat) { setPicking(false); return; }
    setSaving(true);
    setPickErr("");
    const err = await onAssignCategory(newCat);
    setSaving(false);
    if (err) { setPickErr(err); return; } // keep the picker open so the error is visible
    setPicking(false);
  }
  return (
    <tr onDragOver={onRowDragOver} onDrop={onRowDrop}
      style={{ opacity: isDragging ? .4 : 1, outline: isDragOver ? "2px solid " + S.blue : "none", outlineOffset: -2 }}>
      <td colSpan={colSpan} style={{ background: color, padding: "6px 10px" }}>
        {editing ? (
          <div style={{ display: "flex", alignItems: "center", gap: 6 }} onClick={e => e.stopPropagation()}>
            <input autoFocus value={val} onChange={e => setVal(e.target.value)}
              onKeyDown={e => { if (e.key === "Enter") commit(); if (e.key === "Escape") { setVal(cat); setEditing(false); } }}
              style={{ flex: 1, maxWidth: 260, background: "rgba(255,255,255,.15)", border: "1px solid " + textColor, borderRadius: 5, color: textColor, fontSize: 11, fontWeight: 800, padding: "3px 7px", outline: "none" }} />
            <button onClick={commit} disabled={saving} style={{ fontSize: 10, fontWeight: 700, color: color, background: textColor, border: "none", borderRadius: 5, padding: "3px 8px", cursor: "pointer" }}>{saving ? "..." : "Save"}</button>
            <button onClick={() => { setVal(cat); setEditing(false); }} style={{ fontSize: 10, color: textColor, background: "none", border: "none", cursor: "pointer", opacity: .8 }}>Cancel</button>
          </div>
        ) : picking ? (
          <div style={{ display: "flex", alignItems: "center", gap: 8, flexWrap: "wrap" }} onClick={e => e.stopPropagation()}>
            <div style={{ display: "flex", alignItems: "center", gap: 6 }}>
              {/* No onBlur-driven close here (unlike a typical dropdown) --
                  a stray blur while commitAssign is mid-flight, or right after
                  it surfaces an error, would silently close this and hide the
                  error message. Cancel button + a successful pick are the
                  only ways this closes, matching the rename input above,
                  which also has no onBlur close. */}
              <select autoFocus defaultValue="" disabled={saving}
                onChange={e => commitAssign(e.target.value)}
                style={{ fontSize: 11, fontWeight: 700, background: "rgba(255,255,255,.15)", color: textColor, border: "1px solid " + textColor, borderRadius: 5, padding: "3px 7px", outline: "none" }}>
                <option value="" disabled>{saving ? "Saving..." : "Choose a category..."}</option>
                {(allCats || []).map(c => <option key={c} value={c} style={{ color: "#000" }}>{c}</option>)}
              </select>
              <button onClick={() => { setPicking(false); setPickErr(""); }} style={{ fontSize: 10, color: textColor, background: "none", border: "none", cursor: "pointer", opacity: .8 }}>Cancel</button>
            </div>
            {pickErr && (
              <div style={{ fontSize: 10, color: "#fff", background: "#c0392b", border: "1px solid #922b21", borderRadius: 5, padding: "3px 8px", fontWeight: 600 }}>
                ⚠ {pickErr}
              </div>
            )}
          </div>
        ) : (
          <div style={{ display: "flex", alignItems: "center", gap: 7 }}>
            {canDrag && (
              <span draggable onDragStart={onHandleDragStart} onDragEnd={onHandleDragEnd}
                style={{ cursor: "grab", color: textColor, opacity: .75, fontSize: 14, userSelect: "none", touchAction: "none" }}
                title="Drag to reorder this product group">⠿</span>
            )}
            <div onClick={() => { if (isAdmin) isUncat ? setPicking(true) : setEditing(true); }}
              title={isAdmin ? (isUncat ? "Click to assign a category to everything below" : "Click to rename this category") : undefined}
              style={{ display: "flex", alignItems: "center", gap: 7, cursor: isAdmin ? "pointer" : "default" }}>
              <span style={{ fontSize: 11, fontWeight: 800, letterSpacing: .5, textTransform: "uppercase", color: textColor }}>{cat}</span>
              <span style={{ fontSize: 9, fontWeight: 600, color: textColor, opacity: .75 }}>{count} product{count === 1 ? "" : "s"}</span>
              <span style={{ fontSize: 10, color: textColor, opacity: .6 }}>{isUncat ? "▾ choose category" : "✎"}</span>
            </div>
          </div>
        )}
      </td>
    </tr>
  );
}

function CategoryRow({ cat, count, color, onRename, onColorChange }) {
  const [editing, setEditing] = useState(false);
  const [val, setVal] = useState(cat);
  const [saving, setSaving] = useState(false);
  const [showPicker, setShowPicker] = useState(false);
  async function commit() {
    if (!val.trim() || val.trim() === cat) { setEditing(false); return; }
    setSaving(true);
    await onRename(cat, val.trim());
    setSaving(false);
    setEditing(false);
  }
  return (
    <div style={{ padding: "8px 0", borderBottom: "1px solid " + S.border }}>
      <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
        {editing ? (
          <React.Fragment>
            <input autoFocus value={val} onChange={e => setVal(e.target.value)} onKeyDown={e => { if (e.key === "Enter") commit(); if (e.key === "Escape") { setVal(cat); setEditing(false); } }}
              style={{ flex: 1, background: S.inputBg, border: "1px solid " + S.blue, borderRadius: 6, color: S.text, fontSize: 12, padding: "6px 8px", outline: "none" }} />
            <button onClick={commit} disabled={saving} style={{ fontSize: 11, fontWeight: 700, color: S.onAccent, background: S.green, border: "none", borderRadius: 6, padding: "6px 10px", cursor: "pointer" }}>{saving ? "..." : "Save"}</button>
            <button onClick={() => { setVal(cat); setEditing(false); }} style={{ fontSize: 11, color: S.muted, background: "none", border: "none", cursor: "pointer" }}>Cancel</button>
          </React.Fragment>
        ) : (
          <React.Fragment>
            <button onClick={() => setShowPicker(v => !v)} title="Change color"
              style={{ width: 18, height: 18, borderRadius: "50%", background: color, border: "2px solid " + (showPicker ? S.text : "transparent"), cursor: "pointer", flexShrink: 0, padding: 0 }} />
            <div style={{ flex: 1, fontSize: 12, color: S.text }}>{cat}</div>
            <div style={{ fontSize: 10, color: S.muted }}>{count} product{count === 1 ? "" : "s"}</div>
            <button onClick={() => setEditing(true)} style={{ fontSize: 11, color: S.purple, background: "rgba(176,125,232,.1)", border: "1px solid rgba(176,125,232,.3)", borderRadius: 6, padding: "5px 9px", cursor: "pointer" }}>Rename</button>
          </React.Fragment>
        )}
      </div>
      {showPicker && !editing && (
        <div style={{ display: "flex", gap: 6, flexWrap: "wrap", marginTop: 8, paddingLeft: 26 }}>
          {CATEGORY_COLOR_PRESETS.map(sw => (
            <button key={sw.hex} title={sw.name} onClick={() => { onColorChange(cat, sw.hex); setShowPicker(false); }}
              style={{ width: 20, height: 20, borderRadius: "50%", background: sw.hex, border: "2px solid " + (color === sw.hex ? S.text : "transparent"), cursor: "pointer", padding: 0 }} />
          ))}
        </div>
      )}
    </div>
  );
}

// ═══ MAIN APP ═══
function App() {
  const [session, setSession] = useState(null);
  const [profile, setProfile] = useState(null);
  const [loginError, setLoginError] = useState("");
  const [loginLoading, setLoginLoading] = useState(false);
  const [initialLoading, setInitialLoading] = useState(true);
  const [connError, setConnError] = useState(null);
  const [isPasswordRecovery, setIsPasswordRecovery] = useState(false);
  const [whatsNewReleases, setWhatsNewReleases] = useState([]);
  const [whatsNewCatchup, setWhatsNewCatchup] = useState(false);

  const [txData, setTxData] = useState([]);
  const [natData, setNatData] = useState([]);
  const [landedCosts, setLandedCosts] = useState({}); // { [item]: { etx: {...}, wtx: {...} } } -- shared by ProductCard and ProfitSheet
  const [overridesMap, setOverridesMap] = useState({});
  const [locations, setLocations] = useState([]);
  const [organicNames, setOrganicNames] = useState(new Set());
  const [productInfo, setProductInfo] = useState({});
  const [labelUrls, setLabelUrls] = useState({});
  const [tillItBlendPrices, setTillItBlendPrices] = useState([]);
  const [commodityFertilizerPrices, setCommodityFertilizerPrices] = useState([]);
  const [accessRequests, setAccessRequests] = useState([]);

  const [search, setSearch] = useState("");
  const [view, setView] = useState("tx");
  const [catFilter, setCatFilter] = useState("ALL");
  const [appMode, setAppMode] = useState("prices");
  const searchRef = useRef(null);

  const [favorites, setFavorites] = useState(new Set()); // Set of sku_item integers

  // Pricing-section price overrides (2026-10-27, per Nathan): click-edit a
  // price straight on a product card in Price Lookup (not just inside the
  // Profit Sheet tool), building up a pending-changes list shown as a
  // persistent bottom-right indicator until pushed (Copy SQL) or reverted.
  // Deliberately separate state from ProfitSheet's own priceOverrides --
  // Sheet edits are scoped to a saved list/what-if session, this is a
  // direct "update the master price" action off the live catalog view.
  // Keyed "item|tier|dist" -> {item,productName,pkg,tier,dist,isNat,newPrice,dryOzPrice,ozPerUnit}.
  const [pricingOverrides, setPricingOverridesState] = useState({});
  const [showPricingSqlPanel, setShowPricingSqlPanel] = useState(false);
  const [pricingSql, setPricingSql] = useState("");

  function setPricingOverride(meta, tier, dist, isNat, newPrice) {
    const key = meta.item + "|" + tier + "|" + (dist || "any");
    setPricingOverridesState(prev => ({
      ...prev,
      [key]: { item: meta.item, productName: meta.productName, pkg: meta.pkg, tier, dist: dist || "any", isNat, newPrice, dryOzPrice: meta.dryOzPrice, ozPerUnit: meta.ozPerUnit },
    }));
    setPricingSql("");
  }
  function clearPricingOverride(key) {
    setPricingOverridesState(prev => { const n = { ...prev }; delete n[key]; return n; });
    setPricingSql("");
  }
  function clearAllPricingOverrides() {
    setPricingOverridesState({});
    setPricingSql("");
  }
  // Upsert-based, not INSERT-vs-UPDATE-guessed (2026-10-27 fix -- Nathan hit
  // a real "duplicate key value violates unique constraint
  // district_prices_sku_item_district_id_key" running the old SQL). Root
  // cause: `isNat` (w_target/e_target == null) only tells you that ONE
  // column is null, not whether a district_prices ROW exists at all -- a
  // row can perfectly well exist with target_price set and floor_price
  // still null (or vice versa). Editing the null column then generated a
  // bare INSERT, which collided with the row that already existed for the
  // OTHER column. Fixed by grouping target+floor edits by (item, district)
  // and emitting one `INSERT ... ON CONFLICT (sku_item, district_id) DO
  // UPDATE` per group covering whichever column(s) changed -- correct
  // whether the row already exists, is missing entirely, or (the floor/
  // target auto-sync's normal case) both columns are being written at once,
  // which would otherwise INSERT the same key twice and hit this exact
  // error on the second statement.
  function generatePricingSql() {
    const lines = [];
    const groups = {};
    Object.values(pricingOverrides).forEach(ov => {
      if (ov.tier === "wholesale") {
        const tag = ov.productName + (ov.pkg ? " (" + ov.pkg + ")" : "") + " · item #" + ov.item;
        const rawWholesale = (ov.dryOzPrice && ov.ozPerUnit) ? ov.newPrice / ov.ozPerUnit : ov.newPrice;
        lines.push(`UPDATE public.skus SET wholesale = ${rawWholesale} WHERE item = ${ov.item}; -- ${tag}`);
        return;
      }
      const gkey = ov.item + "|" + ov.dist;
      if (!groups[gkey]) groups[gkey] = { item: ov.item, dist: ov.dist, productName: ov.productName, pkg: ov.pkg };
      groups[gkey][ov.tier] = ov.newPrice;
    });
    Object.values(groups).forEach(g => {
      const tag = g.productName + (g.pkg ? " (" + g.pkg + ")" : "") + " · item #" + g.item;
      const cols = [], vals = [], updates = [];
      if (g.target != null) { cols.push("target_price"); vals.push(g.target); updates.push("target_price = EXCLUDED.target_price"); }
      if (g.floor != null) { cols.push("floor_price"); vals.push(g.floor); updates.push("floor_price = EXCLUDED.floor_price"); }
      lines.push(`INSERT INTO public.district_prices (sku_item, district_id, ${cols.join(", ")}) VALUES (${g.item}, '${g.dist}', ${vals.join(", ")}) ON CONFLICT (sku_item, district_id) DO UPDATE SET ${updates.join(", ")}; -- ${tag}`);
    });
    const sql = lines.join("\n");
    setPricingSql(sql);
    return sql;
  }

  // Light/dark skin toggle. S itself is mutated (see applyThemeMode) --
  // this state exists purely to force the re-render that picks the mutation up.
  const [themeMode, setThemeMode] = useState(loadThemeMode);
  function toggleThemeMode() {
    const next = themeMode === "light" ? "dark" : "light";
    applyThemeMode(next);
    setThemeMode(next);
    Analytics.track("theme_toggle", { mode: next });
  }

  useEffect(() => {
    let subscription;
    async function init() {
      try {
        const { data: { session: s } } = await supabaseClient.auth.getSession();
        setSession(s);
        if (!s) setInitialLoading(false);
        const { data: { subscription: sub } } = supabaseClient.auth.onAuthStateChange((event, s) => {
          // Following a password-reset email link fires this event with its
          // own temporary session -- flag it so the app shows the "set new
          // password" screen instead of just logging the recovery session
          // straight into the normal app.
          if (event === "PASSWORD_RECOVERY") setIsPasswordRecovery(true);
          setSession(s);
          if (!s) { setProfile(null); setInitialLoading(false); }
        });
        subscription = sub;
      } catch (err) {
        console.error("Init error:", err);
        setConnError("Could not connect to Supabase: " + (err.message || String(err)));
        setInitialLoading(false);
      }
    }
    init();
    return () => { if (subscription) subscription.unsubscribe(); };
  }, []);

  // Real bug fixed 2026-10-30: Nathan reported "glitching back to TX
  // Products" while sitting on another tab (Till-It Blends specifically).
  // Root cause -- this effect used to depend on the whole `session` object
  // (`[session]`). Supabase's client auto-refreshes the access token in the
  // background (and especially right when the browser tab regains focus
  // after a while away) -- `onAuthStateChange` fires on every refresh with
  // a brand-new session OBJECT for the SAME logged-in user, so `[session]`
  // looked "changed" by reference even though nothing about who's logged in
  // actually changed. That re-ran this entire effect: re-fetched the whole
  // catalog from scratch AND hit the `setView(...)` line at the bottom
  // unconditionally, which always resets to "tx"/"district" -- yanking
  // whoever was on Till-It Blends (or any other tab) straight back to
  // Products with no warning. It also silently double-logged spurious
  // "login" analytics events on every token refresh. Fixed by keying this
  // effect on `session?.user?.id` instead of the whole object -- that
  // string is stable across a token refresh (same user), so this only
  // re-runs on an ACTUAL sign-in/sign-out transition (id goes from
  // undefined to a real id, or vice versa), never on a background refresh.
  useEffect(() => {
    if (!session) return;
    async function loadAll() {
      try {
        const { data: prof, error: profErr } = await supabaseClient.from("profiles").select("*").eq("id", session.user.id).single();
        if (profErr) {
          console.error("Profile error:", profErr);
          setConnError("Logged in but no profile found for your user ID. You may need to add a row to the profiles table with id = " + session.user.id);
          setInitialLoading(false);
          return;
        }
        setProfile(prof);
        Analytics.setUser(prof, session.user.email);
        Analytics.track("login", { role: prof.role, district: prof.district });

        // "What's New" splash (2026-10-30, revised same day per Nathan: "users
        // who have not logged in since this feature existed can get the
        // update of everything new... hey its been a while, here is whats
        // new") -- a null last_seen_release (anyone who hasn't logged in
        // since this shipped) now shows EVERY release, not a silent catch-up,
        // with a tailored "it's been a while" subtitle (see `catchup` prop).
        // A known last_seen_release still only shows what's genuinely new
        // since that specific login.
        if (RELEASES.length > 0) {
          if (prof.last_seen_release == null) {
            setWhatsNewCatchup(true);
            setWhatsNewReleases(RELEASES);
          } else {
            const unseen = RELEASES.filter(r => r.id > prof.last_seen_release);
            if (unseen.length > 0) { setWhatsNewCatchup(false); setWhatsNewReleases(unseen); }
          }
        }

        const { data: tx } = await supabaseClient.from("v_tx_pricing").select("*").order("name");
        const { data: catOverrides } = await supabaseClient.from("product_category_overrides").select("*");
        const catOverrideMap = {};
        (catOverrides || []).forEach(o => { catOverrideMap[o.sku_item] = o.category; });
        setTxData((tx || []).map(p => catOverrideMap[p.item] ? { ...p, cat: catOverrideMap[p.item] } : p));

        const { data: nat } = await supabaseClient.from("national_prices").select("*").eq("active", true).order("name");
        // Same override merge as txData just above -- a category assigned to
        // a National-only product (see My Sheet's "Uncategorized" picker)
        // needs to survive a page reload too, not just the current session.
        setNatData((nat || []).map(p => catOverrideMap[p.item] ? { ...p, cat: catOverrideMap[p.item] } : p));

        const { data: landed } = await supabaseClient.from("landed_costs").select("*");
        const landedMap = {};
        (landed || []).forEach(row => {
          if (!landedMap[row.sku_item]) landedMap[row.sku_item] = {};
          landedMap[row.sku_item][row.district_id] = row;
        });
        setLandedCosts(landedMap);

        const { data: overrides } = await supabaseClient.from("v_location_overrides").select("*");
        const oMap = {};
        (overrides || []).forEach(o => { oMap[o.item + ":" + o.location_id] = o; });
        setOverridesMap(oMap);

        const { data: locs } = await supabaseClient.from("locations").select("*");
        setLocations(locs || []);

        const { data: orgSkus } = await supabaseClient.from("skus").select("name").eq("is_organic", true).eq("active", true);
        const { data: orgNat } = await supabaseClient.from("national_prices").select("name").eq("is_organic", true).eq("active", true);
        const allOrg = new Set([...(orgSkus || []).map(s => s.name), ...(orgNat || []).map(s => s.name)]);
        setOrganicNames(allOrg);

        const { data: pi } = await supabaseClient.from("product_info").select("*");
        const piMap = {};
        (pi || []).forEach(p => { piMap[p.name] = p; });
        setProductInfo(piMap);

        const { data: lu } = await supabaseClient.from("label_urls").select("*");
        const luMap = {};
        (lu || []).forEach(l => { luMap[l.name] = l.url; });
        setLabelUrls(luMap);

        const { data: tib } = await supabaseClient.from("till_it_blend_prices").select("*");
        setTillItBlendPrices(tib || []);

        const { data: cfp } = await supabaseClient.from("commodity_fertilizer_prices").select("*");
        setCommodityFertilizerPrices(cfp || []);

        const { data: favRows } = await supabaseClient.from("user_favorites").select("sku_item").eq("user_id", session.user.id);
        setFavorites(new Set((favRows || []).map(r => r.sku_item)));

        if (prof?.role === "admin") {
          const { data: reqs } = await supabaseClient.from("access_requests").select("*").order("requested_at", { ascending: false });
          setAccessRequests(reqs || []);
        }

        setView(prof?.role === "admin" || prof?.role === "viewer_admin" || isFullAccessManager(prof) ? "tx" : "district");
      } catch (err) {
        console.error("Load error:", err);
        setConnError("Error loading data: " + (err.message || String(err)));
      }
      setInitialLoading(false);
    }
    loadAll();
  }, [session?.user?.id]);

  const handleLogin = useCallback(async (email, password) => {
    setLoginLoading(true);
    setLoginError("");
    try {
      const { error } = await supabaseClient.auth.signInWithPassword({ email: email.trim(), password });
      if (error) setLoginError(error.message);
    } catch (err) {
      setLoginError("Connection error: " + (err.message || String(err)));
    }
    setLoginLoading(false);
  }, []);

  const handleLogout = useCallback(async () => {
    await supabaseClient.auth.signOut();
    setSession(null); setProfile(null);
    setSearch(""); setCatFilter("ALL"); setView("tx");
  }, []);

  function dismissWhatsNew() {
    setWhatsNewReleases([]);
    const latest = RELEASES[RELEASES.length - 1]?.id;
    if (latest) supabaseClient.rpc("set_last_seen_release", { p_release: latest }).then(() => {});
  }

  const refreshAccessRequests = useCallback(async () => {
    const { data: reqs } = await supabaseClient.from("access_requests").select("*").order("requested_at", { ascending: false });
    setAccessRequests(reqs || []);
  }, []);

  const txCats = useMemo(() => {
    const cats = [...new Set(txData.map(p => p.cat).filter(Boolean))].sort();
    return ["ALL", ...cats];
  }, [txData]);

  const natAlpha = ["ALL", "A-F", "G-L", "M-R", "S-Z"];

  const districtProducts = useMemo(() => {
    if (!profile || profile.role === "admin" || profile.role === "viewer_admin" || isFullAccessManager(profile)) return [];
    const dist = profile.district;
    const loc = profile.location_ids?.[0] || null;
    return txData.filter(p => hasDistrictPrice(p, dist, loc, overridesMap));
  }, [profile, txData, overridesMap]);

  const districtCats = useMemo(() => {
    const cats = [...new Set(districtProducts.map(p => p.cat).filter(Boolean))].sort();
    return ["ALL", ...cats];
  }, [districtProducts]);

  const natOnlyProducts = useMemo(() => {
    if (!profile || profile.role === "admin" || profile.role === "viewer_admin" || isFullAccessManager(profile)) return [];
    const txItems = new Set(districtProducts.map(p => p.item));
    const isSalesRep = profile.role !== "manager";
    // For sales reps: hide any national product where a district SKU target exceeds national target
    const hiddenNatNames = new Set();
    if (isSalesRep) {
      const dist = profile.district;
      txData.forEach(p => {
        const distTarget = dist === "wtx" ? p.w_target : p.e_target;
        const natMatch = natData.find(n => n.name === p.name);
        if (distTarget != null && natMatch?.nat_target != null && distTarget > natMatch.nat_target) {
          hiddenNatNames.add(p.name);
        }
      });
    }
    return natData.filter(p => !txItems.has(p.item) && p.nat_target != null && !hiddenNatNames.has(p.name));
  }, [profile, districtProducts, natData, txData]);

  const organicDistrict = useMemo(() => districtProducts.filter(p => organicNames.has(p.name)), [districtProducts, organicNames]);
  const organicNatOnly = useMemo(() => {
    const distNames = new Set(organicDistrict.map(p => p.name));
    return natData.filter(p => organicNames.has(p.name) && !distNames.has(p.name));
  }, [organicDistrict, natData, organicNames]);

  const filtered = useMemo(() => {
    const q = search.toLowerCase();
    const hasFullAccess = profile?.role === "admin" || profile?.role === "viewer_admin" || isFullAccessManager(profile);
    if (hasFullAccess) {
      if (view === "tx") return txData.filter(p => (catFilter === "ALL" || p.cat === catFilter) && (!q || p.name.toLowerCase().includes(q) || String(p.item).includes(q)));
      if (view === "nat") return natData.filter(p => {
        const first = p.name[0]?.toUpperCase();
        const mc = catFilter === "ALL" || (catFilter === "A-F" && first >= "A" && first <= "F") || (catFilter === "G-L" && first >= "G" && first <= "L") || (catFilter === "M-R" && first >= "M" && first <= "R") || (catFilter === "S-Z" && first >= "S" && first <= "Z");
        return mc && (!q || p.name.toLowerCase().includes(q) || String(p.item).includes(q));
      });
      if (view === "organic") {
        const txOrg = txData.filter(p => organicNames.has(p.name) && (!q || p.name.toLowerCase().includes(q)));
        const txOrgNames = new Set(txOrg.map(p => p.name));
        const natOrg = natData.filter(p => organicNames.has(p.name) && !txOrgNames.has(p.name) && (!q || p.name.toLowerCase().includes(q)));
        return { txOrg, natOrg };
      }
      if (view === "all") {
        const txItems = new Set(txData.map(p => p.item));
        const tf = txData.filter(p => !q || p.name.toLowerCase().includes(q) || String(p.item).includes(q));
        const nf = natData.filter(p => !txItems.has(p.item) && (!q || p.name.toLowerCase().includes(q) || String(p.item).includes(q)));
        return { tx: tf, nat: nf };
      }
    }
    if (view === "district") return districtProducts.filter(p => (catFilter === "ALL" || p.cat === catFilter) && (!q || p.name.toLowerCase().includes(q) || String(p.item).includes(q)));
    if (view === "national") return natOnlyProducts.filter(p => {
      const first = p.name[0]?.toUpperCase();
      const mc = catFilter === "ALL" || (catFilter === "A-F" && first >= "A" && first <= "F") || (catFilter === "G-L" && first >= "G" && first <= "L") || (catFilter === "M-R" && first >= "M" && first <= "R") || (catFilter === "S-Z" && first >= "S" && first <= "Z");
      return mc && (!q || p.name.toLowerCase().includes(q) || String(p.item).includes(q));
    });
    if (view === "organic") {
      const od = organicDistrict.filter(p => !q || p.name.toLowerCase().includes(q));
      const on = organicNatOnly.filter(p => !q || p.name.toLowerCase().includes(q));
      return { district: od, natOnly: on };
    }
    return [];
  }, [profile, view, catFilter, search, txData, natData, districtProducts, natOnlyProducts, organicDistrict, organicNatOnly, organicNames]);

  const groupByName = (arr) => {
    const g = {}; arr.forEach(p => { if (!g[p.name]) g[p.name] = []; g[p.name].push(p); });
    return Object.entries(g).sort((a, b) => a[0].localeCompare(b[0]));
  };

  if (connError) return <ErrorScreen error={connError} onRetry={() => window.location.reload()} />;
  if (isPasswordRecovery) return <ResetPasswordScreen onDone={() => setIsPasswordRecovery(false)} />;
  if (initialLoading) return <LoadingScreen />;
  if (!session) return <LoginScreen onLogin={handleLogin} error={loginError} loading={loginLoading} />;
  if (!profile) return <LoadingScreen />;

  const isAdmin = profile.role === "admin" || profile.role === "viewer_admin";
  // A full-access manager (see isFullAccessManager()) gets the same BREADTH
  // as admin -- both districts, every location, admin-style product/Sheet/
  // Calculator views -- but none of admin's actions. Every breadth-related
  // gate below uses hasFullAccess; every action-gated check (Category
  // management, Access Requests, Analytics) stays on the real isAdmin/
  // profile.role checks, untouched.
  const isFullManager = isFullAccessManager(profile);
  const hasFullAccess = isAdmin || isFullManager;
  const hideCost = profile.role === "viewer_admin";
  // Sheet/Ladder/category-editing access: Admin + Manager roles only. NOT the
  // same gate as hideCost -- hideCost only governs the admin-style card's
  // cost cells for viewer_admin; it does NOT exclude sales/viewer roles from
  // anything, because those roles never reach the cost-bearing card branch
  // in the first place (isAdmin gates that separately). Sheet mode is a new
  // surface that needed its own explicit role check.
  const canUseSheet = profile.role === "admin" || profile.role === "manager";
  const dist = profile.district;
  const loc = profile.location_ids?.[0] || null;
  const locIds = profile.location_ids || [];
  const isManager = locIds.length > 1;
  const districtLabel = isManager ? (dist === "wtx" ? "West TX Manager" : "East TX Manager") : loc ? (locations.find(l => l.id === loc)?.name || dist) : dist === "wtx" ? "West Texas" : "East Texas";

  const tabs = hasFullAccess ? [
    { key: "tx", label: "TX Products" }, { key: "tillit", label: "TILL-IT BLENDS", color: S.amber },
    { key: "nat", label: "National Ref" },
    { key: "all", label: "All" }, { key: "organic", label: "◆ Organic", color: "#4ade80" },
    { key: "favorites", label: "⭐ Favorites", color: "#f59e0b" },
  ] : [
    { key: "district", label: districtLabel + " Products" }, { key: "tillit", label: "TILL-IT BLENDS", color: S.amber },
    { key: "national", label: "National Ref" },
    { key: "organic", label: "◆ Organic", color: "#4ade80" },
    { key: "favorites", label: "⭐ Favorites", color: "#f59e0b" },
  ];

  const pills = hasFullAccess
    ? (view === "tx" ? txCats : view === "nat" ? natAlpha : view === "organic" ? ["ALL"] : txCats)
    : (view === "district" ? districtCats : view === "national" ? natAlpha : ["ALL"]);

  const cardProps = { overridesMap, organicNames, productInfo, labelUrls, allLocations: locations, favorites, onToggleFavorite: toggleFavorite, landedCosts, pricingOverrides, setPricingOverride, clearPricingOverride };

  async function toggleFavorite(item) {
    const userId = session?.user?.id;
    if (!userId) return;
    const isFav = favorites.has(item);
    // Optimistic update
    setFavorites(prev => { const n = new Set(prev); isFav ? n.delete(item) : n.add(item); return n; });
    if (isFav) {
      await supabaseClient.from("user_favorites").delete().eq("user_id", userId).eq("sku_item", item);
    } else {
      await supabaseClient.from("user_favorites").insert({ user_id: userId, sku_item: item });
    }
  }

  let content = null;
  let countText = "";

  if (hasFullAccess) {
    if (view === "tillit") {
      countText = "Real cost/floor pricing pulled from FertHub";
      content = <TillItBlendsView tillItBlendPrices={tillItBlendPrices} isAdmin={hasFullAccess} isManager={isManager} profile={profile} locations={locations} labelUrls={labelUrls} hideCost={hideCost} />;
    } else if (view === "tx") {
      const groups = groupByName(filtered);
      countText = groups.length + " products · " + filtered.length + " SKUs";
      content = groups.map(([n, items]) => items.map(p => <ProductCard key={p.item} p={p} isAdmin={true} hideCost={hideCost} {...cardProps} />));
    } else if (view === "nat") {
      const groups = groupByName(filtered);
      countText = groups.length + " products · " + filtered.length + " SKUs";
      content = groups.map(([n, items]) => items.map(p => <ProductCard key={p.item} p={p} isAdmin={true} isNational={true} hideCost={hideCost} {...cardProps} />));
    } else if (view === "organic") {
      const { txOrg, natOrg } = filtered;
      const txG = groupByName(txOrg); const natG = groupByName(natOrg);
      countText = (txG.length + natG.length) + " organic products";
      content = (<React.Fragment>
        {txG.map(([n, items]) => items.map(p => <ProductCard key={p.item} p={p} isAdmin={true} hideCost={hideCost} {...cardProps} />))}
        {natG.length > 0 && <div style={{ fontSize: 10, color: S.muted, letterSpacing: 1, textTransform: "uppercase", padding: "10px 2px 5px", borderTop: "1px solid " + S.border, marginTop: 4 }}>NATIONAL REF ONLY — {natG.length} more</div>}
        {natG.map(([n, items]) => items.map(p => <ProductCard key={p.item} p={p} isAdmin={true} isNational={true} hideCost={hideCost} {...cardProps} />))}
      </React.Fragment>);
    } else if (view === "all") {
      const { tx, nat } = filtered;
      const txG = groupByName(tx); const natG = groupByName(nat);
      countText = (txG.length + natG.length) + " products · " + (tx.length + nat.length) + " SKUs";
      content = (<React.Fragment>
        {txG.map(([n, items]) => items.map(p => <ProductCard key={p.item} p={p} isAdmin={true} hideCost={hideCost} {...cardProps} />))}
        {natG.length > 0 && <div style={{ fontSize: 10, color: S.muted, letterSpacing: 1, textTransform: "uppercase", padding: "10px 2px 5px", borderTop: "1px solid " + S.border, marginTop: 4 }}>NATIONAL REF ONLY — {natG.length} more</div>}
        {natG.map(([n, items]) => items.map(p => <ProductCard key={p.item} p={p} isAdmin={true} isNational={true} hideCost={hideCost} {...cardProps} />))}
      </React.Fragment>);
    } else if (view === "favorites") {
      const favItems = txData.filter(p => favorites.has(p.item));
      const favGroups = groupByName(favItems);
      countText = favGroups.length + " favorites · " + favItems.length + " SKUs";
      content = favGroups.length > 0
        ? favGroups.map(([n, items]) => items.map(p => <ProductCard key={p.item} p={p} isAdmin={true} hideCost={hideCost} {...cardProps} />))
        : <div style={{ textAlign: "center", padding: "60px 20px", color: S.muted }}><div style={{ fontSize: 36, marginBottom: 12 }}>⭐</div><div style={{ fontSize: 14, fontWeight: 600, marginBottom: 6 }}>No favorites yet</div><div style={{ fontSize: 12 }}>Tap the star on any product card to save it here</div></div>;
    }
  } else {
    if (view === "tillit") {
      countText = "Real cost/floor pricing pulled from FertHub";
      content = <TillItBlendsView tillItBlendPrices={tillItBlendPrices} isAdmin={isAdmin} isManager={isManager} profile={profile} locations={locations} labelUrls={labelUrls} hideCost={hideCost} />;
    } else if (view === "district") {
      const groups = groupByName(filtered);
      countText = groups.length + " products · " + filtered.length + " SKUs";
      content = groups.map(([n, items]) => items.map(p => <ProductCard key={p.item} p={p} district={dist} location={loc} isManager={isManager} locationIds={locIds} {...cardProps} />));
    } else if (view === "national") {
      const groups = groupByName(filtered);
      countText = groups.length + " products · " + filtered.length + " SKUs";
      content = groups.map(([n, items]) => items.map(p => <ProductCard key={p.item} p={p} district={dist} location={loc} isNational={true} isManager={isManager} locationIds={locIds} {...cardProps} />));
    } else if (view === "organic") {
      const { district: od, natOnly: on } = filtered;
      const dG = groupByName(od); const nG = groupByName(on);
      countText = (dG.length + nG.length) + " organic products";
      content = (<React.Fragment>
        {dG.map(([n, items]) => items.map(p => <ProductCard key={p.item} p={p} district={dist} location={loc} isManager={isManager} locationIds={locIds} {...cardProps} />))}
        {nG.length > 0 && <div style={{ fontSize: 10, color: S.muted, letterSpacing: 1, textTransform: "uppercase", padding: "10px 2px 5px", borderTop: "1px solid " + S.border, marginTop: 4 }}>NATIONAL REF ONLY — {nG.length} more</div>}
        {nG.map(([n, items]) => items.map(p => <ProductCard key={p.item} p={p} district={dist} location={loc} isNational={true} isManager={isManager} locationIds={locIds} {...cardProps} />))}
      </React.Fragment>);
    } else if (view === "favorites") {
      const favItems = districtProducts.filter(p => favorites.has(p.item));
      const favGroups = groupByName(favItems);
      countText = favGroups.length + " favorites · " + favItems.length + " SKUs";
      content = favGroups.length > 0
        ? favGroups.map(([n, items]) => items.map(p => <ProductCard key={p.item} p={p} district={dist} location={loc} isManager={isManager} locationIds={locIds} {...cardProps} />))
        : <div style={{ textAlign: "center", padding: "60px 20px", color: S.muted }}><div style={{ fontSize: 36, marginBottom: 12 }}>⭐</div><div style={{ fontSize: 14, fontWeight: 600, marginBottom: 6 }}>No favorites yet</div><div style={{ fontSize: 12 }}>Tap the star on any product card to save it here</div></div>;
    }
  }

  return (
    <div style={{ minHeight: "100vh", background: S.bg, color: S.text, fontFamily: "-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" }}>
      <WhatsNewSplash releases={whatsNewReleases} catchup={whatsNewCatchup} onDismiss={dismissWhatsNew} />
      <header style={{ background: S.headerBg, borderBottom: "2px solid " + S.greenDim, padding: "12px 14px 8px", position: "sticky", top: 0, zIndex: 100 }}>
        <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 8 }}>
          <div>
            <div style={{ fontSize: 18, fontWeight: 800, color: appMode === "calc" ? S.amber : appMode === "analytics" ? S.purple : appMode === "sheet" ? S.blue : S.green, letterSpacing: .5, textTransform: "uppercase" }}>{appMode === "calc" ? "🖩 Blend Calculator" : appMode === "analytics" ? "📊 Analytics" : appMode === "sheet" ? "🧮 Profit Sheet" : "$ Price Lookup"}</div>
            <div style={{ fontSize: 10, color: S.muted, letterSpacing: 2, textTransform: "uppercase", marginTop: 1 }}>2026 TX Branded · Wilbur-Ellis{hasFullAccess ? "" : " · " + districtLabel}</div>
          </div>
          <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
            {profile.role === "admin" && (
              <button onClick={() => { setAppMode(appMode === "access" ? "prices" : "access"); }}
                title="Access Requests"
                style={{ position: "relative", fontSize: 10, fontWeight: 700, color: appMode === "access" ? S.onAccent : S.amber, background: appMode === "access" ? S.amber : "rgba(232,162,48,.1)", border: "1px solid " + (appMode === "access" ? S.amber : "rgba(232,162,48,.3)"), padding: "4px 8px", borderRadius: 6, cursor: "pointer", letterSpacing: .5 }}>
                🔔
                {accessRequests.filter(r => r.status === "pending").length > 0 && (
                  <span style={{ position: "absolute", top: -5, right: -5, fontSize: 9, fontWeight: 800, color: "#fff", background: "#ef4444", borderRadius: 10, padding: "1px 5px", lineHeight: 1.4 }}>
                    {accessRequests.filter(r => r.status === "pending").length}
                  </span>
                )}
              </button>
            )}
            {profile.role === "admin" && (
              <button onClick={() => { setAppMode(appMode === "analytics" ? "prices" : "analytics"); }}
                style={{ fontSize: 10, fontWeight: 700, color: appMode === "analytics" ? S.onAccent : S.purple, background: appMode === "analytics" ? S.purple : "rgba(176,125,232,.1)", border: "1px solid " + (appMode === "analytics" ? S.purple : "rgba(176,125,232,.3)"), padding: "4px 8px", borderRadius: 6, cursor: "pointer", letterSpacing: .5 }}>
                📊
              </button>
            )}
            {canUseSheet && (
              <button onClick={() => { const next = appMode === "sheet" ? "prices" : "sheet"; setAppMode(next); Analytics.track("page_view", { mode: next }); }}
                style={{ fontSize: 10, fontWeight: 700, color: appMode === "sheet" ? S.onAccent : S.blue, background: appMode === "sheet" ? S.blue : "rgba(91,155,213,.1)", border: "1px solid " + (appMode === "sheet" ? S.blue : "rgba(91,155,213,.3)"), padding: "4px 10px", borderRadius: 6, cursor: "pointer", display: "flex", alignItems: "center", gap: 4, letterSpacing: .5, transition: "all .2s" }}>
                {appMode === "sheet" ? "$ PRICES" : "🧮 SHEET"}
              </button>
            )}
            <button onClick={() => { const next = appMode === "prices" ? "calc" : "prices"; setAppMode(next); Analytics.track("page_view", { mode: next }); }}
              style={{ fontSize: 10, fontWeight: 700, color: appMode === "calc" ? S.onAccent : S.amber, background: appMode === "calc" ? S.amber : "rgba(232,162,48,.1)", border: "1px solid " + (appMode === "calc" ? S.amber : "rgba(232,162,48,.3)"), padding: "4px 10px", borderRadius: 6, cursor: "pointer", display: "flex", alignItems: "center", gap: 4, letterSpacing: .5, transition: "all .2s" }}>
              {appMode === "calc" ? "$ PRICES" : "🖩 CALC"}
            </button>
            <button onClick={toggleThemeMode} title={themeMode === "light" ? "Switch to dark mode" : "Switch to light mode"}
              style={{ fontSize: 13, color: S.muted, background: S.tag, border: "1px solid " + S.border, padding: "3px 8px", borderRadius: 4, cursor: "pointer", lineHeight: 1.4 }}>
              {themeMode === "light" ? "🌙" : "☀️"}
            </button>
            <button onClick={handleLogout} style={{ fontSize: 10, color: "#ef4444", background: "rgba(239,68,68,.1)", border: "1px solid rgba(239,68,68,.2)", padding: "3px 8px", borderRadius: 4, cursor: "pointer" }}>Logout</button>
          </div>
        </div>
        {appMode === "prices" && (<React.Fragment>
        <div style={{ position: "relative" }}>
          <input ref={searchRef} type="search" placeholder="Search product or item #..." value={search} onChange={e => { setSearch(e.target.value); if (e.target.value.length >= 3) Analytics.trackSearch(e.target.value); }}
            style={{ width: "100%", background: S.inputBg, border: "1.5px solid " + S.border, borderRadius: 8, color: S.text, fontSize: 16, padding: "9px 36px 9px 12px", outline: "none", boxSizing: "border-box" }} />
          {search && <button onClick={() => { setSearch(""); searchRef.current?.focus(); }} style={{ position: "absolute", right: 10, top: "50%", transform: "translateY(-50%)", background: "none", border: "none", color: S.muted, fontSize: 16, cursor: "pointer" }}>✕</button>}
        </div>
        <div style={{ overflowX: "auto", scrollbarWidth: "none", marginTop: 8 }}>
          <div style={{ display: "flex", borderBottom: "1px solid " + S.border, minWidth: "max-content" }}>
            {tabs.map(t => (
              <div key={t.key} onClick={() => { setView(t.key); setCatFilter("ALL"); Analytics.track("page_view", { tab: t.key }); }}
                style={{ fontSize: 11, color: view === t.key ? (t.color || S.green) : S.muted, padding: "6px 14px", cursor: "pointer", borderBottom: "2px solid " + (view === t.key ? (t.color || S.green) : "transparent"), whiteSpace: "nowrap", letterSpacing: .5, textTransform: "uppercase", userSelect: "none" }}>
                {t.label}
              </div>
            ))}
          </div>
        </div>
        </React.Fragment>)}
      </header>

      {appMode === "prices" && !(hasFullAccess && view === "all") && view !== "tillit" && (
        <div style={{ display: "flex", gap: 5, overflowX: "auto", padding: "8px 14px 2px", scrollbarWidth: "none" }}>
          {pills.map(c => (
            <button key={c} onClick={() => setCatFilter(c)}
              style={{ fontSize: 10, background: c === catFilter ? S.greenDim : S.tag, border: "1px solid " + (c === catFilter ? S.green : S.border), color: c === catFilter ? "#fff" : S.muted, borderRadius: 20, padding: "5px 11px", whiteSpace: "nowrap", cursor: "pointer", letterSpacing: .5, textTransform: "uppercase", flexShrink: 0 }}>
              {c === "ALL" ? "All" : c}
            </button>
          ))}
        </div>
      )}

      {appMode === "prices" && (
      <div style={{ padding: "6px 12px 80px" }}>
        <div style={{ fontSize: 10, color: S.muted, letterSpacing: 1, textTransform: "uppercase", padding: "5px 0 6px" }}>{countText}</div>
        {content}
      </div>
      )}

      {appMode === "calc" && (
        <BlendCalculator profile={profile} district={dist} location={loc} txData={txData} overridesMap={overridesMap} hideCost={hideCost} locations={locations} labelUrls={labelUrls} isAdmin={hasFullAccess} tillItBlendPrices={tillItBlendPrices} commodityFertilizerPrices={commodityFertilizerPrices} isManager={isManager} locationIds={locIds} />
      )}

      {canUseSheet && (
        <div style={{ display: appMode === "sheet" ? "block" : "none" }}>
          <ProfitSheet defaultDistrict={dist} txData={txData} natData={natData} overridesMap={overridesMap} session={session} canEdit={canUseSheet} isAdmin={isAdmin} seesAllDistricts={hasFullAccess} landedCosts={landedCosts} labelUrls={labelUrls}
            onCategoryChange={(item, newCat) => {
              // A recategorized product might be sourced from either list --
              // e.g. a National-search item added to a sheet lives in natData,
              // not txData -- so both need patching for the change to
              // actually show up wherever that item is currently rendered.
              setTxData(prev => prev.map(p => p.item === item ? { ...p, cat: newCat } : p));
              setNatData(prev => prev.map(p => p.item === item ? { ...p, cat: newCat } : p));
            }}
            onBulkCategoryChange={(oldCat, newCat) => {
              setTxData(prev => prev.map(p => p.cat === oldCat ? { ...p, cat: newCat } : p));
              setNatData(prev => prev.map(p => p.cat === oldCat ? { ...p, cat: newCat } : p));
            }} />
        </div>
      )}

      {appMode === "analytics" && (
        <AnalyticsDashboard />
      )}

      {appMode === "access" && isAdmin && (
        <AccessRequestsPanel requests={accessRequests} onRefresh={refreshAccessRequests} locations={locations} />
      )}

      {/* Pending Price Lookup edits -- stays put (any appMode/tab) until
          pushed or reverted, same "don't lose it on navigation" fix already
          applied to the Sheet. Admin-only, matching who can edit a cell. */}
      {isAdmin && Object.keys(pricingOverrides).length > 0 && (
        <button onClick={() => { Analytics.track("price_changes_panel_opened", { count: Object.keys(pricingOverrides).length }); setShowPricingSqlPanel(true); }}
          style={{ position: "fixed", right: 16, bottom: 16, zIndex: 400, display: "flex", alignItems: "center", gap: 8, background: "linear-gradient(135deg,#8a1f1f,#c23b3b)", color: "#fff", border: "none", borderRadius: 999, padding: "12px 18px", fontSize: 13, fontWeight: 700, cursor: "pointer", boxShadow: "0 10px 28px rgba(194,59,59,.45)" }}>
          💰 {Object.keys(pricingOverrides).length} Price Change{Object.keys(pricingOverrides).length === 1 ? "" : "s"} Pending
        </button>
      )}
      {showPricingSqlPanel && (
        <PricingSqlPanel overrides={pricingOverrides} sql={pricingSql}
          onGenerate={generatePricingSql}
          onClearOne={clearPricingOverride}
          onClearAll={clearAllPricingOverrides}
          onClose={() => setShowPricingSqlPanel(false)} />
      )}
    </div>
  );
}

// ═══ PENDING PRICE CHANGES REVIEW PANEL ═══
// Lists every pending Price Lookup edit (product, tier/district, was -> now),
// lets Nathan drop a single one, generate + copy the exact SQL to paste into
// the Supabase SQL Editor, or discard everything. Same shape as ProfitSheet's
// "Save Prices" panel, just triggered from the floating bottom-right button
// instead of a toolbar button, since edits can originate from any product
// card in a long scrollable list.
// Frank Moore (Pricing) gets a plain-English email of just the FLOOR price
// changes -- not the SQL, not Target/Wholesale -- per Nathan 2026-10-27.
const PRICING_EMAIL_TO = "FMoore@wilburellis.com";

function PricingSqlPanel({ overrides, sql, onGenerate, onClearOne, onClearAll, onClose }) {
  const [copied, setCopied] = useState(false);
  const [emailed, setEmailed] = useState(false);
  const rows = Object.entries(overrides);
  // Floor + Wholesale go to Frank -- Target doesn't (2026-10-27, Nathan
  // asked to add Wholesale alongside the Floor changes already in here).
  // Sorted by item then Floor-before-Wholesale so each product's two lines
  // land next to each other instead of scattered in override-insertion order.
  const emailRows = rows.filter(([key, ov]) => ov.tier === "floor" || ov.tier === "wholesale")
    .sort((a, b) => (a[1].item - b[1].item) || (a[1].tier === b[1].tier ? 0 : a[1].tier === "floor" ? -1 : 1));
  async function copySql() {
    const text = sql || onGenerate();
    Analytics.track("price_sql_copied", { count: rows.length });
    try { await navigator.clipboard.writeText(text); setCopied(true); setTimeout(() => setCopied(false), 2000); } catch (e) {}
  }
  // Opens a ready-to-send email in whatever the OS's default mail client is
  // (Outlook included, if that's the default) via a plain mailto: link --
  // the one thing a static local HTML page can trigger with no API/OAuth
  // setup. Also copies the same text to the clipboard as a fallback, in
  // case the mail client doesn't pick up a long mailto body cleanly.
  async function emailPricesToFrank() {
    const today = new Date().toLocaleDateString("en-US", { month: "long", day: "numeric", year: "numeric" });
    // Exact template Nathan asked for (2026-10-27) -- Floor and Wholesale
    // use two different label shapes on purpose: Floor spells out the full
    // district before the word "Floor" ("(East TX) Floor: $X.XX"),
    // Wholesale abbreviates it folded into one parenthetical with the word
    // "Wholesale" ("(E TX Wholesale): $X.XX").
    const lines = emailRows.map(([key, ov]) => {
      const full = ov.dist === "wtx" ? "West TX" : ov.dist === "etx" ? "East TX" : ov.dist;
      const abbrev = ov.dist === "wtx" ? "W TX" : ov.dist === "etx" ? "E TX" : ov.dist;
      const head = `${ov.productName}${ov.pkg ? " (" + ov.pkg + ")" : ""} — Item #${ov.item} — `;
      return ov.tier === "wholesale"
        ? `${head}(${abbrev} Wholesale): $${ov.newPrice.toFixed(2)}`
        : `${head}(${full}) Floor: $${ov.newPrice.toFixed(2)} `;
    });
    const body = `Hey Frank,\n\nPlease update the following Floor and Wholesale prices for ${today}:\n\n${lines.join("\n")}\n\nThanks,\nNathan`;
    Analytics.track("price_email_frank", { count: emailRows.length });
    try { await navigator.clipboard.writeText(body); setEmailed(true); setTimeout(() => setEmailed(false), 2500); } catch (e) {}
    const mailto = "mailto:" + PRICING_EMAIL_TO + "?subject=" + encodeURIComponent("Pricing Updates") + "&body=" + encodeURIComponent(body);
    window.location.href = mailto;
  }
  return (
    <div style={{ position: "fixed", inset: 0, zIndex: 500, background: "rgba(0,0,0,.5)", display: "flex", alignItems: "flex-start", justifyContent: "center", overflowY: "auto", padding: "40px 14px" }} onClick={onClose}>
      <div onClick={e => e.stopPropagation()} style={{ width: "min(620px,100%)", background: S.card, border: "1px solid " + S.border, borderRadius: 14, padding: 18 }}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 4 }}>
          <strong style={{ fontSize: 15 }}>Pending Price Changes ({rows.length})</strong>
          <button onClick={onClose} style={{ border: "none", background: "transparent", fontSize: 20, color: S.muted, cursor: "pointer" }}>&times;</button>
        </div>
        <p style={{ fontSize: 11, color: S.muted, margin: "0 0 14px" }}>
          Nothing writes to the database automatically -- copy the SQL below and run it yourself in the Supabase SQL Editor, then come back and Discard All.
        </p>
        <div style={{ border: "1px solid " + S.border, borderRadius: 10, overflow: "hidden", marginBottom: 14 }}>
          {rows.map(([key, ov]) => (
            <div key={key} style={{ display: "flex", justifyContent: "space-between", alignItems: "center", padding: "9px 12px", borderBottom: "1px solid " + S.border, fontSize: 12 }}>
              <div>
                <div style={{ fontWeight: 700, color: S.text }}>{ov.productName}{ov.pkg ? " (" + ov.pkg + ")" : ""}</div>
                <div style={{ color: S.muted, fontSize: 10.5, marginTop: 1 }}>
                  {(ov.tier === "wholesale" ? "Wholesale" : ov.tier === "floor" ? "Floor" : "Target") + " · " + (ov.dist === "wtx" ? "West TX" : ov.dist === "etx" ? "East TX" : ov.dist)}
                  {ov.isNat ? " (was National)" : ""}
                </div>
              </div>
              <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
                <div style={{ fontWeight: 700, color: "#c23b3b" }}>${ov.newPrice.toFixed(2)}</div>
                <span onClick={() => onClearOne(key)} style={{ cursor: "pointer", color: S.muted, fontSize: 15 }}>&times;</span>
              </div>
            </div>
          ))}
        </div>
        <button onClick={emailPricesToFrank} disabled={emailRows.length === 0} title={emailRows.length === 0 ? "No Floor or Wholesale changes in this batch" : "Opens a ready-to-send email (also copies the text, just in case)"}
          style={{ width: "100%", marginBottom: 10, fontSize: 12, fontWeight: 700, color: emailRows.length ? "#fff" : S.muted, background: emailRows.length ? "linear-gradient(135deg," + S.blue + ",#4a7fb5)" : S.tag, border: "none", borderRadius: 8, padding: "9px 14px", cursor: emailRows.length ? "pointer" : "not-allowed" }}>
          {emailed ? "✓ Email opened (text also copied)" : "📧 Email Floor & Wholesale Prices to Frank Moore (" + emailRows.length + ")"}
        </button>
        <div style={{ display: "flex", gap: 8, marginBottom: sql ? 10 : 0 }}>
          <button onClick={copySql} style={{ flex: 1, fontSize: 12, fontWeight: 700, color: "#fff", background: "linear-gradient(135deg,#8a1f1f,#c23b3b)", border: "none", borderRadius: 8, padding: "9px 14px", cursor: "pointer" }}>
            {copied ? "✓ Copied" : "📋 Copy SQL"}
          </button>
          <button onClick={() => { Analytics.track("price_changes_discarded_all", { count: rows.length }); onClearAll(); }} style={{ fontSize: 12, fontWeight: 700, color: S.muted, background: "transparent", border: "1px solid " + S.border, borderRadius: 8, padding: "9px 14px", cursor: "pointer" }}>Discard All</button>
        </div>
        {sql && (
          <textarea readOnly value={sql} style={{ width: "100%", height: 140, marginTop: 4, background: S.inputBg, border: "1px solid " + S.border, borderRadius: 8, color: S.text, fontSize: 11, fontFamily: "monospace", padding: 10, boxSizing: "border-box", resize: "vertical" }} />
        )}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
