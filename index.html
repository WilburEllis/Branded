    Analytics.track("sheet_saved", { name: payload.name, count: sheetItems.length });
  }

  function loadSheet(s) {
    setSheetItems(s.items || []);
    if (s.district) setDist(s.district);
    if (s.tier) setTier(s.tier);
    setCurrentSheetId(s.id);
    setCurrentSheetName(s.name);
    setShowLoadDialog(false);
    Analytics.track("sheet_loaded", { name: s.name });
  }

  async function deleteSavedSheet(id) {
    await supabaseClient.from("saved_sheets").delete().eq("id", id);
    setSavedSheets(prev => prev.filter(s => s.id !== id));
    if (currentSheetId === id) { setCurrentSheetId(null); setCurrentSheetName(""); }
  }

  // Categories are never written back to skus.cat -- they're stored as
  // overrides in product_category_overrides (sku_item -> category) and
  // merged onto txData at load time in App. This keeps the live pricing
  // table untouched and needs no new RLS on skus.
  async function changeProductCategory(item, newCat) {
    setCatError("");
    const { error } = await supabaseClient.from("product_category_overrides")
      .upsert({ sku_item: item, category: newCat, updated_at: new Date().toISOString() });
    if (error) { setCatError("Couldn't save category: " + error.message); return; }
    onCategoryChange && onCategoryChange(item, newCat);
    setEditingCatItem(null);
    Analytics.track("category_changed", { item, newCat });
  }

  // "Uncategorized" in My Sheet is a display-only fallback label (r.p.cat ||
  // "Uncategorized"), not a real stored category -- a product lands there
  // because it genuinely has no cat at all (common for a National-search
  // item, whose master record was never assigned one). Assigns every item
  // currently bucketed under Uncategorized to a real category in one shot,
  // same underlying upsert as changeProductCategory, just batched.
  // Returns an error message string on failure, undefined on success, so the
  // caller (SheetGroupHeader's inline picker) can show the real reason right
  // where the user is looking -- catError alone isn't good enough here, it
  // only renders inside the Value Ladder card, nowhere near My Sheet, so a
  // real failure here would have looked exactly like "nothing happened."
  async function assignCategoryToItems(items, newCat) {
    if (!newCat || !items.length) return;
    setCatError("");
    const payload = items.map(item => ({ sku_item: item, category: newCat, updated_at: new Date().toISOString() }));
    const { error } = await supabaseClient.from("product_category_overrides").upsert(payload);
    if (error) {
      setCatError("Couldn't set category: " + error.message);
      return error.message;
    }
    items.forEach(item => onCategoryChange && onCategoryChange(item, newCat));
    Analytics.track("category_assigned_bulk", { count: items.length, newCat });
  }

  async function renameCategoryEverywhere(oldCat, newCat) {
    if (!newCat.trim() || newCat === oldCat) return;
    setCatError("");
    const trimmed = newCat.trim();
    const affected = txData.filter(p => p.cat === oldCat);
    const rows = affected.map(p => ({ sku_item: p.item, category: trimmed, updated_at: new Date().toISOString() }));
    const { error } = await supabaseClient.from("product_category_overrides").upsert(rows);
    if (error) { setCatError("Couldn't rename category: " + error.message); return; }
    onBulkCategoryChange && onBulkCategoryChange(oldCat, trimmed);
    Analytics.track("category_renamed", { oldCat, newCat: trimmed, count: rows.length });
  }

  // Portal target lives outside #root, as a sibling in <body>, so the print
  // stylesheet can just display:none the whole app without needing to
  // "un-hide" this content from inside a hidden ancestor.
  const [printPortalNode] = useState(() => {
    let el = document.getElementById("we-print-sheet");
    if (!el) {
      el = document.createElement("div");
      el.id = "we-print-sheet";
      document.body.appendChild(el);
    }
    return el;
  });

  const cats = useMemo(() => {
    const allCats = [...new Set(txData.map(p => p.cat).filter(Boolean))];
    const ordered = catOrder.filter(c => allCats.includes(c));
    const unordered = allCats.filter(c => !catOrder.includes(c)).sort();
    return ["ALL", ...ordered, ...unordered];
  }, [txData, catOrder]);

  const sheetItemSet = useMemo(() => new Set(sheetItems.map(si => si.item)), [sheetItems]);

  // A sheet item added from National search has no txData row at all (that's
  // the whole point -- it's not in this district's price list). Every place
  // that resolves a sheetItem back to its product record needs to also check
  // National, or that item silently disappears from My Sheet (looks like
  // "nothing happened" when you click it in the search results) even though
  // it really did get added to sheetItems underneath.
  const natAdaptedByItem = useMemo(() => {
    const m = new Map();
    (natData || []).forEach(p => m.set(p.item, adaptNational(p)));
    return m;
  }, [natData]);
  function resolveProduct(item) {
    return txData.find(x => x.item === item) || natAdaptedByItem.get(item);
  }

  const searchResults = useMemo(() => {
    // Deliberately ignores catFilter -- typing a search should always search
    // every product, not just whichever category pill happens to be active.
    // (Selecting a category with an empty search box is what shows the
    // Value Ladder instead; those are two separate, non-overlapping modes.)
    const q = search.trim().toLowerCase();
    if (!q) return [];
    return txData.filter(p =>
      !sheetItemSet.has(p.item) &&
      (p.name.toLowerCase().includes(q) || String(p.item).includes(q))
    ).slice(0, 40);
  }, [search, catFilter, txData, sheetItemSet]);

  // Search National Products -- for items that have no district (Wholesale/
  // Floor/Target) pricing at all, like a product that's never been sold in
  // this district but has a national list price. Only offers items NOT
  // already present in txData (those are already reachable via the normal
  // search -- no need for a second, redundant path to the same product).
  const [searchNational, setSearchNational] = useState(false);
  const txItemSet = useMemo(() => new Set(txData.map(p => p.item)), [txData]);
  const nationalSearchResults = useMemo(() => {
    const q = search.trim().toLowerCase();
    if (!q) return [];
    return (natData || []).filter(p =>
      !sheetItemSet.has(p.item) && !txItemSet.has(p.item) &&
      (p.name.toLowerCase().includes(q) || String(p.item).includes(q))
    ).slice(0, 40);
  }, [search, natData, sheetItemSet, txItemSet]);

  function addToSheet(p) {
    setSheetItems(prev => [...prev, { item: p.item, rate: p.rate_min || 1 }]);
    setSearch("");
    searchRef.current?.focus();
    Analytics.track("sheet_add_product", { product: p.name, item: p.item, national: !!p.isNationalOnly });
  }
  function removeFromSheet(item) {
    setSheetItems(prev => prev.filter(si => si.item !== item));
    Analytics.track("sheet_remove_product", { item });
  }
  function updateRate(item, rate) {
    setSheetItems(prev => prev.map(si => si.item === item ? { ...si, rate } : si));
    Analytics.track("sheet_rate_changed", { item, rate });
  }
  function updateNote(item, note) {
    setSheetItems(prev => prev.map(si => si.item === item ? { ...si, note } : si));
  }
  // Per-sheet-item price override -- lives on the sheet ITEM itself (part of
  // sheetItems, which already round-trips through saved_sheets.items), not
  // in the shared cross-sheet priceOverrides map below. That map is keyed
  // only by item+tier+district, with no notion of "which sheet" -- so a
  // Bill Crow negotiated price and East TX Wholesale's list price for the
  // same item collided, since both are wholesale tier and wholesale is
  // district-independent. Storing the override on sheetItems fixes that:
  // loadSheet() already swaps sheetItems wholesale, so each saved sheet
  // carries only its own price edits and nothing bleeds across sheets.
  // priceTier/priceDist are stamped at edit time so an override made under
  // Wholesale doesn't get misread as a Floor override if the tier is later
  // flipped while viewing the same sheet.
  function setSheetItemPrice(p, newPrice) {
    // Wholesale gets its own independent slot (si.wholesalePrice) -- see the
    // 2026-10-27 note on allPriceEdits below for why Target/Floor's shared
    // "last edited tier" slot can't also hold Wholesale.
    if (tier === "wholesale") {
      setSheetItems(prev => prev.map(si => si.item === p.item ? { ...si, wholesalePrice: newPrice } : si));
    } else {
      setSheetItems(prev => prev.map(si => si.item === p.item
        ? { ...si, price: newPrice, priceTier: tier, priceDist: dist }
        : si));
    }
    Analytics.track("sheet_item_price_override", { item: p.item, product: p.name, tier, dist, newPrice });
  }
  function clearSheetItemPrice(item, forTier) {
    setSheetItems(prev => prev.map(si => {
      if (si.item !== item) return si;
      if (forTier === "wholesale") return { ...si, wholesalePrice: undefined };
      return { ...si, price: undefined, priceTier: undefined, priceDist: undefined };
    }));
    Analytics.track("sheet_item_price_reset", { item, tier: forTier });
  }
  // Per-sheet-item COST override -- same pattern as price, but keyed only by
  // district (not tier -- cost isn't a Wholesale/Floor/Target concept).
  // Lets Nathan punch in the real landed cost he's actually paying at a
  // location right on the sheet, overriding whatever landed_costs/skus.cost
  // currently shows, so his Profit/ac and Margin% are accurate even before
  // (or instead of) a full landed-cost re-import.
  function setSheetItemCost(p, newCost) {
    setSheetItems(prev => prev.map(si => si.item === p.item
      ? { ...si, cost: newCost, costDist: dist }
      : si));
    Analytics.track("sheet_item_cost_override", { item: p.item, product: p.name, dist, newCost });
  }
  function clearSheetItemCost(item) {
    setSheetItems(prev => prev.map(si => si.item === item
      ? { ...si, cost: undefined, costDist: undefined }
      : si));
    Analytics.track("sheet_item_cost_reset", { item });
  }
  // A product added via National search (or any product whose master record
  // is just missing rate data) has no p.rate_unit -- calcPPA can't produce
  // Price/ac, Cost/ac, or Profit/ac without one, and there's no field for
  // Rate/ac to even attach to. Rather than blocking on a database fix, let
  // the rate unit be set locally on the sheet item itself, same pattern as
  // the price/cost overrides -- it round-trips through saved_sheets.items
  // for free. Once set, it's used everywhere p.rate_unit would have been.
  function setSheetItemRateUnit(item, unit) {
    setSheetItems(prev => prev.map(si => si.item === item ? { ...si, rateUnit: unit } : si));
    Analytics.track("sheet_item_rate_unit_set", { item, unit });
  }
  function clearSheet() {
    setSheetItems([]);
    setCurrentSheetId(null);
    setCurrentSheetName("");
    Analytics.track("sheet_clear");
  }

  function reorderSheet(fromItem, toItem) {
    if (fromItem == null || toItem == null || fromItem === toItem) return;
    setSheetItems(prev => {
      const next = [...prev];
      const fromIdx = next.findIndex(si => si.item === fromItem);
      const toIdx = next.findIndex(si => si.item === toItem);
      if (fromIdx === -1 || toIdx === -1) return prev;
      const [moved] = next.splice(fromIdx, 1);
      next.splice(toIdx, 0, moved);
      return next;
    });
  }

  // Falls back to national per-field (floor and target independently), same
  // spirit as the admin price grid's wFloorVal/eFloorVal -- but labels each
  // field's own "(Nat)" tag off whether THAT field is a national substitute,
  // not off target's nullness. (The admin grid mislabels floor as non-Nat
  // when only floor is missing but target has real district data -- worth
  // fixing there too if you want, didn't touch it since it wasn't asked.)
  // tierArg/distArg let a caller price a product for a tier/district OTHER
  // than whatever's currently selected in the UI -- needed to price a sheet
  // item's stored override (si.priceTier/si.priceDist) correctly even when
  // you've since flipped the sheet to a different tier/district view.
  function rawPriceFor(p, tierArg, distArg) {
    const t = tierArg || tier;
    const d = distArg || dist;
    if (t === "wholesale") return { price: wholesaleBasis(p), label: "Wholesale", isNat: false };
    const isWest = d === "wtx";
    const rawTarget = isWest ? p.w_target : p.e_target;
    const rawFloor = isWest ? p.w_floor : p.e_floor;
    const base = isWest ? "West TX" : "East TX";
    if (t === "floor") {
      const isNat = rawFloor == null && p.nat_target != null;
      const val = rawFloor != null ? rawFloor : natFloorOf(p);
      return { price: val, label: base + " Floor" + (isNat ? " (Nat)" : ""), isNat };
    }
    const isNat = rawTarget == null && p.nat_target != null;
    const val = rawTarget != null ? rawTarget : p.nat_target;
    return { price: val, label: base + " Target" + (isNat ? " (Nat)" : ""), isNat };
  }

  // Overrides are keyed per (item, tier, district) -- wholesale is
  // district-independent so it's keyed under a constant "any" district.
  // Editing a price is a local "what-if" only; it never writes to Supabase
  // by itself. The Save Prices panel generates SQL for the user to review
  // and run themselves, same pattern as every other write in this app.
  function priceOverrideKey(item) {
    return item + "|" + tier + "|" + (tier === "wholesale" ? "any" : dist);
  }
  function priceFor(p) {
    const ov = priceOverrides[priceOverrideKey(p.item)];
    if (ov) {
      const raw = rawPriceFor(p);
      return { price: ov.newPrice, label: raw.label.replace(/ \(Nat\)$/, "") + (ov.synced ? " (auto)" : " (edited)"), isEdited: true };
    }
    return { ...rawPriceFor(p), isEdited: false };
  }
  // My Sheet's own price resolver -- checks the sheet ITEM's own price
  // override (set via setSheetItemPrice, saved/loaded per-sheet) before
  // falling back to the raw tier/district list price. Deliberately does NOT
  // consult the shared priceOverrides map, so Value Ladder what-if edits and
  // other saved sheets' bid prices never leak into this sheet, and this
  // sheet's bid prices never leak into them.
  //
  // Floor is always 5% below Target (Nathan's rule, 2026-09-02) -- a sheet
  // item only ever stores ONE edited tier at a time (si.priceTier), and the
  // OTHER tier is derived from it on the fly here rather than stored
  // separately. That's deliberate, not a shortcut: keeping a single source
  // of truth means the two can never silently drift apart from each other --
  // whichever one was actually typed in most recently IS the real edit, and
  // the other is always exactly 5% away from it.
  function sheetItemPriceFor(si, p) {
    // Wholesale reads from its own independent slot (si.wholesalePrice) --
    // see the 2026-10-27 note on allPriceEdits for why it can't share
    // Target/Floor's slot.
    if (tier === "wholesale") {
      if (si.wholesalePrice != null) {
        const raw = rawPriceFor(p);
        return { price: si.wholesalePrice, label: raw.label.replace(/ \(Nat\)$/, "") + " (edited)", isEdited: true };
      }
      return { ...rawPriceFor(p), isEdited: false };
    }
    if (si.price != null && si.priceTier === tier && si.priceDist === dist) {
      const raw = rawPriceFor(p);
      return { price: si.price, label: raw.label.replace(/ \(Nat\)$/, "") + " (edited)", isEdited: true };
    }
    if (si.price != null && si.priceDist === dist && si.priceTier !== "wholesale") {
      const derived = si.priceTier === "target" ? si.price * 0.95 : si.priceTier === "floor" ? si.price / 0.95 : null;
      if (derived != null) {
        const raw = rawPriceFor(p);
        return { price: derived, label: raw.label.replace(/ \(Nat\)$/, "") + " (auto)", isEdited: true };
      }
    }
    return { ...rawPriceFor(p), isEdited: false };
  }

  // Unified list for the "Save Prices" -> master-list SQL export: combines
  // Value Ladder what-ifs (priceOverrides, category-wide scratchpad) with
  // the CURRENTLY LOADED sheet's own per-item price edits (sheetItems).
  // Sheet edits are scoped to whichever sheet is open right now -- switching
  // sheets swaps sheetItems entirely, so this naturally only ever offers up
  // the open sheet's own dial-in prices, never another saved sheet's.
  const allPriceEdits = useMemo(() => {
    const ladder = Object.entries(priceOverrides).map(([key, ov]) => ({ ...ov, key, source: "ladder" }));
    const sheet = sheetItems.flatMap(si => {
      const p = resolveProduct(si.item);
      if (!p) return [];
      const entries = [];
      if (si.price != null && si.priceTier != null) {
        const raw = rawPriceFor(p, si.priceTier, si.priceDist);
        entries.push({
          key: "sheet|" + si.item + "|" + si.priceTier + "|" + si.priceDist,
          item: si.item, productName: p.name, pkg: p.pkg,
          tier: si.priceTier, dist: si.priceDist, isNat: raw.isNat,
          newPrice: si.price, originalPrice: raw.price,
          dryOzPrice: p.dry_oz_price, ozPerUnit: p.oz_per_unit,
          source: "sheet",
        });
        // Floor is always 5% below Target -- push the derived counterpart
        // column too, so saving actually keeps both in sync in the real
        // database, not just on screen (see sheetItemPriceFor above).
        if (si.priceTier === "target" || si.priceTier === "floor") {
          const counterpartTier = si.priceTier === "target" ? "floor" : "target";
          const counterpartPrice = si.priceTier === "target" ? si.price * 0.95 : si.price / 0.95;
          const counterpartRaw = rawPriceFor(p, counterpartTier, si.priceDist);
          entries.push({
            key: "sheet|" + si.item + "|" + counterpartTier + "|" + si.priceDist + "|synced",
            item: si.item, productName: p.name, pkg: p.pkg,
            tier: counterpartTier, dist: si.priceDist, isNat: counterpartRaw.isNat,
            newPrice: counterpartPrice, originalPrice: counterpartRaw.price,
            dryOzPrice: p.dry_oz_price, ozPerUnit: p.oz_per_unit,
            source: "sheet", synced: true,
          });
        }
      }
      // Wholesale lives in its own slot (si.wholesalePrice, 2026-10-27 fix)
      // -- unlike Target/Floor, it has no auto-derive relationship to
      // anything else, so it was never safe to share one "last edited
      // tier" slot with them. Nathan hit this directly: editing Floor then
      // switching to Wholesale and editing that silently overwrote the
      // Floor edit, since both used to live in the same si.price field.
      // Now both can be pending on the same item at once.
      if (si.wholesalePrice != null) {
        const raw = rawPriceFor(p, "wholesale", "any");
        entries.push({
          key: "sheet|" + si.item + "|wholesale|any",
          item: si.item, productName: p.name, pkg: p.pkg,
          tier: "wholesale", dist: "any", isNat: raw.isNat,
          newPrice: si.wholesalePrice, originalPrice: raw.price,
          dryOzPrice: p.dry_oz_price, ozPerUnit: p.oz_per_unit,
          source: "sheet",
        });
      }
      return entries;
    });
    return [...ladder, ...sheet];
  }, [priceOverrides, sheetItems, txData, natAdaptedByItem]);

  // Same scoping rule as allPriceEdits: only the CURRENTLY LOADED sheet's own
  // cost edits, since sheetItems swaps out entirely on loadSheet.
  const sheetCostEdits = useMemo(() => {
    return sheetItems.filter(si => si.cost != null && si.costDist != null).map(si => {
      const p = resolveProduct(si.item);
      if (!p) return null;
      const landed = landedCosts[si.item]?.[si.costDist];
      return {
        item: si.item, productName: p.name, pkg: p.pkg,
        dist: si.costDist, newCost: si.cost,
        originalCost: landed ? landed.avg_cost : p.cost,
        hadLanded: !!landed,
      };
    }).filter(Boolean);
  }, [sheetItems, txData, landedCosts, natAdaptedByItem]);

  function clearAllSheetCostEdits() {
    setSheetItems(prev => prev.map(si => ({ ...si, cost: undefined, costDist: undefined })));
    setGeneratedCostSql("");
  }

  function generateCostSql() {
    const today = new Date().toISOString().slice(0, 10);
    const lines = sheetCostEdits.map(ov => {
      const tag = ov.productName + (ov.pkg ? " (" + ov.pkg + ")" : "") + " · item #" + ov.item;
      // A manual single-value correction, so low/high collapse to the same
      // number and n_lots/total_qty are unknown -- same shape a real 1-lot
      // landed_costs snapshot would have. sku_item+district_id is the PK
      // (confirmed via the CSV import schema), so ON CONFLICT upserts
      // cleanly whether or not a row already exists for this item+district.
      const upsert = `INSERT INTO public.landed_costs (sku_item, district_id, avg_cost, low_cost, high_cost, n_lots, total_qty, as_of_date) VALUES (${ov.item}, '${ov.dist}', ${ov.newCost}, ${ov.newCost}, ${ov.newCost}, 1, 0, '${today}') ON CONFLICT (sku_item, district_id) DO UPDATE SET avg_cost = EXCLUDED.avg_cost, low_cost = EXCLUDED.low_cost, high_cost = EXCLUDED.high_cost, as_of_date = EXCLUDED.as_of_date; -- ${tag}`;
      // Also append to landed_cost_history so this correction shows up in
      // the trend record, same as a real re-import would (per Nathan's
      // stated preference to keep history even though the snapshot table
      // gets replaced).
      const history = `INSERT INTO public.landed_cost_history (sku_item, district_id, avg_cost, low_cost, high_cost, n_lots, total_qty, as_of_date) VALUES (${ov.item}, '${ov.dist}', ${ov.newCost}, ${ov.newCost}, ${ov.newCost}, 1, 0, '${today}'); -- ${tag}, manual correction`;
      return upsert + "\n" + history;
    });
    setGeneratedCostSql(lines.join("\n"));
  }

  function setPriceOverride(p, newPrice) {
    const key = priceOverrideKey(p.item);
    const raw = rawPriceFor(p);
    setPriceOverrides(prev => {
      const next = {
        ...prev,
        [key]: {
          item: p.item, productName: p.name, pkg: p.pkg,
          tier, dist: tier === "wholesale" ? "any" : dist, isNat: raw.isNat,
          newPrice, originalPrice: prev[key] ? prev[key].originalPrice : raw.price,
          dryOzPrice: p.dry_oz_price, ozPerUnit: p.oz_per_unit,
        },
      };
      // Floor is always 5% below Target (Nathan's rule, 2026-09-02) -- editing
      // either one keeps the other in sync automatically, rather than letting
      // them silently drift apart. Wholesale has no such relationship.
      if (tier === "target" || tier === "floor") {
        const counterpartTier = tier === "target" ? "floor" : "target";
        const counterpartPrice = tier === "target" ? newPrice * 0.95 : newPrice / 0.95;
        const counterpartKey = p.item + "|" + counterpartTier + "|" + dist;
        const counterpartRaw = rawPriceFor(p, counterpartTier, dist);
        next[counterpartKey] = {
          item: p.item, productName: p.name, pkg: p.pkg,
          tier: counterpartTier, dist, isNat: counterpartRaw.isNat,
          newPrice: counterpartPrice,
          originalPrice: prev[counterpartKey] ? prev[counterpartKey].originalPrice : counterpartRaw.price,
          dryOzPrice: p.dry_oz_price, ozPerUnit: p.oz_per_unit,
          synced: true,
        };
      }
      return next;
    });
    Analytics.track("sheet_price_override", { item: p.item, product: p.name, tier, newPrice });
  }
  function clearPriceOverride(key) {
    setPriceOverrides(prev => { const next = { ...prev }; delete next[key]; return next; });
  }
  function clearAllPriceOverrides() {
    setPriceOverrides({});
    setSheetItems(prev => prev.map(si => ({ ...si, price: undefined, priceTier: undefined, priceDist: undefined, wholesalePrice: undefined })));
    setGeneratedSql("");
  }

  // Upsert-based, not INSERT-vs-UPDATE-guessed (2026-10-27 fix, same root
  // cause/fix as the new Pricing-section edit feature's generatePricingSql()
  // -- `isNat` only tells you one column was null, not whether a
  // district_prices row exists at all, so a bare INSERT could collide with
  // a real row that already had the OTHER column set. Grouping by (item,
  // district) also avoids inserting the same row twice when target+floor
  // are both edited together (the normal case, since they auto-sync).
  function generatePriceSql() {
    const lines = [];
    const groups = {};
    allPriceEdits.forEach(ov => {
      if (ov.tier === "wholesale") {
        // Sheet edits happen in the same per-package basis as Cost/Target/
        // Floor (see wholesaleBasis()), but skus.wholesale actually stores
        // a flat per-oz rate for dry-oz-priced products -- convert back
        // before writing so the saved value matches what the column means.
        const tag = ov.productName + (ov.pkg ? " (" + ov.pkg + ")" : "") + " · item #" + ov.item;
        const rawWholesale = (ov.dryOzPrice && ov.ozPerUnit) ? ov.newPrice / ov.ozPerUnit : ov.newPrice;
        lines.push(`UPDATE public.skus SET wholesale = ${rawWholesale} WHERE item = ${ov.item}; -- ${tag}`);
        return;
      }
      const gkey = ov.item + "|" + ov.dist;
      if (!groups[gkey]) groups[gkey] = { item: ov.item, dist: ov.dist, productName: ov.productName, pkg: ov.pkg };
      groups[gkey][ov.tier] = ov.newPrice;
    });
    Object.values(groups).forEach(g => {
      const tag = g.productName + (g.pkg ? " (" + g.pkg + ")" : "") + " · item #" + g.item;
      const cols = [], vals = [], updates = [];
      if (g.target != null) { cols.push("target_price"); vals.push(g.target); updates.push("target_price = EXCLUDED.target_price"); }
      if (g.floor != null) { cols.push("floor_price"); vals.push(g.floor); updates.push("floor_price = EXCLUDED.floor_price"); }
      lines.push(`INSERT INTO public.district_prices (sku_item, district_id, ${cols.join(", ")}) VALUES (${g.item}, '${g.dist}', ${vals.join(", ")}) ON CONFLICT (sku_item, district_id) DO UPDATE SET ${updates.join(", ")}; -- ${tag}`);
    });
    setGeneratedSql(lines.join("\n"));
  }

  // Same "email Frank Moore the Floor + Wholesale changes" feature as the
  // new Pricing-section panel (2026-10-27) -- Nathan found it missing here
  // since this is Sheet's own, separately-built review modal, not
  // PricingSqlPanel. Sheet's own wholesale overrides always carry
  // dist:"any" (wholesale has no real per-district column), so this falls
  // back to whichever district Sheet is CURRENTLY viewing for the label,
  // same "viewing context" convention the Pricing-section card uses.
  function emailFloorWholesaleToFrank() {
    const today = new Date().toLocaleDateString("en-US", { month: "long", day: "numeric", year: "numeric" });
    const emailEdits = allPriceEdits.filter(ov => ov.tier === "floor" || ov.tier === "wholesale")
      .sort((a, b) => (a.item - b.item) || (a.tier === b.tier ? 0 : a.tier === "floor" ? -1 : 1));
    const lines = emailEdits.map(ov => {
      const effDist = (ov.dist && ov.dist !== "any") ? ov.dist : dist;
      const full = effDist === "wtx" ? "West TX" : effDist === "etx" ? "East TX" : effDist;
      const abbrev = effDist === "wtx" ? "W TX" : effDist === "etx" ? "E TX" : effDist;
      const head = `${ov.productName}${ov.pkg ? " (" + ov.pkg + ")" : ""} — Item #${ov.item} — `;
      return ov.tier === "wholesale"
        ? `${head}(${abbrev} Wholesale): $${ov.newPrice.toFixed(2)}`
        : `${head}(${full}) Floor: $${ov.newPrice.toFixed(2)} `;
    });
    const body = `Hey Frank,\n\nPlease update the following Floor and Wholesale prices for ${today}:\n\n${lines.join("\n")}\n\nThanks,\nNathan`;
    Analytics.track("sheet_price_email_frank", { count: emailEdits.length });
    try { navigator.clipboard?.writeText(body); } catch (e) {}
    setEmailedToFrank(true); setTimeout(() => setEmailedToFrank(false), 2500);
    const mailto = "mailto:" + PRICING_EMAIL_TO + "?subject=" + encodeURIComponent("Pricing Updates") + "&body=" + encodeURIComponent(body);
    window.location.href = mailto;
  }

  const rows = useMemo(() => sheetItems.map(si => {
    const p = resolveProduct(si.item);
    if (!p) return null;
    const { price, label, isEdited } = sheetItemPriceFor(si, p);
    const costIsEdited = si.cost != null && si.costDist === dist;
    const rawCost = costFor(p);
    const cost = costIsEdited ? si.cost : rawCost.cost;
    const costSource = costIsEdited ? "Edited" : rawCost.source;
    const costLow = costIsEdited ? null : rawCost.low;
    const costHigh = costIsEdited ? null : rawCost.high;
    const costNLots = costIsEdited ? null : rawCost.nLots;
    const rate = si.rate;
    // Falls back to a rate unit set locally on this sheet item (see
    // setSheetItemRateUnit) when the product's own record has none -- e.g.
    // a National-search item whose master record was never given rate data.
    const rateUnit = p.rate_unit || si.rateUnit;
    const isNTP = p.n_treatment === true || p.n_treatment === "true";
    let costAc, priceAc;
    if (isNTP) {
      if (nTreatBasis === "urea" && p.n_treat_urea_rate) {
        priceAc = price != null ? calcUreaPPA(price, p.n_treat_urea_rate, ureaLbsRate) : null;
        costAc = cost != null ? calcUreaPPA(cost, p.n_treat_urea_rate, ureaLbsRate) : null;
      } else {
        priceAc = price != null ? calcNTreatPPA(price, rate, uanGalRate) : null;
        costAc = cost != null ? calcNTreatPPA(cost, rate, uanGalRate) : null;
      }
    } else {
      const canCalc = rate != null && rateUnit != null;
      const ppaPrice = canCalc ? calcPPA(p.pkg, price, rate, rateUnit, 10, p.dry_oz_price, p.oz_per_unit) : null;
      const ppaCost = canCalc ? calcPPA(p.pkg, cost, rate, rateUnit, 10, p.dry_oz_price, p.oz_per_unit) : null;
      costAc = ppaCost ? ppaCost.val : null;
      priceAc = ppaPrice ? ppaPrice.val : null;
    }
    const profitAc = (costAc != null && priceAc != null) ? priceAc - costAc : null;
    const marginPct = (price != null && cost != null && price > 0) ? ((price - cost) / price) * 100 : null;
    return { p, price, label, isEdited, rate, rateUnit, note: si.note || "", cost, costSource, costIsEdited, costLow, costHigh, costNLots, costAc, priceAc, profitAc, marginPct, isNTP };
  }).filter(Boolean), [sheetItems, tier, dist, txData, natAdaptedByItem, overridesMap, landedCosts, nTreatBasis, uanGalRate, ureaLbsRate]);

  const totalProfitAc = rows.reduce((s, r) => s + (r.profitAc || 0), 0);
  const groupedRows = useMemo(() => groupRowsByCategory(rows), [rows, catOrder]);
  const sortedGroupedRows = useMemo(() => sortGroupItems(groupedRows, sortCol, sortDir), [groupedRows, sortCol, sortDir]);

  function exportToExcel() {
    const data = [];
    sortedGroupedRows.forEach(g => {
      g.items.forEach(r => {
        data.push({
          Category: g.cat,
          Product: r.p.name,
          Package: r.p.pkg || "",
          "Item #": r.p.item,
          "Rate/ac": r.rate != null && r.rateUnit ? r.rate + " " + r.rateUnit : "",
          Cost: r.cost != null ? Math.round(r.cost * 100) / 100 : "",
          Price: r.price != null ? Math.round(r.price * 100) / 100 : "",
          "Cost/ac": r.costAc != null ? Math.round(r.costAc * 100) / 100 : "",
          "Price/ac": r.priceAc != null ? Math.round(r.priceAc * 100) / 100 : "",
          "Profit/ac": r.profitAc != null ? Math.round(r.profitAc * 100) / 100 : "",
          "Margin %": r.marginPct != null ? Math.round(r.marginPct * 10) / 10 : "",
          Notes: r.note || "",
        });
      });
    });
    const ws = XLSX.utils.json_to_sheet(data);
    ws["!cols"] = [{ wch: 14 }, { wch: 28 }, { wch: 12 }, { wch: 9 }, { wch: 12 }, { wch: 9 }, { wch: 9 }, { wch: 10 }, { wch: 10 }, { wch: 11 }, { wch: 10 }, { wch: 24 }];
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, "Price Sheet");
    const stamp = new Date().toISOString().slice(0, 10);
    const safeName = (currentSheetName || "WE_Price_Sheet").replace(/[^\w\- ]+/g, "").trim() || "WE_Price_Sheet";
    XLSX.writeFile(wb, `${safeName}_${stamp}.xlsx`);
    Analytics.track("sheet_export_excel", { count: data.length, district: dist, tier });
  }

  // Value Ladder: every product in the selected category, at its own default
  // rate, sorted cheapest to priciest -- shows where each product sits in
  // the category's price/profit lineup so gaps and overlaps are visible.
  const ladderRows = useMemo(() => {
    if (catFilter === "ALL") return [];
    return txData
      .filter(p => p.cat === catFilter)
      .map(p => {
        const { price, label, isEdited } = priceFor(p);
        const { cost, source: costSource, low: costLow, high: costHigh, nLots: costNLots } = costFor(p);
        const rate = p.rate_min;
        const canCalc = rate != null && p.rate_unit != null;
        const ppaPrice = canCalc ? calcPPA(p.pkg, price, rate, p.rate_unit, 10, p.dry_oz_price, p.oz_per_unit) : null;
        const ppaCost = canCalc ? calcPPA(p.pkg, cost, rate, p.rate_unit, 10, p.dry_oz_price, p.oz_per_unit) : null;
        const costAc = ppaCost ? ppaCost.val : null;
        const priceAc = ppaPrice ? ppaPrice.val : null;
        const profitAc = (costAc != null && priceAc != null) ? priceAc - costAc : null;
        const marginPct = (price != null && cost != null && price > 0) ? ((price - cost) / price) * 100 : null;
        return { p, price, label, isEdited, rate, cost, costSource, costLow, costHigh, costNLots, costAc, priceAc, profitAc, marginPct };
      })
      .sort((a, b) => (a.price ?? Infinity) - (b.price ?? Infinity));
  }, [catFilter, txData, tier, dist, overridesMap, priceOverrides, landedCosts]);

  const catCounts = useMemo(() => {
    const counts = {};
    txData.forEach(p => { if (p.cat) counts[p.cat] = (counts[p.cat] || 0) + 1; });
    return counts;
  }, [txData]);

  const tierBtn = (key, label) => (
    <button key={key} onClick={() => { setTier(key); Analytics.track("sheet_tier_changed", { tier: key }); }}
      style={{ fontSize: 11, fontWeight: 700, color: tier === key ? S.onAccent : S.blue, background: tier === key ? S.blue : "rgba(91,155,213,.1)", border: "1px solid " + (tier === key ? S.blue : "rgba(91,155,213,.3)"), padding: "6px 12px", borderRadius: 6, cursor: "pointer", letterSpacing: .3 }}>
      {label}
    </button>
  );
  const distBtn = (key, label) => (
    <button key={key} onClick={() => { setDist(key); Analytics.track("sheet_district_changed", { district: key }); }}
      style={{ fontSize: 11, fontWeight: 700, color: dist === key ? S.onAccent : S.green, background: dist === key ? S.green : "rgba(76,175,106,.1)", border: "1px solid " + (dist === key ? S.green : "rgba(76,175,106,.3)"), padding: "6px 12px", borderRadius: 6, cursor: "pointer", letterSpacing: .3 }}>
      {label}
    </button>
  );

  function EditableRate({ value, unit, onChange }) {
    const [editing, setEditing] = useState(false);
    const [val, setVal] = useState(String(value));
    const onDone = () => { const n = parseFloat(val); if (!isNaN(n) && n > 0) onChange(n); else setVal(String(value)); setEditing(false); };
    if (editing) {
      return <input type="number" autoFocus value={val} onChange={e => setVal(e.target.value)}
        onBlur={onDone} onKeyDown={e => { if (e.key === "Enter") onDone(); }}
        style={{ width: 55, fontSize: 13, fontWeight: 700, color: S.blue, background: "rgba(255,255,255,.08)", border: "1px solid " + S.blue, borderRadius: 4, padding: "2px 5px", outline: "none", textAlign: "center" }} />;
    }
    return (
      <span onClick={() => { setVal(String(value)); setEditing(true); }}
        style={{ cursor: "pointer", borderBottom: "1px dashed " + S.blue, fontWeight: 700, color: S.blue }}>
        {value}{unit ? " " + unit : ""}
      </span>
    );
  }

  // Shown in place of EditableRate when a sheet item has no rate unit at all
  // (typically a National-search item with no rate data on file) -- lets
  // Nathan define one right on the sheet, off the product label, instead of
  // being stuck with a permanently blank Rate/ac. Presets cover the common
  // shapes calcPPA already understands (see calcPPA's unit-string parsing);
  // the free-text box covers anything else (any string containing "gal",
  // "qt", "pt", "oz", or "lb", optionally with "/100" for a per-100-gal-
  // carrier rate, works the same way every other product's rate_unit does).
  const RATE_UNIT_PRESETS = ["gal/100gal", "qt/ac", "pt/ac", "oz/ac", "lb/ac"];
  function SetRateUnit({ onSet }) {
    const [open, setOpen] = useState(false);
    const [custom, setCustom] = useState("");
    if (!open) {
      return (
        <span onClick={() => setOpen(true)} title="This item has no rate unit on file -- set one from the label"
          style={{ cursor: "pointer", fontSize: 10, color: S.amber, textDecoration: "underline" }}>
          + Set rate unit
        </span>
      );
    }
    return (
      <div style={{ background: S.card, border: "1px solid " + S.amber, borderRadius: 8, padding: 8, minWidth: 150, textAlign: "left" }}>
        <div style={{ fontSize: 9, color: S.muted, marginBottom: 5 }}>Rate unit (from the label):</div>
        <div style={{ display: "flex", flexWrap: "wrap", gap: 4, marginBottom: 6 }}>
          {RATE_UNIT_PRESETS.map(u => (
            <button key={u} onClick={() => onSet(u)}
              style={{ fontSize: 10, color: S.blue, background: "rgba(91,155,213,.1)", border: "1px solid rgba(91,155,213,.3)", borderRadius: 4, padding: "2px 6px", cursor: "pointer" }}>{u}</button>
          ))}
        </div>
        <div style={{ display: "flex", gap: 4 }}>
          <input type="text" value={custom} onChange={e => setCustom(e.target.value)} placeholder="or type e.g. qt/100gal"
            onKeyDown={e => { if (e.key === "Enter" && custom.trim()) onSet(custom.trim()); }}
            style={{ flex: 1, fontSize: 11, padding: "3px 5px", borderRadius: 4, border: "1px solid " + S.border, background: S.inputBg, color: S.text, outline: "none", width: 90 }} />
          <button onClick={() => custom.trim() && onSet(custom.trim())} disabled={!custom.trim()}
            style={{ fontSize: 10, color: S.onAccent, background: custom.trim() ? S.amber : S.tag, border: "none", borderRadius: 4, padding: "3px 8px", cursor: custom.trim() ? "pointer" : "not-allowed" }}>Set</button>
        </div>
        <div onClick={() => setOpen(false)} style={{ fontSize: 9, color: S.muted, marginTop: 5, cursor: "pointer", textAlign: "center" }}>cancel</div>
      </div>
    );
  }

  function EditableNote({ value, onChange }) {
    const [val, setVal] = useState(value || "");
    useEffect(() => { setVal(value || ""); }, [value]);
    return (
      <input type="text" value={val} placeholder="Add a note…" onChange={e => setVal(e.target.value)}
        onBlur={() => { if (val !== (value || "")) onChange(val); }}
        onKeyDown={e => { if (e.key === "Enter") e.target.blur(); }}
        style={{ width: "100%", minWidth: 130, fontSize: 11, color: S.text, background: S.inputBg, border: "1px solid " + S.border, borderRadius: 4, padding: "4px 6px", outline: "none" }} />
    );
  }

  function EditablePrice({ value, isEdited, onChange, title = "Click to try a different price" }) {
    const [editing, setEditing] = useState(false);
    const [val, setVal] = useState(value != null ? String(value) : "");
    const onDone = () => {
      const n = parseFloat(val);
      if (!isNaN(n) && n >= 0) {
        // val starts as the exact, un-rounded value on entering edit mode, so
        // clicking in then clicking out untouched reparses to the identical
        // number -- only commit (and thus flip the cell amber) on a REAL change.
        if (value == null || Math.abs(n - value) > 1e-9) onChange(n);
      } else {
        setVal(value != null ? String(value) : "");
      }
      setEditing(false);
    };
    if (editing) {
      return <input type="number" step="0.01" autoFocus value={val} onChange={e => setVal(e.target.value)}
        onBlur={onDone} onKeyDown={e => { if (e.key === "Enter") onDone(); }}
        style={{ width: 75, fontSize: 13, fontWeight: 700, color: S.amber, background: "rgba(255,255,255,.08)", border: "1px solid " + S.amber, borderRadius: 4, padding: "2px 5px", outline: "none", textAlign: "right" }} />;
    }
    return (
      <span onClick={() => { setVal(value != null ? String(value) : ""); setEditing(true); }}
        title={title}
        style={{ cursor: "pointer", borderBottom: "1px dashed " + (isEdited ? S.amber : S.muted), fontWeight: 700, color: isEdited ? S.amber : S.text }}>
        {fmt(value)}
      </span>
    );
  }

  // Editing margin back-solves a price: margin% = (price-cost)/price, so
  // price = cost / (1 - margin/100). Feeds straight into the same
  // setPriceOverride() the Price field uses -- margin editing is just an
  // alternate input for the same override, not a separate concept.
  function EditableMargin({ value, cost, isEdited, onPriceChange }) {
    const [editing, setEditing] = useState(false);
    const [val, setVal] = useState(value != null ? value.toFixed(1) : "");
    const canEditMargin = cost != null && cost > 0;
    const onDone = () => {
      const m = parseFloat(val);
      if (!isNaN(m) && m < 100 && canEditMargin) {
        // val starts as value.toFixed(1) on entering edit mode -- that
        // display rounding alone can shift it up to 0.05 from the real
        // underlying margin, so use a tolerance wider than that (not exact
        // equality) to tell "untouched" apart from a genuine edit.
        if (value == null || Math.abs(m - value) > 0.05) {
          const newPrice = Math.round((cost / (1 - m / 100)) * 100) / 100;
          onPriceChange(newPrice);
        }
      } else {
        setVal(value != null ? value.toFixed(1) : "");
      }
      setEditing(false);
    };
    if (!canEditMargin) return <span style={{ color: S.muted }}>{value != null ? value.toFixed(0) + "%" : "—"}</span>;
    if (editing) {
      return <input type="number" step="0.5" autoFocus value={val} onChange={e => setVal(e.target.value)}
        onBlur={onDone} onKeyDown={e => { if (e.key === "Enter") onDone(); }}
        style={{ width: 55, fontSize: 13, fontWeight: 700, color: S.amber, background: "rgba(255,255,255,.08)", border: "1px solid " + S.amber, borderRadius: 4, padding: "2px 5px", outline: "none", textAlign: "right" }} />;
    }
    return (
      <span onClick={() => { setVal(value != null ? value.toFixed(1) : ""); setEditing(true); }}
        title="Click to set a target margin % — recalculates the price"
        style={{ cursor: "pointer", borderBottom: "1px dashed " + (isEdited ? S.amber : S.muted), fontWeight: 700, color: isEdited ? S.amber : S.muted }}>
        {value != null ? value.toFixed(0) + "%" : "—"}
      </span>
    );
  }

  return (
    <div style={{ padding: "6px 12px 80px" }}>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", flexWrap: "wrap", gap: 12, marginBottom: 12 }}>
        <div style={{ display: "flex", gap: 16, flexWrap: "wrap" }}>
          <div>
            <div style={{ fontSize: 9, color: S.muted, textTransform: "uppercase", letterSpacing: 1, marginBottom: 4 }}>District</div>
            {seesAllDistricts ? (
              <div style={{ display: "flex", gap: 6 }}>{distBtn("wtx", "West TX")}{distBtn("etx", "East TX")}</div>
            ) : (
              <div style={{ fontSize: 12, fontWeight: 700, color: S.text, padding: "5px 0" }}>{dist === "wtx" ? "West TX" : "East TX"}</div>
            )}
          </div>
          <div>
            <div style={{ fontSize: 9, color: S.muted, textTransform: "uppercase", letterSpacing: 1, marginBottom: 4 }}>Price Tier</div>
            <div style={{ display: "flex", gap: 6 }}>{tierBtn("wholesale", "Wholesale")}{tierBtn("floor", "Floor")}{tierBtn("target", "Target")}</div>
          </div>
        </div>
        <div style={{ display: "flex", flexDirection: "column", alignItems: "flex-end", gap: 4 }}>
          {currentSheetName && <div style={{ fontSize: 10, color: S.muted }}>Editing: <span style={{ color: S.text, fontWeight: 600 }}>{currentSheetName}</span></div>}
          <div style={{ display: "flex", gap: 6 }}>
            {/* Pulls from BOTH Value Ladder what-ifs (priceOverrides) AND the
                CURRENTLY LOADED sheet's own dial-in prices (sheetItems) --
                see allPriceEdits. Scoped to the open sheet only: switching
                sheets swaps sheetItems, so a different sheet's own bid
                prices never show up here uninvited. This is the intended
                workflow for pushing a sheet's dialed-in prices into the
                master Floor/Target/Wholesale list -- use deliberately, since
                the generated SQL updates skus/district_prices for everyone. */}
            {canEdit && allPriceEdits.length > 0 && (
              <button onClick={() => { Analytics.track("sheet_price_panel_opened", { count: allPriceEdits.length }); setGeneratedSql(""); setShowSavePrices(true); }}
                style={{ fontSize: 10, fontWeight: 700, color: S.onAccent, background: S.amber, border: "1px solid " + S.amber, padding: "5px 10px", borderRadius: 6, cursor: "pointer" }}>
                💰 Save Prices ({allPriceEdits.length})
              </button>
            )}
            {/* Same floating "don't lose track of this" reminder as the new
                Pricing-section edit feature, added 2026-10-27 per Nathan
                ("forgot where to find the update pricing button on the
                sheet tool") -- opens the exact same existing review panel
                as the toolbar button above, just always visible instead of
                needing to be scrolled to. Amber (Sheet's existing color),
                not red -- deliberately left as-is per Nathan's own call to
                leave Sheet's styling alone. */}
            {canEdit && allPriceEdits.length > 0 && (
              <button onClick={() => { Analytics.track("sheet_price_panel_opened", { count: allPriceEdits.length }); setGeneratedSql(""); setShowSavePrices(true); }}
                style={{ position: "fixed", right: 16, bottom: 16, zIndex: 400, display: "flex", alignItems: "center", gap: 8, background: "linear-gradient(135deg,#7a5a12,#c9900f)", color: "#fff", border: "none", borderRadius: 999, padding: "12px 18px", fontSize: 13, fontWeight: 700, cursor: "pointer", boxShadow: "0 10px 28px rgba(201,144,15,.45)" }}>
                💰 {allPriceEdits.length} Price Change{allPriceEdits.length === 1 ? "" : "s"} Pending
              </button>
            )}
            {canEdit && sheetCostEdits.length > 0 && (
              <button onClick={() => { setGeneratedCostSql(""); setShowSaveCosts(true); }}
                style={{ fontSize: 10, fontWeight: 700, color: S.onAccent, background: S.blue, border: "1px solid " + S.blue, padding: "5px 10px", borderRadius: 6, cursor: "pointer" }}>
                🧾 Save Costs ({sheetCostEdits.length})
              </button>
            )}
            {isAdmin && <button onClick={() => setShowManageCats(true)} style={{ fontSize: 10, fontWeight: 700, color: S.purple, background: "rgba(176,125,232,.1)", border: "1px solid rgba(176,125,232,.3)", padding: "5px 10px", borderRadius: 6, cursor: "pointer" }}>🏷️ Categories</button>}
            <button onClick={() => { setShowLoadDialog(true); }} style={{ fontSize: 10, fontWeight: 700, color: S.text, background: S.tag, border: "1px solid " + S.border, padding: "5px 10px", borderRadius: 6, cursor: "pointer" }}>📂 My Sheets{savedSheets.length > 0 ? " (" + savedSheets.length + ")" : ""}</button>
            <button onClick={() => { setSaveNameInput(currentSheetName || ""); setSaveError(""); setShowSaveDialog(true); }}
              disabled={!sheetItems.length}
              style={{ fontSize: 10, fontWeight: 700, color: sheetItems.length ? S.onAccent : S.muted, background: sheetItems.length ? S.green : S.tag, border: "1px solid " + (sheetItems.length ? S.green : S.border), padding: "5px 10px", borderRadius: 6, cursor: sheetItems.length ? "pointer" : "not-allowed" }}>💾 Save List</button>
          </div>
        </div>
      </div>

      <div style={{ position: "relative", marginBottom: 4 }}>
        <input ref={searchRef} type="search" placeholder={searchNational ? "Search National Products..." : "Search product to add to sheet..."}
          value={search} onChange={e => setSearch(e.target.value)}
          style={{ width: "100%", background: S.inputBg, border: "1.5px solid " + (searchNational ? S.blue : S.border), borderRadius: 8, color: S.text, fontSize: 16, padding: "9px 36px 9px 12px", outline: "none", boxSizing: "border-box" }} />
        {search && <button onClick={() => { setSearch(""); searchRef.current?.focus(); }} style={{ position: "absolute", right: 10, top: "50%", transform: "translateY(-50%)", background: "none", border: "none", color: S.muted, fontSize: 16, cursor: "pointer" }}>✕</button>}
        {!searchNational && searchResults.length > 0 && (
          <div style={{ position: "absolute", top: "calc(100% + 4px)", left: 0, right: 0, zIndex: 50, background: S.card, border: "1px solid " + S.border, borderRadius: 8, maxHeight: 320, overflowY: "auto", boxShadow: "0 8px 24px rgba(0,0,0,.4)" }}>
            {searchResults.map(p => (
              <div key={p.item} onClick={() => addToSheet(p)}
                style={{ padding: "9px 12px", cursor: "pointer", borderBottom: "1px solid " + S.border, display: "flex", justifyContent: "space-between", alignItems: "center" }}>
                <div>
                  <div style={{ fontSize: 13, fontWeight: 600, color: S.text }}>{p.name}</div>
                  <div style={{ fontSize: 10, color: S.muted }}>{p.pkg ? p.pkg + " · " : ""}#{p.item}{p.cat ? " · " + p.cat : ""}</div>
                </div>
                <span style={{ fontSize: 16, color: S.blue }}>+</span>
              </div>
            ))}
          </div>
        )}
        {searchNational && search.trim() && (
          <div style={{ position: "absolute", top: "calc(100% + 4px)", left: 0, right: 0, zIndex: 50, background: S.card, border: "1px solid " + S.blue, borderRadius: 8, maxHeight: 320, overflowY: "auto", boxShadow: "0 8px 24px rgba(0,0,0,.4)" }}>
            {nationalSearchResults.length === 0 && (
              <div style={{ padding: "12px", fontSize: 12, color: S.muted, textAlign: "center" }}>No national products match "{search}"</div>
            )}
            {nationalSearchResults.map(p => (
              <div key={p.item} onClick={() => addToSheet(adaptNational(p))}
                style={{ padding: "9px 12px", cursor: "pointer", borderBottom: "1px solid " + S.border, display: "flex", justifyContent: "space-between", alignItems: "center" }}>
                <div>
                  <div style={{ fontSize: 13, fontWeight: 600, color: S.text, display: "flex", alignItems: "center", gap: 6 }}>
                    {p.name}
                    <span style={{ fontSize: 9, color: S.blue, background: "rgba(91,155,213,.1)", border: "1px solid rgba(91,155,213,.3)", padding: "1px 5px", borderRadius: 4 }}>NATIONAL</span>
                  </div>
                  <div style={{ fontSize: 10, color: S.muted }}>{p.pkg ? p.pkg + " · " : ""}#{p.item} · Nat. Target {fmt(p.nat_target)}</div>
                </div>
                <span style={{ fontSize: 16, color: S.blue }}>+</span>
              </div>
            ))}
          </div>
        )}
      </div>
      <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 8 }}>
        <button onClick={() => setSearchNational(v => !v)}
          style={{ fontSize: 10, fontWeight: 700, color: searchNational ? S.onAccent : S.blue, background: searchNational ? S.blue : "rgba(91,155,213,.1)", border: "1px solid " + (searchNational ? S.blue : "rgba(91,155,213,.3)"), padding: "5px 10px", borderRadius: 6, cursor: "pointer" }}>
          🌎 {searchNational ? "Searching National" : "Search National Products"}
        </button>
        {searchNational && <span style={{ fontSize: 10, color: S.muted }}>Only for items not already in your district's price list. No Wholesale/Floor price -- shows National Target ("(Nat)") instead.</span>}
      </div>
      <div style={{ display: "flex", alignItems: "center", gap: 4, marginBottom: 4 }}>
        <button onClick={() => pillRowRef.current?.scrollBy({ left: -220, behavior: "smooth" })}
          style={{ flexShrink: 0, fontSize: 12, color: S.muted, background: S.tag, border: "1px solid " + S.border, borderRadius: 6, width: 24, height: 24, cursor: "pointer", lineHeight: 1 }}>‹</button>
        <div ref={pillRowRef} onWheel={e => { if (Math.abs(e.deltaY) > Math.abs(e.deltaX)) pillRowRef.current.scrollLeft += e.deltaY; }}
          style={{ display: "flex", gap: 5, overflowX: "auto", scrollbarWidth: "none", scrollBehavior: "smooth" }}>
          {cats.map(c => (
            <button key={c} onClick={() => { setCatFilter(c); setSearch(""); }}
              draggable={isAdmin && c !== "ALL"}
              onDragStart={e => { setDragCat(c); e.dataTransfer.effectAllowed = "move"; }}
              onDragOver={e => { if (c !== "ALL") { e.preventDefault(); if (dragOverCat !== c) setDragOverCat(c); } }}
              onDrop={e => { e.preventDefault(); reorderCategory(dragCat, c); setDragCat(null); setDragOverCat(null); }}
              onDragEnd={() => { setDragCat(null); setDragOverCat(null); }}
              style={{ fontSize: 10, background: c === catFilter ? S.greenDim : S.tag, border: "1px solid " + (dragOverCat === c && dragCat !== c ? S.blue : c === catFilter ? S.green : S.border), color: c === catFilter ? "#fff" : S.muted, borderRadius: 20, padding: "5px 11px", whiteSpace: "nowrap", cursor: isAdmin && c !== "ALL" ? "grab" : "pointer", letterSpacing: .5, textTransform: "uppercase", flexShrink: 0, opacity: dragCat === c ? .4 : 1 }}>
              {c === "ALL" ? "All" : c}{c !== "ALL" && catCounts[c] ? " (" + catCounts[c] + ")" : ""}
            </button>
          ))}
        </div>
        <button onClick={() => pillRowRef.current?.scrollBy({ left: 220, behavior: "smooth" })}
          style={{ flexShrink: 0, fontSize: 12, color: S.muted, background: S.tag, border: "1px solid " + S.border, borderRadius: 6, width: 24, height: 24, cursor: "pointer", lineHeight: 1 }}>›</button>
      </div>
      {isAdmin && <div style={{ fontSize: 9, color: S.muted, marginBottom: 12 }}>Scroll with the arrows, or drag a category to reorder.</div>}
      {!isAdmin && <div style={{ marginBottom: 12 }} />}

      {catFilter !== "ALL" && !search && (
        <div style={{ marginBottom: 20, background: "rgba(91,155,213,.06)", border: "1px solid rgba(91,155,213,.28)", borderRadius: 12, padding: 14 }}>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline", marginBottom: 8 }}>
            <div style={{ fontSize: 13, fontWeight: 800, color: S.blue }}>🪜 Value Ladder — {catFilter}</div>
            <div style={{ fontSize: 10, color: S.muted }}>{ladderRows.length} products · cheapest to most expensive · at each product's default rate</div>
          </div>
          {ladderRows.length === 0 ? (
            <div style={{ fontSize: 12, color: S.muted, padding: "16px 0" }}>No products found in this category.</div>
          ) : (
            <div style={{ overflowX: "auto", overflowY: "auto", maxHeight: "65vh" }}>
              <table style={{ width: "100%", borderCollapse: "collapse", minWidth: 700 }}>
                <thead>
                  <tr>
                    {["Product", "Rate/ac", "Cost", "Price", "Price/ac", "Profit/ac", "Margin", ""].map((h, i) => (
                      <th key={i} style={{ textAlign: i >= 1 && i <= 6 ? "right" : "left", fontWeight: 700, color: S.muted, fontSize: 9, textTransform: "uppercase", letterSpacing: .5, padding: "6px 8px", borderBottom: "1px solid " + S.border, whiteSpace: "nowrap", position: "sticky", top: 0, background: S.headerBg, zIndex: 2 }}>{h}</th>
                    ))}
                  </tr>
                </thead>
                <tbody>
                  {ladderRows.map(r => (
                    <tr key={r.p.item} style={{ opacity: sheetItemSet.has(r.p.item) ? .5 : 1, background: catRowBg(r.p.cat) }}>
                      <td style={{ padding: "8px", borderBottom: "1px solid " + S.border + "60" }}>
                        <div style={{ fontSize: 13, fontWeight: 600, color: S.text }}>{r.p.name}</div>
                        <div style={{ fontSize: 10, color: S.muted, display: "flex", alignItems: "center", gap: 5 }}>
                          {r.p.pkg ? r.p.pkg + " · " : ""}#{r.p.item}
                          {isAdmin && (editingCatItem === r.p.item ? (
                            <select autoFocus defaultValue={r.p.cat} onBlur={() => setEditingCatItem(null)}
                              onChange={e => changeProductCategory(r.p.item, e.target.value)}
                              style={{ fontSize: 9, background: S.inputBg, color: S.text, border: "1px solid " + S.blue, borderRadius: 4 }}>
                              {cats.filter(c => c !== "ALL").map(c => <option key={c} value={c}>{c}</option>)}
                            </select>
                          ) : (
                            <span onClick={() => setEditingCatItem(r.p.item)} style={{ cursor: "pointer", textDecoration: "underline dotted", color: S.purple }} title="Click to recategorize">✎ edit cat</span>
                          ))}
                        </div>
                      </td>
                      <td style={{ padding: "8px", textAlign: "right", borderBottom: "1px solid " + S.border + "60", color: S.text }}>{r.rate != null && r.p.rate_unit ? r.rate + " " + r.p.rate_unit : "—"}</td>
                      <td style={{ padding: "8px", textAlign: "right", borderBottom: "1px solid " + S.border + "60" }}>
                        <div style={{ color: S.text }}>{fmt(r.cost)}</div>
                        <div style={{ fontSize: 9, color: r.costSource === "Landed" ? S.blue : S.muted }} title={r.costSource === "Landed" ? `${r.costNLots} lot${r.costNLots===1?"":"s"} · range ${fmt(r.costLow)}–${fmt(r.costHigh)}` : "No landed cost data for this district"}>{r.costSource}</div>
                      </td>
                      <td style={{ padding: "8px", textAlign: "right", borderBottom: "1px solid " + S.border + "60" }}>
                        <EditablePrice value={r.price} isEdited={r.isEdited} onChange={v => setPriceOverride(r.p, v)}
                          title={r.isEdited ? "Personal to this sheet only -- won't change pricing for anyone else" : "Click to try a different price"} />
                        <div style={{ fontSize: 9, color: S.muted, display: "flex", justifyContent: "flex-end", alignItems: "center", gap: 4 }}>

                      </td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>

      <div style={{ background: "rgba(76,175,106,.06)", border: "1px solid rgba(76,175,106,.28)", borderRadius: 12, padding: 14 }}>
        <div style={{ display: "flex", alignItems: "center", flexWrap: "wrap", gap: 8, marginBottom: rows.length === 0 ? 0 : 10 }}>

          <div style={{ overflowX: "auto", overflowY: "auto", maxHeight: "65vh" }}>

              <tbody>
                {sortedGroupedRows.map(group => (

                      isDragOver={dragOverCat === group.cat && dragCat !== group.cat}

                      onRowDragOver={e => { if (dragCat) { e.preventDefault(); if (dragOverCat !== group.cat) setDragOverCat(group.cat); } }}

                              <button onClick={() => setNTreatBasis("urea")} style={{ fontSize: 10, fontWeight: 700, color: nTreatBasis === "urea" ? S.onAccent : S.blue, background: nTreatBasis === "urea" ? S.blue : "transparent", border: "1px solid " + S.blue, padding: "3px 8px", borderRadius: 5, cursor: "pointer" }}>Urea</button>
                            </div>

                              <label style={{ fontSize: 10, color: S.muted, display: "flex", alignItems: "center", gap: 4 }}>

                                  onChange={e => { const v = parseFloat(e.target.value); if (!isNaN(v)) setUanGalRate(v); }}

                              </label>

                              <label style={{ fontSize: 10, color: S.muted, display: "flex", alignItems: "center", gap: 4 }}>

                              </label>
                            )}
                            <span style={{ fontSize: 9, color: S.muted, fontStyle: "italic" }}>same rate applied to every N-Dure row below, so cost/profit stays apples-to-apples</span>
                          </div>
                        </td>
                      </tr>
                    )}
                    {group.items.map(r => (

                            style={{ cursor: sortCol ? "not-allowed" : "grab", color: S.muted, fontSize: 14, userSelect: "none", touchAction: "none", opacity: sortCol ? .35 : 1 }}
                            title={sortCol ? "Clear sort to drag reorder" : "Drag to reorder"}>⠿</span>
                        </td>
                        <td style={{ padding: "8px", borderBottom: "1px solid " + S.border + "60" }}>

                            <div style={{ fontSize: 13, fontWeight: 600, color: S.text }}>{r.p.name}</div>

                        <td style={{ padding: "8px", textAlign: "right", borderBottom: "1px solid " + S.border + "60" }}>

                            : <SetRateUnit onSet={u => setSheetItemRateUnit(r.p.item, u)} />}
                        </td>
                        <td style={{ padding: "8px", textAlign: "right", borderBottom: "1px solid " + S.border + "60" }}>

                            : <div style={{ color: S.text }}>{fmt(r.cost)}</div>}
                          <div style={{ fontSize: 9, color: r.costIsEdited ? S.amber : r.costSource === "Landed" ? S.blue : S.muted, display: "flex", justifyContent: "flex-end", alignItems: "center", gap: 4 }}
                            title={r.costIsEdited ? "Manually entered — not yet saved to landed_costs" : r.costSource === "Landed" ? `${r.costNLots} lot${r.costNLots===1?"":"s"} · range ${fmt(r.costLow)}–${fmt(r.costHigh)}` : "No landed cost data for this district"}>
                            {r.costSource}
                            {r.costIsEdited && (
                              <React.Fragment>
                                <span style={{ color: S.muted, fontStyle: "italic" }}>🔒 yours only</span>
                                <span onClick={() => clearSheetItemCost(r.p.item)} title="Reset to Landed/Mfg cost"
                                  style={{ cursor: "pointer", color: S.amber, textDecoration: "underline" }}>↺ reset</span>
                              </React.Fragment>
                            )}
                          </div>
                        </td>
                        <td style={{ padding: "8px", textAlign: "right", borderBottom: "1px solid " + S.border + "60" }}>
                          <EditablePrice value={r.price} isEdited={r.isEdited} onChange={v => setSheetItemPrice(r.p, v)}
                            title={r.isEdited ? "Personal to this sheet only -- won't change pricing for anyone else" : "Click to try a different price"} />
                          <div style={{ fontSize: 9, color: S.muted, display: "flex", justifyContent: "flex-end", alignItems: "center", gap: 4 }}>
                            {r.label}
                            {r.isEdited && (
                              <React.Fragment>
                                <span style={{ color: S.muted, fontStyle: "italic" }}>🔒 yours only</span>
                                <span onClick={() => clearSheetItemPrice(r.p.item, tier)} title="Reset to list price"
                                  style={{ cursor: "pointer", color: S.amber, textDecoration: "underline" }}>↺ reset</span>
                              </React.Fragment>
                            )}
                          </div>
                        </td>
                        <td style={{ padding: "8px", textAlign: "right", borderBottom: "1px solid " + S.border + "60", color: S.text }}>{r.costAc != null ? fmtAc(r.costAc) : "—"}</td>
                        <td style={{ padding: "8px", textAlign: "right", borderBottom: "1px solid " + S.border + "60", color: S.text }}>{r.priceAc != null ? fmtAc(r.priceAc) : "—"}</td>
                        <td style={{ padding: "8px", textAlign: "right", borderBottom: "1px solid " + S.border + "60", fontWeight: 800, color: r.profitAc == null ? S.muted : r.profitAc >= 0 ? S.green : "#ef4444" }}>
                          {r.profitAc != null ? fmtAc(r.profitAc) : "—"}
                        </td>
                        <td style={{ padding: "8px", textAlign: "right", borderBottom: "1px solid " + S.border + "60" }}>
                          <EditableMargin value={r.marginPct} cost={r.cost} isEdited={r.isEdited} onPriceChange={v => setSheetItemPrice(r.p, v)} />
                        </td>
                        <td style={{ padding: "8px", borderBottom: "1px solid " + S.border + "60", minWidth: 140 }}>
                          <EditableNote value={r.note} onChange={v => updateNote(r.p.item, v)} />
                        </td>
                        <td style={{ padding: "8px", textAlign: "right", borderBottom: "1px solid " + S.border + "60" }}>
                          <button onClick={() => removeFromSheet(r.p.item)} style={{ background: "none", border: "none", color: S.muted, fontSize: 16, cursor: "pointer", padding: 2 }}>✕</button>
                        </td>
                      </tr>
                    ))}
                  </React.Fragment>
                ))}
              </tbody>
            </table>
          </div>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginTop: 14, paddingTop: 12, borderTop: "2px solid " + S.border }}>
            <div style={{ display: "flex", gap: 8 }}>
              <button onClick={clearSheet} style={{ fontSize: 11, color: "#ef4444", background: "rgba(239,68,68,.1)", border: "1px solid rgba(239,68,68,.2)", padding: "6px 12px", borderRadius: 6, cursor: "pointer" }}>Clear Sheet</button>
              <button onClick={exportToExcel} style={{ fontSize: 11, fontWeight: 700, color: S.green, background: "rgba(76,175,106,.1)", border: "1px solid rgba(76,175,106,.3)", padding: "6px 12px", borderRadius: 6, cursor: "pointer" }}>📊 Export Excel</button>

            </div>
            <div style={{ textAlign: "right" }}>
              <div style={{ fontSize: 9, color: S.muted, textTransform: "uppercase", letterSpacing: 1 }}>Total Profit / Acre (all products, stacked)</div>
              <div style={{ fontSize: 20, fontWeight: 800, color: totalProfitAc >= 0 ? S.green : "#ef4444" }}>{fmtAc(totalProfitAc)}</div>
            </div>
          </div>
        </React.Fragment>
      )}
      </div>

      {showPrintPanel && (
        <div onClick={() => setShowPrintPanel(false)} style={{ position: "fixed", inset: 0, zIndex: 1000, background: "rgba(0,0,0,.65)", display: "flex", alignItems: "center", justifyContent: "center", padding: 20 }}>
          <div onClick={e => e.stopPropagation()} style={{ background: S.card, borderRadius: 16, maxWidth: 380, width: "100%", padding: "20px" }}>
            <div style={{ fontSize: 16, fontWeight: 800, color: S.text, marginBottom: 4 }}>Print / Share Sheet</div>

            <input type="text" placeholder={currentSheetName ? `Title (defaults to "${currentSheetName}")` : "Sheet title (e.g. grower or field name)"}

              style={{ width: "100%", background: S.inputBg, border: "1.5px solid " + S.border, borderRadius: 8, color: S.text, fontSize: 13, padding: "8px 10px", outline: "none", boxSizing: "border-box", marginBottom: 14 }} />

            <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 8, marginBottom: 18 }}>
              {[["rate", "Rate/ac"], ["cost", "Cost"], ["price", "Price"], ["priceLabel", "Price label (tier/edited)"], ["costAc", "Cost/ac"], ["priceAc", "Price/ac"], ["profitAc", "Profit/ac"], ["marginPct", "Margin %"], ["notes", "Notes"]].map(([key, label]) => (
                <label key={key} style={{ display: "flex", alignItems: "center", gap: 7, fontSize: 12, color: S.text, cursor: "pointer" }}>
                  <input type="checkbox" checked={printCols[key]} onChange={e => setPrintCols(prev => ({ ...prev, [key]: e.target.checked }))}
                    style={{ width: 15, height: 15, accentColor: S.blue }} />
                  {label}
                </label>
              ))}
            </div>

            <label style={{ display: "flex", alignItems: "center", gap: 7, fontSize: 12, color: S.text, cursor: "pointer", marginBottom: 10 }}>
              <input type="checkbox" checked={printColors} onChange={e => setPrintColors(e.target.checked)}
                style={{ width: 15, height: 15, accentColor: S.blue }} />
              Category colors
            </label>

            <label style={{ display: "flex", alignItems: "center", gap: 7, fontSize: 12, color: S.text, cursor: "pointer", marginBottom: 14 }}>
              <input type="checkbox" checked={printShowSubheader} onChange={e => setPrintShowSubheader(e.target.checked)}
                style={{ width: 15, height: 15, accentColor: S.blue }} />
              District/tier subheader (e.g. "East TX · Wholesale pricing")
            </label>

            <label style={{ display: "flex", alignItems: "center", gap: 7, fontSize: 12, color: S.text, cursor: "pointer", marginBottom: 18, background: bidMode ? "rgba(91,155,213,.1)" : "transparent", border: "1px solid " + (bidMode ? "rgba(91,155,213,.35)" : "transparent"), borderRadius: 8, padding: "8px 10px" }}>
              <input type="checkbox" checked={bidMode} onChange={e => toggleBidMode(e.target.checked)}
                style={{ width: 15, height: 15, accentColor: S.blue }} />
              <span>🤝 <b>Bid Mode</b> — hides the price label and district/tier subheader above, for sharing with a customer</span>
            </label>

            <div style={{ display: "flex", gap: 8 }}>
              <button onClick={() => setShowPrintPanel(false)} style={{ flex: 1, fontSize: 12, color: S.muted, background: S.tag, border: "1px solid " + S.border, padding: "10px", borderRadius: 8, cursor: "pointer" }}>Cancel</button>
              <button onClick={() => {
                setShowPrintPanel(false);
                const d = new Date();
                const stamp = (d.getMonth() + 1) + "." + String(d.getDate()).padStart(2, "0") + "." + String(d.getFullYear()).slice(-2);
                const originalTitle = document.title;
                // Suggested Save-as-PDF filename comes from document.title at
                // print time -- match it to the same title shown in the PDF's
                // own header (sheet name, not the app's tab title) so the
                // saved file is named e.g. "Bill Crow 2027 8.27.26.pdf".
                const effectiveTitle = printTitle || currentSheetName || "WE Price Sheet";
                document.title = effectiveTitle + " " + stamp;
                const restore = () => { document.title = originalTitle; window.removeEventListener("afterprint", restore); };
                window.addEventListener("afterprint", restore);
                Analytics.track("sheet_print", {
                  title: effectiveTitle, count: sheetItems.length, district: dist, tier, bidMode,
                  cols: Object.entries(printCols).filter(([k, v]) => v).map(([k]) => k),
                });
                setTimeout(() => window.print(), 60);
              }}
                style={{ flex: 1, fontSize: 12, fontWeight: 700, color: S.onAccent, background: S.blue, border: "none", padding: "10px", borderRadius: 8, cursor: "pointer" }}>🖨️ Print / Save PDF</button>
            </div>
          </div>
        </div>
      )}

      {showSaveDialog && (
        <div onClick={() => setShowSaveDialog(false)} style={{ position: "fixed", inset: 0, zIndex: 1000, background: "rgba(0,0,0,.65)", display: "flex", alignItems: "center", justifyContent: "center", padding: 20 }}>
          <div onClick={e => e.stopPropagation()} style={{ background: S.card, borderRadius: 16, maxWidth: 380, width: "100%", padding: "20px" }}>
            <div style={{ fontSize: 16, fontWeight: 800, color: S.text, marginBottom: 4 }}>Save List</div>
            <div style={{ fontSize: 11, color: S.muted, marginBottom: 14 }}>{sheetItems.length} product{sheetItems.length === 1 ? "" : "s"} · {dist === "wtx" ? "West TX" : "East TX"} · {tier}</div>
            <input type="text" autoFocus placeholder="List name (e.g. Corn Starter Package)" value={saveNameInput} onChange={e => setSaveNameInput(e.target.value)}
              onKeyDown={e => { if (e.key === "Enter") saveSheet(!currentSheetId); }}
              style={{ width: "100%", background: S.inputBg, border: "1.5px solid " + S.border, borderRadius: 8, color: S.text, fontSize: 13, padding: "9px 10px", outline: "none", boxSizing: "border-box", marginBottom: 10 }} />
            {saveError && <div style={{ fontSize: 11, color: "#ef4444", marginBottom: 10 }}>{saveError}</div>}
            <div style={{ display: "flex", gap: 8 }}>
              <button onClick={() => setShowSaveDialog(false)} style={{ flex: 1, fontSize: 12, color: S.muted, background: S.tag, border: "1px solid " + S.border, padding: "10px", borderRadius: 8, cursor: "pointer" }}>Cancel</button>

              <button onClick={() => saveSheet(false)} disabled={!saveNameInput.trim()}
                style={{ flex: 1, fontSize: 12, fontWeight: 700, color: S.onAccent, background: S.green, border: "none", padding: "10px", borderRadius: 8, cursor: saveNameInput.trim() ? "pointer" : "not-allowed", opacity: saveNameInput.trim() ? 1 : .5 }}>
                {currentSheetId ? "Update" : "Save"}
              </button>
            </div>
          </div>
        </div>
      )}

      {showLoadDialog && (
        <div onClick={() => setShowLoadDialog(false)} style={{ position: "fixed", inset: 0, zIndex: 1000, background: "rgba(0,0,0,.65)", display: "flex", alignItems: "center", justifyContent: "center", padding: 20 }}>
          <div onClick={e => e.stopPropagation()} style={{ background: S.card, borderRadius: 16, maxWidth: 420, width: "100%", maxHeight: "80vh", display: "flex", flexDirection: "column" }}>
            <div style={{ padding: "18px 20px 10px", fontSize: 16, fontWeight: 800, color: S.text }}>My Sheets</div>
            <div style={{ overflowY: "auto", padding: "0 20px 20px" }}>
              {!savedSheetsLoaded ? (
                <div style={{ fontSize: 12, color: S.muted, padding: "20px 0" }}>Loading...</div>
              ) : savedSheets.length === 0 ? (
                <div style={{ fontSize: 12, color: S.muted, padding: "20px 0" }}>No saved lists yet. Build a sheet and hit Save List.</div>
              ) : savedSheets.map(s => (
                <div key={s.id} style={{ display: "flex", justifyContent: "space-between", alignItems: "center", padding: "10px 0", borderBottom: "1px solid " + S.border }}>
                  <div onClick={() => loadSheet(s)} style={{ cursor: "pointer", flex: 1 }}>
                    <div style={{ fontSize: 13, fontWeight: 600, color: S.text }}>{s.name}</div>
                    <div style={{ fontSize: 10, color: S.muted }}>{(s.items || []).length} products · {s.district === "wtx" ? "West TX" : "East TX"} · {s.tier} · {new Date(s.updated_at).toLocaleDateString()}</div>
                  </div>
                  <button onClick={() => deleteSavedSheet(s.id)} style={{ background: "none", border: "none", color: S.muted, fontSize: 15, cursor: "pointer", padding: "4px 8px" }}>✕</button>
