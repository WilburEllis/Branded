const Analytics = (() => {
  const sessionId = Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  let currentUser = null;
  let heartbeatInterval = null;
  let lastSearchLog = 0;

  function setUser(profile, email) {
    currentUser = { id: profile.id, email: email || profile.email || "", name: profile.display_name || profile.name || "" };
    if (heartbeatInterval) clearInterval(heartbeatInterval);
    heartbeatInterval = setInterval(() => track("session_heartbeat"), 60000);
  }

  function track(eventType, eventData) {
    if (!currentUser) return;
    try {
      supabaseClient.from("user_activity").insert({
        user_id: currentUser.id,
        user_email: currentUser.email,
        user_name: currentUser.name,
        event_type: eventType,
        event_data: eventData || {},
        session_id: sessionId
      }).then(() => {});
    } catch (e) {}
  }

  function trackSearch(term) {
    const now = Date.now();
    if (now - lastSearchLog < 2000) return;
    lastSearchLog = now;
    track("search", { term });
  }

  function cleanup() {
    if (heartbeatInterval) clearInterval(heartbeatInterval);
  }

  return { setUser, track, trackSearch, sessionId, cleanup };
})();

// ═══ UTILITIES ═══
function fmt(v) { if (v === null || v === undefined || typeof v !== "number") return "—"; return "$" + v.toFixed(v < 2 ? 3 : 2); }
function fmtAc(v) { return "$" + v.toFixed(2) + "/ac"; }

function calcPPA(pkg, price, rateMin, rateUnit, sprayVol, dryOzPrice, ozPerUnit) {
  if (!price || rateMin == null || !rateUnit) return null;
  const u = rateUnit.toLowerCase(); const per100 = u.indexOf("/100") !== -1;
  if (dryOzPrice) {
    const divisor = ozPerUnit != null ? ozPerUnit : 1;
    return { val: price * (rateMin / divisor), per100: false };
  }
  const isDry = pkg && /\d+\s*LB/i.test(pkg);
  if (isDry) {
    // A dry/by-weight product can still be rate'd per 100 gal of carrier
    // (e.g. CUT-RATE: 20 LB bag, priced per lb, "3 lb/100gal") rather than a
    // flat lb/ac rate -- same carrier-volume conversion as the liquid path
    // below, just applied to a $/lb or $/oz price instead of $/gal.
    const carrierFactor = per100 ? (sprayVol / 100) : 1;
    if (u.indexOf("lb") !== -1) return { val: price * rateMin * carrierFactor, per100 };
    if (u.indexOf("oz") !== -1) return { val: (price / 16) * rateMin * carrierFactor, per100 };
    return null;
  }
  // "oz" must be checked before "gal" -- a per-100-gal-carrier rate written
  // as e.g. "fl oz/100gal" legitimately contains the substring "gal" in its
  // own denominator ("100gal"), which used to false-positive into the gal
  // branch (upg=1) instead of the correct oz branch (upg=128, since price is
  // per-gallon-of-product and there are 128 fl oz/gal). Caught 2026-07-30:
  // EMBRECE-EA and PENATROL (both oz/100gal-rated, gallon-priced) were
  // showing Price/ac 128x too high in production because of this.
  const upg = u.indexOf("qt") !== -1 ? 4 : u.indexOf("pt") !== -1 ? 8 : u.indexOf("oz") !== -1 ? 128 : u.indexOf("gal") !== -1 ? 1 : 128;
  if (per100) return { val: (sprayVol / 100) * (price / upg) * rateMin, per100: true };
  return { val: (price / upg) * rateMin, per100: false };
}

// For "dry oz price" products (EMPLOY's 3 SKUs, as of 2026-08), Cost/Target/
// Floor are all stored per-PACKAGE (calcPPA's dryOzPrice branch divides by
// oz_per_unit to get an effective $/oz), but `skus.wholesale` is stored as
// an already-flat $/oz rate -- same $9.75 across all 3 EMPLOY package sizes,
// unlike Cost which correctly scales ($52/$104/$130). Feeding raw
// p.wholesale into the same divide-by-oz_per_unit math as Cost/Target/Floor
// silently produces a Price/ac (and Margin%) far below Cost/ac -- caught by
// Nathan 2026-08-04 on the 5 LB bag (Wholesale Price/ac was $0.30/ac vs.
// $3.25/ac Cost/ac). This helper normalizes wholesale onto the same
// per-package basis everything else uses, so it flows correctly through
// calcPPA/PriceCell margin math without a special case at every call site.
// generatePriceSql() below converts back to the raw per-oz rate when writing
// SQL, since that's what the `skus.wholesale` column actually stores.
function wholesaleBasis(p) {
  return (p.dry_oz_price && p.oz_per_unit) ? p.wholesale * p.oz_per_unit : p.wholesale;
}

function calcNTreatPPA(pricePerGal, rateQtPerTon, uanGalPerAcre) {
  if (!pricePerGal || !rateQtPerTon) return null;
  return (uanGalPerAcre * (rateQtPerTon / 4) * pricePerGal) / 180;
}
function calcUreaPPA(pricePerGal, rateQtPerTon, lbsUreaPerAcre) {
  if (!pricePerGal || !rateQtPerTon) return null;
  return lbsUreaPerAcre * (rateQtPerTon / 4) / 2000 * pricePerGal;
}

function natFloorOf(p) { return p.nat_target != null ? Math.round(p.nat_target * 0.95 * 100) / 100 : null; }

// national_prices rows aren't the same shape as v_tx_pricing rows (e.g. cost
// lives in `cost_2026`, not `cost`) -- this normalizes a raw national row
// onto the fields the Profit Sheet's calc pipeline (costFor/rawPriceFor/
// calcPPA) already reads, WITHOUT inventing data: whatever the row already
// has (rate_unit, cat, oz_per_unit, etc., if the table has them) passes
// through untouched via the spread; only `cost` gets a fallback. Since the
// row has no w_target/e_target/w_floor/e_floor at all, rawPriceFor's
// existing "fall back to nat_target when the district value is missing"
// logic kicks in automatically and labels it "(Nat)" -- no separate branch
// needed. Wholesale has no national equivalent, so it correctly shows "—".
function adaptNational(p) {
  return { ...p, cost: p.cost != null ? p.cost : p.cost_2026, isNationalOnly: true };
}

// Preset swatches offered in the Manage Categories picker. Nathan can assign

// Best-effort default so a category never looks "unstyled" before anyone's
// touched the picker -- purely a starting guess, fully overridable.
function guessCategoryColor(cat) {
  const c = (cat || "").toLowerCase();
  if (c.includes("drift")) return "#e67e22";
  if (c.includes("water")) return "#3498db";
  if (c.includes("nis")) return "#e74c3c";
  if ((c.includes("soil") || c.includes("starter")) && c.includes("fert")) return "#8b5a2b";
  if (c.includes("foliar")) return "#27ae60";
  if (c.includes("surfactant")) return "#d6336c";
  if (c.includes("oil")) return "#d4ac0d";
  if (c.includes("biological") || c.includes("n-fixing")) return "#16a085";
  return "#7f8c8d";
}

function resolvePrice(p, district, location, overridesMap) {
  if (location && overridesMap) {
    const key = p.item + ":" + location;
    const ov = overridesMap[key];
    if (ov && (ov.floor_price != null || ov.target_price != null)) {
      return { floor: ov.floor_price, target: ov.target_price, label: ov.location_name || location, isOverride: true };
    }
  }
  // Cascade, per Nathan (2026-09-01): Location override (above) -> District
  // price -> National price. Used to require SOME district price to already
  // exist before falling back to National (see git-blame-equivalent history
  // in project memory) -- that gate is gone now; a product with zero
  // district pricing at all (e.g. newly added to skus straight from
  // National Ref, nothing in district_prices yet) now correctly falls all
  // the way through to National instead of showing no price.
  if (district === "wtx") {
    if (p.w_target != null || p.w_floor != null) return { floor: p.w_floor, target: p.w_target, label: "West TX", isOverride: false };
    if (p.nat_target != null) return { floor: natFloorOf(p), target: p.nat_target, label: "West TX", isOverride: false, isNationalFallback: true };
    return { floor: null, target: null, label: "West TX", isOverride: false };
  }
  if (p.e_target != null || p.e_floor != null) return { floor: p.e_floor, target: p.e_target, label: "East TX", isOverride: false };
  if (p.nat_target != null) return { floor: natFloorOf(p), target: p.nat_target, label: "East TX", isOverride: false, isNationalFallback: true };
  return { floor: null, target: null, label: "East TX", isOverride: false };
}

function hasDistrictPrice(p, district, location, overridesMap) {
  const r = resolvePrice(p, district, location, overridesMap);
  return r.target != null || r.floor != null;
}

// ═══ FORGOT PASSWORD (pre-login) ═══
function ForgotPasswordModal({ onClose }) {
  const [email, setEmail] = useState("");
  const [sending, setSending] = useState(false);
  const [sent, setSent] = useState(false);

  // Same enumeration-safety reasoning as the magic-link attempt: the UI
  // always shows the same "check your email" message regardless of whether
  // the address actually has an account, so a random email can't be used to
  // probe who has access. supabase.auth.resetPasswordForEmail() doesn't
  // create anything and doesn't need shouldCreateUser -- an unknown email
  // just doesn't get a real email sent, silently, which is exactly the
  // behavior wanted here.
  async function sendReset() {
    if (!email.trim()) return;
    setSending(true);
    await supabaseClient.auth.resetPasswordForEmail(email.trim(), {
      redirectTo: window.location.origin + window.location.pathname,
    });
    setSending(false);
    setSent(true);
  }

  return (
    <div onClick={onClose} style={{ position: "fixed", inset: 0, zIndex: 1000, background: "rgba(0,0,0,.65)", display: "flex", alignItems: "center", justifyContent: "center", padding: 20 }}>
      <div onClick={e => e.stopPropagation()} style={{ background: "#0f1f12", border: "1px solid #2a3a2c", borderRadius: 16, maxWidth: 380, width: "100%", padding: 22 }}>
        {sent ? (
          <React.Fragment>
            <div style={{ fontSize: 32, marginBottom: 10 }}>📩</div>
            <div style={{ fontSize: 16, fontWeight: 800, color: "#eaf2eb", marginBottom: 8 }}>Check your email</div>
            <div style={{ fontSize: 12, color: "#9ab8a0", marginBottom: 18, lineHeight: 1.5 }}>
              If {email.trim()} has an account, a password reset link is on its way. Follow it to set a new password.
            </div>
            <button onClick={onClose} style={{ width: "100%", padding: 12, background: "#2d6b3f", border: "none", borderRadius: 10, color: "#fff", fontSize: 13, fontWeight: 700, cursor: "pointer" }}>Close</button>
          </React.Fragment>
        ) : (
          <React.Fragment>
            <div style={{ fontSize: 16, fontWeight: 800, color: "#eaf2eb", marginBottom: 4 }}>Reset Password</div>
            <div style={{ fontSize: 11, color: "#9ab8a0", marginBottom: 16 }}>Enter your login email and we'll send you a reset link.</div>
            <input type="email" placeholder="Email" value={email} onChange={e => setEmail(e.target.value)} className="we-login-input"
              onKeyDown={e => e.key === "Enter" && sendReset()}
              style={{ width: "100%", padding: "14px 18px", background: "#131c14", border: "2px solid #2a3a2c", borderRadius: 12, color: "#eaf2eb", fontSize: 16, outline: "none", marginBottom: 14, boxSizing: "border-box" }} autoFocus autoComplete="off" autoCapitalize="off" />
            <div style={{ display: "flex", gap: 8 }}>
              <button onClick={onClose} style={{ fontSize: 13, color: "#9ab8a0", background: "#131c14", border: "1px solid #2a3a2c", padding: "12px 14px", borderRadius: 10, cursor: "pointer" }}>Cancel</button>
              <button onClick={sendReset} disabled={sending}
                style={{ flex: 1, padding: 12, background: sending ? "#2a3a2c" : "linear-gradient(135deg,#2d6b3f,#4caf6a)", border: "none", borderRadius: 10, color: "#fff", fontSize: 13, fontWeight: 700, cursor: sending ? "wait" : "pointer" }}>
                {sending ? "Sending..." : "Send Reset Link"}
              </button>
            </div>
          </React.Fragment>
        )}
      </div>
    </div>
  );
}

// ═══ SET NEW PASSWORD (after following a reset-password email link) ═══
// Rendered instead of the normal app whenever Supabase fires a
// PASSWORD_RECOVERY auth event (see App()'s onAuthStateChange) -- that event
// carries its own temporary session, which would otherwise just drop the
// user straight into the app without ever prompting for a new password.
function ResetPasswordScreen({ onDone }) {
  const [pw, setPw] = useState("");
  const [pw2, setPw2] = useState("");
  const [saving, setSaving] = useState(false);
  const [error, setError] = useState("");

  async function save() {
    if (pw.length < 6) { setError("Password must be at least 6 characters."); return; }
    if (pw !== pw2) { setError("Passwords don't match."); return; }
    setSaving(true);
    setError("");
    const { error: err } = await supabaseClient.auth.updateUser({ password: pw });
    setSaving(false);
    if (err) { setError(err.message); return; }
    onDone();
  }

  return (
    <div style={{ minHeight: "100vh", background: "linear-gradient(145deg,#0a120b,#0f1f12 50%,#0a120b)", display: "flex", alignItems: "center", justifyContent: "center", padding: 20 }}>
      <div style={{ width: "100%", maxWidth: 380, textAlign: "center" }}>
        <div style={{ fontSize: 42, marginBottom: 8 }}>🔒</div>
        <h1 style={{ fontSize: 22, fontWeight: 800, color: S.green, letterSpacing: 1, textTransform: "uppercase", marginBottom: 4 }}>Set New Password</h1>
        <p style={{ fontSize: 11, color: "#5a7a5c", letterSpacing: 2, textTransform: "uppercase", marginBottom: 32 }}>WE Price Lookup</p>

        <input type="password" placeholder="New password" value={pw} onChange={e => setPw(e.target.value)} className="we-login-input"
          style={{ width: "100%", padding: "14px 18px", background: "#131c14", border: "2px solid #2a3a2c", borderRadius: 12, color: "#eaf2eb", fontSize: 16, outline: "none", marginBottom: 10, boxSizing: "border-box" }} autoFocus />
        <input type="password" placeholder="Confirm new password" value={pw2} onChange={e => setPw2(e.target.value)} className="we-login-input"
          onKeyDown={e => e.key === "Enter" && save()}
          style={{ width: "100%", padding: "14px 18px", background: "#131c14", border: "2px solid #2a3a2c", borderRadius: 12, color: "#eaf2eb", fontSize: 16, outline: "none", marginBottom: 12, boxSizing: "border-box" }} />
        {error && <p style={{ color: "#ef4444", fontSize: 13, marginBottom: 8 }}>{error}</p>}
        <button onClick={save} disabled={saving}
          style={{ width: "100%", padding: 14, background: saving ? S.border : "linear-gradient(135deg,#2d6b3f,#4caf6a)", border: "none", borderRadius: 12, color: "#fff", fontSize: 15, fontWeight: 700, cursor: saving ? "wait" : "pointer" }}>
          {saving ? "Saving..." : "Save New Password"}
        </button>
      </div>
    </div>
  );
}

// ═══ REQUEST ACCESS (pre-login) ═══
function RequestAccessModal({ onClose }) {
  const [name, setName] = useState("");
  const [email, setEmail] = useState("");
  const [role, setRole] = useState("sales");
  const [district, setDistrict] = useState("wtx");
  const [locationText, setLocationText] = useState("");
  const [submitting, setSubmitting] = useState(false);
  const [submitError, setSubmitError] = useState("");
  const [sent, setSent] = useState(false);

  async function submit() {
    if (!name.trim() || !email.trim()) { setSubmitError("Name and email are required."); return; }
    setSubmitting(true);
    setSubmitError("");
    const { error } = await supabaseClient.from("access_requests").insert({
      name: name.trim(),
      email: email.trim(),
      requested_role: role,
      requested_district: district,
      location_text: locationText.trim() || null,
    });
    setSubmitting(false);
    if (error) { setSubmitError("Couldn't submit: " + error.message); return; }

    const subject = encodeURIComponent("WE Price Access Request - " + name.trim());
    const body = encodeURIComponent(
      "Name: " + name.trim() + "\n" +
      "Email: " + email.trim() + "\n" +
      "Requested Role: " + (role === "manager" ? "Manager" : "Sales") + "\n" +
      "Requested District: " + (district === "wtx" ? "West TX" : "East TX") + "\n" +
      "Location/Branch: " + (locationText.trim() || "(not specified)") + "\n"
    );
    window.location.href = "mailto:" + ACCESS_REQUEST_EMAIL + "?subject=" + subject + "&body=" + body;
    setSent(true);
  }

  const btnStyle = (active) => ({
    flex: 1, fontSize: 12, fontWeight: 700, color: active ? "#fff" : "#eaf2eb",
    background: active ? "#2d6b3f" : "#131c14", border: "1px solid " + (active ? "#4caf6a" : "#2a3a2c"),
    padding: "8px 6px", borderRadius: 8, cursor: "pointer",
  });

  return (
    <div onClick={onClose} style={{ position: "fixed", inset: 0, zIndex: 1000, background: "rgba(0,0,0,.65)", display: "flex", alignItems: "center", justifyContent: "center", padding: 20 }}>
      <div onClick={e => e.stopPropagation()} style={{ background: "#0f1f12", border: "1px solid #2a3a2c", borderRadius: 16, maxWidth: 420, width: "100%", maxHeight: "85vh", overflowY: "auto", padding: 22 }}>
        {sent ? (
          <React.Fragment>
            <div style={{ fontSize: 32, marginBottom: 10 }}>✅</div>
            <div style={{ fontSize: 16, fontWeight: 800, color: "#eaf2eb", marginBottom: 8 }}>Request submitted</div>
            <div style={{ fontSize: 12, color: "#9ab8a0", marginBottom: 18, lineHeight: 1.5 }}>
              An email draft with your info should have opened in your mail app -- send it if it didn't go automatically. Nathan will follow up once he's reviewed it.
            </div>
            <button onClick={onClose} style={{ width: "100%", padding: 12, background: "#2d6b3f", border: "none", borderRadius: 10, color: "#fff", fontSize: 13, fontWeight: 700, cursor: "pointer" }}>Close</button>
          </React.Fragment>
        ) : (
          <React.Fragment>
            <div style={{ fontSize: 16, fontWeight: 800, color: "#eaf2eb", marginBottom: 4 }}>Request Access</div>
            <div style={{ fontSize: 11, color: "#9ab8a0", marginBottom: 16 }}>Nathan reviews and approves every request personally.</div>

            <div style={{ fontSize: 10, color: "#9ab8a0", textTransform: "uppercase", letterSpacing: 1, marginBottom: 4 }}>Name</div>
            <input value={name} onChange={e => setName(e.target.value)} className="we-login-input"
              style={{ width: "100%", padding: "10px 12px", background: "#131c14", border: "1.5px solid #2a3a2c", borderRadius: 8, color: "#eaf2eb", fontSize: 14, outline: "none", marginBottom: 12, boxSizing: "border-box" }} />

            <div style={{ fontSize: 10, color: "#9ab8a0", textTransform: "uppercase", letterSpacing: 1, marginBottom: 4 }}>Work Email</div>
            <input type="email" value={email} onChange={e => setEmail(e.target.value)} className="we-login-input"
              style={{ width: "100%", padding: "10px 12px", background: "#131c14", border: "1.5px solid #2a3a2c", borderRadius: 8, color: "#eaf2eb", fontSize: 14, outline: "none", marginBottom: 12, boxSizing: "border-box" }} />

            <div style={{ fontSize: 10, color: "#9ab8a0", textTransform: "uppercase", letterSpacing: 1, marginBottom: 4 }}>Role</div>
            <div style={{ display: "flex", gap: 6, marginBottom: 12 }}>
              <button onClick={() => setRole("sales")} style={btnStyle(role === "sales")}>Sales</button>
              <button onClick={() => setRole("manager")} style={btnStyle(role === "manager")}>Manager</button>
            </div>

            <div style={{ fontSize: 10, color: "#9ab8a0", textTransform: "uppercase", letterSpacing: 1, marginBottom: 4 }}>District</div>
            <div style={{ display: "flex", gap: 6, marginBottom: 12 }}>
              <button onClick={() => setDistrict("wtx")} style={btnStyle(district === "wtx")}>West TX</button>
              <button onClick={() => setDistrict("etx")} style={btnStyle(district === "etx")}>East TX</button>
            </div>

            <div style={{ fontSize: 10, color: "#9ab8a0", textTransform: "uppercase", letterSpacing: 1, marginBottom: 4 }}>Location / Branch</div>
            <input value={locationText} onChange={e => setLocationText(e.target.value)} className="we-login-input" placeholder="e.g. Hereford"
              style={{ width: "100%", padding: "10px 12px", background: "#131c14", border: "1.5px solid #2a3a2c", borderRadius: 8, color: "#eaf2eb", fontSize: 14, outline: "none", marginBottom: 12, boxSizing: "border-box" }} />

            {submitError && <p style={{ color: "#ef4444", fontSize: 12, marginBottom: 10 }}>{submitError}</p>}

            <div style={{ display: "flex", gap: 8 }}>
              <button onClick={onClose} style={{ fontSize: 13, color: "#9ab8a0", background: "#131c14", border: "1px solid #2a3a2c", padding: "12px 14px", borderRadius: 10, cursor: "pointer" }}>Cancel</button>
              <button onClick={submit} disabled={submitting}
                style={{ flex: 1, padding: 12, background: submitting ? "#2a3a2c" : "linear-gradient(135deg,#2d6b3f,#4caf6a)", border: "none", borderRadius: 10, color: "#fff", fontSize: 13, fontWeight: 700, cursor: submitting ? "wait" : "pointer" }}>
                {submitting ? "Submitting..." : "Submit Request"}
              </button>
            </div>
          </React.Fragment>
        )}
      </div>
    </div>
  );
}

}

// ═══ PRODUCT CARD ═══
function ProductCard({ p, district, location, isNational, isAdmin, isManager, hideCost, locationIds, allLocations, overridesMap, organicNames, productInfo, labelUrls, favorites, onToggleFavorite, landedCosts }) {
  // Landed cost wins whenever it exists for the given district, regardless
  // of price tier -- manufactured cost (p.cost) is only a fallback. Shared
  // logic with ProfitSheet's costFor(), but this card shows multiple
  // districts side by side so it needs to resolve cost per-district rather
  // than off a single toggle.
  function costForDistrict(distId) {
    const landed = landedCosts?.[p.item]?.[distId];
    if (landed) return { cost: landed.avg_cost, source: "Landed" };
    return { cost: p.cost, source: "Mfg" };
  }
  const [open, setOpen] = useState(false);
  const [showInfo, setShowInfo] = useState(false);
  const [useFloor, setUseFloor] = useState(false);
  const [customRate, setCustomRate] = useState(null);
  const [customUreaRate, setCustomUreaRate] = useState(null);
  const [customNh3Rate, setCustomNh3Rate] = useState(null);
  const [customGPA, setCustomGPA] = useState(10);
  const [showBidCalc, setShowBidCalc] = useState(false);
  const [bidPrice, setBidPrice] = useState(null);
  const [bidMargin, setBidMargin] = useState(null);
  const [showHistory, setShowHistory] = useState(false);
  const [historyData, setHistoryData] = useState(null);
  const [historyLoading, setHistoryLoading] = useState(false);
  async function toggleHistory() {
    const next = !showHistory;
    setShowHistory(next);
    if (next && historyData === null) {
      setHistoryLoading(true);
      const { data } = await supabaseClient
        .from("price_history")
        .select("field_name, old_value, new_value, changed_at, district_id, location_id, table_name")
        .eq("sku_item", p.item)
        .order("changed_at", { ascending: false })
        .limit(200);
      setHistoryData(data || []);
      setHistoryLoading(false);
    }
  }
  const isOrg = organicNames.has(p.name);
  const effectiveRate = customRate != null ? customRate : p.rate_min;

  // ── Editable rate display ──
  function RateInput({ rate, unit, color, onChange }) {
    const [editing, setEditing] = useState(false);
    const [val, setVal] = useState(String(rate));
    const onDone = () => { const n = parseFloat(val); if (!isNaN(n) && n > 0) { (onChange || setCustomRate)(n); Analytics.track("rate_changed", { product: p.name, rate: n, unit }); } setEditing(false); };
    if (editing) {
      return <input type="number" autoFocus value={val} onChange={e => setVal(e.target.value)}
        onBlur={onDone}
        onKeyDown={e => { if (e.key === "Enter") onDone(); }}
        style={{ width: 45, fontSize: 13, fontWeight: 700, color: color || S.green, background: "rgba(255,255,255,.08)", border: "1px solid " + (color || S.green), borderRadius: 4, padding: "1px 4px", outline: "none", textAlign: "center" }}
        onClick={e => e.stopPropagation()} />;
    }
    return <span onClick={e => { e.stopPropagation(); setVal(String(rate)); setEditing(true); }}
      style={{ cursor: "pointer", borderBottom: "1px dashed " + (color || S.green), fontWeight: 700, color: color || S.green }}>{rate}</span>;
  }

  // ── Shared PPA renderer ──
  function renderPPA(price, priceLabel) {
    if (!price || p.rate_min == null || !p.rate_unit) return null;
    const isNTP = p.n_treatment === true || p.n_treatment === "true";
    if (isNTP) {
      const defaultLr = p.n_treat_low_rate || p.rate_min;
      const lr = customRate != null ? customRate : defaultLr;
      const defaultUr = p.n_treat_urea_rate;
      const ur = defaultUr ? (customUreaRate != null ? customUreaRate : defaultUr) : null;
      const defaultNh3 = p.rate_note && p.rate_note.match(/Anhydrous\s+(\d+)/i) ? parseInt(p.rate_note.match(/Anhydrous\s+(\d+)/i)[1]) : null;
      const nh3r = defaultNh3 ? (customNh3Rate != null ? customNh3Rate : defaultNh3) : null;
      const uanV = [10, 15, 20, 25, 30];
      const dryLbs = [50, 100, 150, 200];
      const anyCustom = (customRate != null && customRate !== defaultLr) || (customUreaRate != null && customUreaRate !== defaultUr) || (customNh3Rate != null && customNh3Rate !== defaultNh3);
      return (
        <div style={{ background: "rgba(91,155,213,.08)", border: "1px solid rgba(91,155,213,.2)", borderRadius: 8, padding: "8px 10px", margin: "8px 0" }}>
          <div style={{ fontSize: 9, color: S.blue, textTransform: "uppercase", letterSpacing: 1, marginBottom: 6 }}>📈 Price/Acre @ <RateInput rate={lr} unit="qt/tn" color={S.blue} /> qt/tn UAN ({priceLabel}){anyCustom ? <span onClick={e => { e.stopPropagation(); setCustomRate(null); setCustomUreaRate(null); setCustomNh3Rate(null); }} style={{ marginLeft: 6, fontSize: 9, color: S.amber, cursor: "pointer", textDecoration: "underline", textTransform: "none" }}>reset all</span> : null}</div>
          <div style={{ display: "flex", gap: 4, marginBottom: 4 }}><span style={{ flex: 1, fontSize: 9, color: S.muted }}>GAL/AC</span>{uanV.map(v => <span key={v} style={{ flex: 1, fontSize: 9, color: S.muted, textAlign: "right" }}>{v}</span>)}</div>
          <div style={{ display: "flex", gap: 4 }}><span style={{ flex: 1, fontSize: 9, color: S.muted }}>$/ACRE</span>{uanV.map(v => { const r = calcNTreatPPA(price, lr, v); return <span key={v} style={{ flex: 1, fontSize: 12, fontWeight: 600, color: S.text, textAlign: "right" }}>{r != null ? fmtAc(r) : "—"}</span>; })}</div>
          {ur != null && (<React.Fragment>
            <div style={{ fontSize: 9, color: S.blue, textTransform: "uppercase", letterSpacing: 1, marginTop: 8, marginBottom: 4 }}>UREA @ <RateInput rate={ur} unit="qt/tn" color={S.blue} onChange={v => setCustomUreaRate(v)} /> qt/tn</div>
            <div style={{ display: "flex", gap: 4, marginBottom: 4 }}><span style={{ flex: 1, fontSize: 9, color: S.muted }}>LBS/AC</span>{dryLbs.map(v => <span key={v} style={{ flex: 1, fontSize: 9, color: S.muted, textAlign: "right" }}>{v}</span>)}</div>
            <div style={{ display: "flex", gap: 4 }}><span style={{ flex: 1, fontSize: 9, color: S.muted }}>$/ACRE</span>{dryLbs.map(v => { const r = calcUreaPPA(price, ur, v); return <span key={v} style={{ flex: 1, fontSize: 12, fontWeight: 600, color: S.text, textAlign: "right" }}>{r != null ? fmtAc(r) : "—"}</span>; })}</div>
          </React.Fragment>)}
          {nh3r != null && (<React.Fragment>
            <div style={{ fontSize: 9, color: S.blue, textTransform: "uppercase", letterSpacing: 1, marginTop: 8, marginBottom: 4 }}>NH3 (ANHYDROUS) @ <RateInput rate={nh3r} unit="qt/tn" color={S.blue} onChange={v => setCustomNh3Rate(v)} /> qt/tn</div>
            <div style={{ display: "flex", gap: 4, marginBottom: 4 }}><span style={{ flex: 1, fontSize: 9, color: S.muted }}>LBS/AC</span>{dryLbs.map(v => <span key={v} style={{ flex: 1, fontSize: 9, color: S.muted, textAlign: "right" }}>{v}</span>)}</div>
            <div style={{ display: "flex", gap: 4 }}><span style={{ flex: 1, fontSize: 9, color: S.muted }}>$/ACRE</span>{dryLbs.map(v => { const r = calcUreaPPA(price, nh3r, v); return <span key={v} style={{ flex: 1, fontSize: 12, fontWeight: 600, color: S.text, textAlign: "right" }}>{r != null ? fmtAc(r) : "—"}</span>; })}</div>
          </React.Fragment>)}
        </div>
      );
    } else {
      const ppa = calcPPA(p.pkg, price, effectiveRate, p.rate_unit, customGPA, p.dry_oz_price, p.oz_per_unit);
      if (!ppa) return null;
      return (
        <div style={{ background: "rgba(76,175,106,.08)", border: "1px solid rgba(76,175,106,.2)", borderRadius: 8, padding: "8px 10px", margin: "8px 0" }}>
          <div style={{ fontSize: 9, color: S.green, textTransform: "uppercase", letterSpacing: 1, marginBottom: 4 }}>💰 Price Per Acre{ppa.per100 ? (() => {
            return <span> (<RateInput rate={customGPA} unit="GPA" color={S.green} onChange={v => setCustomGPA(v)} /> GPA)</span>;
          })() : ""} — {priceLabel}</div>
          <div style={{ fontSize: 16, fontWeight: 700, color: S.green }}>{fmtAc(ppa.val)}</div>
          <div style={{ fontSize: 10, color: S.muted, marginTop: 2 }}>@ <RateInput rate={effectiveRate} unit={p.rate_unit} color={S.green} /> {p.rate_unit}{customRate != null && customRate !== p.rate_min ? <span onClick={e => { e.stopPropagation(); setCustomRate(null); }} style={{ marginLeft: 6, fontSize: 9, color: S.amber, cursor: "pointer", textDecoration: "underline" }}>reset</span> : null}</div>
        </div>
      );
    }
  }

  // ── Shared price cell renderer ──
  function PriceCell({ k, l, v, c, sel, onSel, showMargin, cellCost }) {
    const isActive = sel === k;
    const cost = cellCost !== undefined ? cellCost : p.cost;
    const mg = showMargin && cost != null && v != null && v > 0 ? ((v - cost) / v * 100).toFixed(1) + "%" : null;
    return (
      <div onClick={e => { e.stopPropagation(); onSel(k); }} style={{ background: isActive ? S.cellBgActive : S.cellBg, padding: "6px 8px", cursor: "pointer", borderLeft: isActive ? "3px solid " + c : "3px solid transparent" }}>
        <div style={{ fontSize: 8, color: isActive ? c : S.muted, textTransform: "uppercase", letterSpacing: .8, marginBottom: 2 }}>{l}{isActive ? " ✓" : ""}</div>
        <div style={{ display: "flex", alignItems: "baseline", justifyContent: "space-between" }}>
          <div style={{ fontSize: 17, fontWeight: 700, color: c }}>{fmt(v)}</div>
          {mg && <div style={{ fontSize: 9, color: S.muted, fontWeight: 600 }}>{mg}</div>}
        </div>
      </div>
    );
  }

  // ── ADMIN TX CARD ──
  if (isAdmin && !isNational) {
    const natFloor = natFloorOf(p);
    const wTargetIsNat = p.w_target == null && p.nat_target != null;
    const eTargetIsNat = p.e_target == null && p.nat_target != null;
    const wTargetVal = p.w_target != null ? p.w_target : p.nat_target;
    const eTargetVal = p.e_target != null ? p.e_target : p.nat_target;
    const wFloorVal = p.w_floor != null ? p.w_floor : natFloor;
    const eFloorVal = p.e_floor != null ? p.e_floor : natFloor;

    const wCostR = costForDistrict("wtx");
    const eCostR = costForDistrict("etx");
    const homeCostR = costForDistrict(district === "wtx" ? "wtx" : "etx");

    // District grid: W TX Target/Floor (left col), E TX Target/Floor (right col)
    // -- margin on each cell uses that district's own landed cost, so West
    // cells never get margin computed off East's (or vice versa).
    const collapsedCells = [];
    if (wTargetVal != null) collapsedCells.push({ k: "w_target", l: "W TX Target" + (wTargetIsNat ? " (Nat)" : ""), v: wTargetVal, c: wTargetIsNat ? S.blue : S.green, cellCost: wCostR.cost });
    if (eTargetVal != null) collapsedCells.push({ k: "e_target", l: "E TX Target" + (eTargetIsNat ? " (Nat)" : ""), v: eTargetVal, c: eTargetIsNat ? S.blue : S.green, cellCost: eCostR.cost });
    const expandedCells = [];
    if (wFloorVal != null) expandedCells.push({ k: "w_floor", l: "W TX Floor" + (wTargetIsNat ? " (Nat)" : ""), v: wFloorVal, c: S.amber, cellCost: wCostR.cost });

            {locKeys.length > 0 && (
              <div style={{ display: "grid", gridTemplateColumns: "repeat(" + Math.min(locKeys.length, 2) + ",1fr)", gap: 1, background: S.border, borderRadius: 6, overflow: "hidden", marginTop: 8 }}>
                {locTargetCells.map(c => <PriceCell key={c.k} {...c} sel={adminSel} onSel={setUseFloor} showMargin={!hideCost} />)}
                {locFloorCells.map(c => <PriceCell key={c.k} {...c} sel={adminSel} onSel={setUseFloor} showMargin={!hideCost} />)}
              </div>

            <div style={{ display: "grid", gridTemplateColumns: (!hideCost && wsCells.length > 0) ? "1fr 1fr" : "1fr", gap: 1, background: S.border, borderRadius: 6, overflow: "hidden", marginTop: 8 }}>
              {!hideCost && <div style={{ background: S.cellBg, padding: "6px 8px" }}>
                <div style={{ fontSize: 8, color: S.muted, textTransform: "uppercase", letterSpacing: .8, marginBottom: 2 }}>Cost <span style={{ color: homeCostR.source === "Landed" ? S.blue : S.muted, textTransform: "none" }}>· {homeCostR.source}</span></div>

              </div>}
              {wsCells.map(c => <PriceCell key={c.k} {...c} sel={adminSel} onSel={setUseFloor} showMargin={!hideCost} />)}

            {renderPPA(bidPrice != null ? bidPrice : adminPrice, bidPrice != null ? "Bid Price" : adminPriceLabel)}

            {showHistory && (() => {

                if (e.field_name === "nat_target") return "National";
                if (e.district_id === "wtx") return "West TX";
                if (e.district_id === "etx") return "East TX";
                if (e.location_id) return e.location_id.toUpperCase();

  // ── SALES / MANAGER CARD ──
  const [priceMode, setPriceMode] = useState("target");
  let target, floor, label, accentColor, locOverride, hasLocOverride, isNatFallback = false;
  if (isNational) {
    target = p.nat_target; floor = target != null ? Math.round(target * 0.95 * 100) / 100 : null;
    label = "National"; accentColor = "#9ab8a0"; locOverride = null; hasLocOverride = false;
  } else {
    // Check for location override first (for single-location sales reps)
    locOverride = null; hasLocOverride = false;
    if (location && overridesMap && !isManager) {
      const key = p.item + ":" + location;
      const ov = overridesMap[key];
      if (ov && (ov.floor_price != null || ov.target_price != null)) {
        locOverride = { target: ov.target_price, floor: ov.floor_price, locName: ov.location_name || location };
        hasLocOverride = true;
      }
    }
    const natFloor = natFloorOf(p);
    // Cascade (2026-09-01, Nathan's spec): Location override -> District ->
    // National, same as resolvePrice() above -- no gate requiring some
    // district price to already exist. Reps never see "(Nat)"/"(National)"
    // or any color distinction for a national-fallback price -- they just
    // see a price, same as a real district price. Only the admin card
    // (further up this component) shows the "(Nat)" indicator.
    if (hasLocOverride) {
      target = locOverride.target; floor = locOverride.floor;
      const loc = allLocations.find(l => l.id === location);
      label = loc?.name || location;
      accentColor = S.blue;
    } else if (district === "wtx") {
      if (p.w_target != null || p.w_floor != null) {
        target = p.w_target; floor = p.w_floor; label = "West TX";
      } else if (p.nat_target != null) {
        target = p.nat_target; floor = natFloor; label = "West TX"; isNatFallback = true;
      } else {
        target = null; floor = null; label = "West TX";
      }
      accentColor = S.amber;
    } else {
      if (p.e_target != null || p.e_floor != null) {
        target = p.e_target; floor = p.e_floor; label = "East TX";
      } else if (p.nat_target != null) {
        target = p.nat_target; floor = natFloor; label = "East TX"; isNatFallback = true;
      } else {
        target = null; floor = null; label = "East TX";
      }
      accentColor = S.green;
    }
  }

  // Determine active price based on mode
  let activePrice, activePriceLabel;
  if ((priceMode.startsWith("loc:") || priceMode.startsWith("loc_floor:")) && isManager && overridesMap) {
    // Manager clicked a location override
    const isLocFloor = priceMode.startsWith("loc_floor:");
    const lid = priceMode.split(":")[1];
    const key = p.item + ":" + lid;
    const ov = overridesMap[key];
    if (ov) {
      activePrice = isLocFloor ? (ov.floor_price || ov.target_price) : (ov.target_price || ov.floor_price);
      const loc = allLocations.find(l => l.id === lid);
      activePriceLabel = (loc?.name || lid) + (isLocFloor ? " Floor" : " Target");
    } else {
      activePrice = target; activePriceLabel = "Target";
    }
  } else if (priceMode === "ws" && p.wholesale) {
    activePrice = wholesaleBasis(p);
    activePriceLabel = "Wholesale";
  } else if (priceMode === "floor") {
    activePrice = floor;
    activePriceLabel = "Floor";
  } else {
    activePrice = target;
    activePriceLabel = "Target";
  }

  // Wholesale for Lonestar reps
  const isLonestar = !isNational && location === "ls";
  const wholesale = isLonestar ? wholesaleBasis(p) : null;

  const labelUrl = labelUrls[p.name];
  const rateStr = p.rate_min != null && p.rate_unit ? (p.rate_min === p.rate_max ? p.rate_min + " " + p.rate_unit : p.rate_min + "-" + p.rate_max + " " + p.rate_unit) : null;
  const rateNote = p.rate_note;

  let ppaSection = null;
  if (activePrice && p.rate_min != null && p.rate_unit) {
    const isNTreatProduct = p.n_treatment === true || p.n_treatment === "true";
    if (isNTreatProduct) {
      const lowRate = p.n_treat_low_rate || p.rate_min;
      const ureaRate = p.n_treat_urea_rate;
      const nh3Rate = p.rate_note && p.rate_note.match(/Anhydrous\s+(\d+)/i) ? parseInt(p.rate_note.match(/Anhydrous\s+(\d+)/i)[1]) : null;
      const uanVols = [10, 15, 20, 25, 30];
      const dryLbs = [50, 100, 150, 200];
      ppaSection = (
        <div style={{ background: "rgba(91,155,213,.08)", border: "1px solid rgba(91,155,213,.2)", borderRadius: 8, padding: "8px 10px", margin: "8px 0" }}>
          <div style={{ fontSize: 9, color: S.blue, textTransform: "uppercase", letterSpacing: 1, marginBottom: 6 }}>📈 Price/Acre @ {lowRate} qt/tn UAN ({activePriceLabel})</div>
          <div style={{ display: "flex", gap: 4, marginBottom: 4 }}>
            <span style={{ flex: 1, fontSize: 9, color: S.muted }}>GAL/AC</span>
            {uanVols.map(v => <span key={v} style={{ flex: 1, fontSize: 9, color: S.muted, textAlign: "right" }}>{v}</span>)}
          </div>
          <div style={{ display: "flex", gap: 4 }}>
            <span style={{ flex: 1, fontSize: 9, color: S.muted }}>$/ACRE</span>
            {uanVols.map(v => { const ppa = calcNTreatPPA(activePrice, lowRate, v); return <span key={v} style={{ flex: 1, fontSize: 12, fontWeight: 600, color: S.text, textAlign: "right" }}>{ppa != null ? fmtAc(ppa) : "—"}</span>; })}
          </div>
          {ureaRate && (
            <React.Fragment>
              <div style={{ fontSize: 9, color: S.blue, textTransform: "uppercase", letterSpacing: 1, marginTop: 8, marginBottom: 4 }}>UREA @ {ureaRate} qt/tn</div>
              <div style={{ display: "flex", gap: 4, marginBottom: 4 }}>
                <span style={{ flex: 1, fontSize: 9, color: S.muted }}>LBS/AC</span>
                {dryLbs.map(v => <span key={v} style={{ flex: 1, fontSize: 9, color: S.muted, textAlign: "right" }}>{v}</span>)}
              </div>
              <div style={{ display: "flex", gap: 4 }}>
                <span style={{ flex: 1, fontSize: 9, color: S.muted }}>$/ACRE</span>
                {dryLbs.map(v => { const ppa = calcUreaPPA(activePrice, ureaRate, v); return <span key={v} style={{ flex: 1, fontSize: 12, fontWeight: 600, color: S.text, textAlign: "right" }}>{ppa != null ? fmtAc(ppa) : "—"}</span>; })}
              </div>
            </React.Fragment>
          )}
          {nh3Rate && (
            <React.Fragment>
              <div style={{ fontSize: 9, color: S.blue, textTransform: "uppercase", letterSpacing: 1, marginTop: 8, marginBottom: 4 }}>NH3 (ANHYDROUS) @ {nh3Rate} qt/tn</div>
              <div style={{ display: "flex", gap: 4, marginBottom: 4 }}>
                <span style={{ flex: 1, fontSize: 9, color: S.muted }}>LBS/AC</span>
                {dryLbs.map(v => <span key={v} style={{ flex: 1, fontSize: 9, color: S.muted, textAlign: "right" }}>{v}</span>)}
              </div>
              <div style={{ display: "flex", gap: 4 }}>
                <span style={{ flex: 1, fontSize: 9, color: S.muted }}>$/ACRE</span>
                {dryLbs.map(v => { const ppa = calcUreaPPA(activePrice, nh3Rate, v); return <span key={v} style={{ flex: 1, fontSize: 12, fontWeight: 600, color: S.text, textAlign: "right" }}>{ppa != null ? fmtAc(ppa) : "—"}</span>; })}

    } else {
      const ppa = calcPPA(p.pkg, activePrice, p.rate_min, p.rate_unit, 20, p.dry_oz_price, p.oz_per_unit);
      if (ppa) {
        ppaSection = (
          <div style={{ background: "rgba(76,175,106,.08)", border: "1px solid rgba(76,175,106,.2)", borderRadius: 8, padding: "8px 10px", margin: "8px 0" }}>

            <div style={{ fontSize: 10, color: S.muted, marginTop: 2 }}>@ {p.rate_min} {p.rate_unit} · {activePriceLabel}</div>

    }
  }

  const showManagerCompare = isManager && !isNational && locationIds && locationIds.length > 1;

  return (<React.Fragment>
    <div style={{ background: S.card, border: "1px solid " + S.border, borderRadius: 10, marginBottom: 8, overflow: "hidden" }}>
      <div onClick={() => { const nx = !open; setOpen(nx); if (nx) Analytics.track("product_view", { name: p.name, item: p.item }); }} style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", padding: "10px 12px", cursor: "pointer", userSelect: "none" }}>
        <div><div style={{ fontSize: 16, fontWeight: 700, color: S.textStrong, lineHeight: 1.2 }}>{p.name}</div>
          <div style={{ fontSize: 10, color: S.muted, marginTop: 2 }}>#{p.item} · {p.pkg}</div></div>
        <div style={{ display: "flex", alignItems: "center", gap: 6 }}>
          {isOrg && <span style={{ display: "inline-flex", background: "rgba(74,222,128,.13)", border: "1px solid rgba(74,222,128,.35)", color: "#4ade80", borderRadius: 5, padding: "2px 7px", fontSize: 10, fontWeight: 800 }}>◆ ORGANIC</span>}
          {p.cat && <span style={{ fontSize: 9, color: accentColor, background: "rgba(76,175,106,.1)", border: "1px solid rgba(76,175,106,.2)", padding: "2px 6px", borderRadius: 4 }}>{p.cat}</span>}

          <span style={{ fontSize: 15, color: S.muted, transform: open ? "rotate(180deg)" : "none", transition: "transform .2s" }}>⌄</span>
        </div>
      </div>

      {showManagerCompare ? (() => {
        // Managers see the "(Nat)" indicator same as admin (no gate
        // requiring some district price to already exist -- 2026-09-01
        // cascade fix, same as the sales card and resolvePrice() above).
        const mgrNatFloor = natFloorOf(p);
        const distPr = district === "wtx"
          ? (p.w_target != null || p.w_floor != null
              ? { target: p.w_target, floor: p.w_floor, label: "West TX" }

          : (p.e_target != null || p.e_floor != null
              ? { target: p.e_target, floor: p.e_floor, label: "East TX" }
              : (p.nat_target != null
                  ? { target: p.nat_target, floor: mgrNatFloor, label: "East TX (Nat)" }
                  : { target: null, floor: null, label: "East TX" }));
        const mgrLocOverrides = locationIds.map(lid => {
          const key = p.item + ":" + lid;
          const ov = overridesMap[key];
          if (ov && (ov.floor_price != null || ov.target_price != null)) {

          return null;

        const isLsMgr = locationIds.includes("ls");

        let mgrPrice, mgrPriceLabel;
        if (priceMode === "ws" && p.wholesale) {

        } else if (priceMode.startsWith("loc:") || priceMode.startsWith("loc_floor:")) {
          const isLF = priceMode.startsWith("loc_floor:");
          const lid = priceMode.split(":")[1];
          const ov = overridesMap[p.item + ":" + lid];
          if (ov) {
            mgrPrice = isLF ? (ov.floor_price || ov.target_price) : (ov.target_price || ov.floor_price);
            const loc = allLocations.find(l => l.id === lid);
            mgrPriceLabel = (loc?.name || lid) + (isLF ? " Floor" : " Target");
          } else { mgrPrice = distPr.target; mgrPriceLabel = distPr.label + " Target"; }
        } else if (priceMode === "floor") {
          mgrPrice = distPr.floor; mgrPriceLabel = distPr.label + " Floor";
        } else {
          mgrPrice = distPr.target; mgrPriceLabel = distPr.label + " Target";
        }

        return (
          <React.Fragment>
          <div style={{ margin: "0 12px 10px" }}>
            <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 1, background: S.border, borderRadius: 6, overflow: "hidden" }}>
              <PriceCell k="target" l={distPr.label + " Target"} v={distPr.target} c={S.green} sel={priceMode} onSel={setPriceMode} showMargin={true} />
              <PriceCell k="floor" l={distPr.label + " Floor"} v={distPr.floor} c={S.amber} sel={priceMode} onSel={setPriceMode} showMargin={true} />
            </div>
            {mgrLocOverrides.length > 0 && (
              <div style={{ display: "grid", gridTemplateColumns: "repeat(" + Math.min(mgrLocOverrides.length * 2, 4) + ",1fr)", gap: 1, background: S.border, borderRadius: 6, overflow: "hidden", marginTop: 4 }}>
                {mgrLocOverrides.map(ov => (
                  <React.Fragment key={ov.locName}>
                    <PriceCell k={"loc:" + ov.lid} l={ov.locName + " Target"} v={ov.target} c={S.blue} sel={priceMode} onSel={setPriceMode} showMargin={true} />
                    <PriceCell k={"loc_floor:" + ov.lid} l={ov.locName + " Floor"} v={ov.floor} c={S.blue} sel={priceMode} onSel={setPriceMode} showMargin={true} />
                  </React.Fragment>
                ))}
              </div>
            )}
          </div>
          {open && (
            <div style={{ padding: "0 12px 10px", borderTop: "1px solid " + S.border }}>
              {isLsMgr && p.wholesale != null && p.wholesale > 0 && (
                <div style={{ display: "grid", gridTemplateColumns: "1fr", gap: 1, background: S.border, borderRadius: 6, overflow: "hidden", marginTop: 8 }}>
                  <PriceCell k="ws" l="Wholesale" v={wholesaleBasis(p)} c={S.purple} sel={priceMode} onSel={setPriceMode} showMargin={true} />
                </div>
              )}
              {renderPPA(mgrPrice, mgrPriceLabel)}
              {(rateStr || rateNote) && <div style={{ display: "inline-flex", alignItems: "center", background: "rgba(232,162,48,.1)", border: "1px solid rgba(232,162,48,.25)", borderRadius: 6, padding: "5px 9px", marginTop: 8 }}><span style={{ fontSize: 11, color: S.amber }}>🌿 {rateStr || ""}{rateStr && rateNote ? " · " : ""}{rateNote || ""}</span></div>}
              <div style={{ display: "flex", gap: 8, flexWrap: "wrap", alignItems: "center", marginTop: 8 }}>
                <a href={"https://www.google.com/search?q=" + encodeURIComponent("Wilbur Ellis " + p.name + " label")} target="_blank" onClick={() => Analytics.track("label_search", { name: p.name, item: p.item })} rel="noopener" style={{ display: "inline-flex", alignItems: "center", gap: 5, background: "rgba(76,175,106,.12)", border: "1px solid rgba(76,175,106,.35)", borderRadius: 6, padding: "7px 12px", textDecoration: "none", color: S.green, fontSize: 11, letterSpacing: .5, textTransform: "uppercase" }}>🔍 Search Label</a>
                {productInfo[p.name] && <button onClick={e => { e.stopPropagation(); setShowInfo(true); Analytics.track("product_info_click", { name: p.name, item: p.item }); }} style={{ display: "inline-flex", alignItems: "center", gap: 5, background: "rgba(99,102,241,.12)", border: "1px solid rgba(99,102,241,.3)", color: "#818cf8", borderRadius: 8, padding: "7px 12px", fontSize: 12, fontWeight: 700, cursor: "pointer" }}>📚 Product Info</button>}
              </div>
              <div style={{ fontSize: 10, color: S.border, marginTop: 7 }}>ITEM # {p.item} · {p.pkg}</div>
            </div>
          )}
          </React.Fragment>
        );
      })() : (
        <React.Fragment>
        <div style={{ margin: "0 12px 10px" }}>
          {hasLocOverride && <div style={{ fontSize: 8, color: S.blue, textTransform: "uppercase", letterSpacing: 1, padding: "4px 8px 2px", fontWeight: 700 }}>★ {label} Location Pricing</div>}
          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 1, background: S.border, borderRadius: 6, overflow: "hidden" }}>
            <PriceCell k="target" l="Target" v={target} c={S.green} sel={priceMode} onSel={setPriceMode} showMargin={false} />
            <PriceCell k="floor" l="Floor" v={floor} c={S.amber} sel={priceMode} onSel={setPriceMode} showMargin={false} />
          </div>
          {wholesale != null && wholesale > 0 && (
            <div style={{ display: "grid", gridTemplateColumns: "1fr", gap: 1, background: S.border, borderRadius: 6, overflow: "hidden", marginTop: 4 }}>
              <PriceCell k="ws" l="Wholesale" v={wholesale} c={S.purple} sel={priceMode} onSel={setPriceMode} showMargin={false} />
            </div>
          )}
        </div>
        {open && (
          <div style={{ padding: "0 12px 10px", borderTop: "1px solid " + S.border }}>
            {renderPPA(activePrice, activePriceLabel)}
            {(rateStr || rateNote) && <div style={{ display: "inline-flex", alignItems: "center", background: "rgba(232,162,48,.1)", border: "1px solid rgba(232,162,48,.25)", borderRadius: 6, padding: "5px 9px", marginTop: 8 }}><span style={{ fontSize: 11, color: S.amber }}>🌿 {rateStr || ""}{rateStr && rateNote ? " · " : ""}{rateNote || ""}</span></div>}
            <div style={{ display: "flex", gap: 8, flexWrap: "wrap", alignItems: "center", marginTop: 8 }}>
              <a href={"https://www.google.com/search?q=" + encodeURIComponent("Wilbur Ellis " + p.name + " label")} target="_blank" onClick={() => Analytics.track("label_search", { name: p.name, item: p.item })} rel="noopener" style={{ display: "inline-flex", alignItems: "center", gap: 5, background: "rgba(76,175,106,.12)", border: "1px solid rgba(76,175,106,.35)", borderRadius: 6, padding: "7px 12px", textDecoration: "none", color: S.green, fontSize: 11, letterSpacing: .5, textTransform: "uppercase" }}>🔍 Search Label</a>
              {productInfo[p.name] && <button onClick={e => { e.stopPropagation(); setShowInfo(true); Analytics.track("product_info_click", { name: p.name, item: p.item }); }} style={{ display: "inline-flex", alignItems: "center", gap: 5, background: "rgba(99,102,241,.12)", border: "1px solid rgba(99,102,241,.3)", color: "#818cf8", borderRadius: 8, padding: "7px 12px", fontSize: 12, fontWeight: 700, cursor: "pointer" }}>📚 Product Info</button>}
            </div>
            <div style={{ fontSize: 10, color: S.border, marginTop: 7 }}>ITEM # {p.item} · {p.pkg}</div>
          </div>
        )}
        </React.Fragment>

    </div>
    {showInfo && <InfoModal name={p.name} productInfo={productInfo} onClose={() => setShowInfo(false)} />}
  </React.Fragment>);
}


// ═══ TILL-IT BLENDS TAB (2026-09-01) ═══
// Read-only Floor Price reference, pulled from till_it_blend_prices (same
// table the Blend Calculator's Till-It Blend picker reads -- see that
// component for the FertHub push pipeline that keeps it current). Nathan's
// spec: reps see only their own location's price, no picker at all;
// managers get a picker among just their own assigned locations; admins get
// a District toggle (West/East) plus a Location dropdown that only matters
// on the East side, since every West TX location shares Hereford's number.
const TILL_IT_BUCKET_LABELS = { lonestar: "Lonestar", batesville: "Batesville", rgv: "RGV", hereford_wtx: "West TX (Hereford)" };

function locationNameToBucket(name, dist) {
  const n = (name || "").toLowerCase();
  if (n === "lonestar") return "lonestar";
  if (n === "batesville") return "batesville";
  if (n === "rgv") return "rgv";
  return dist === "wtx" ? "hereford_wtx" : null;
}

// Relative "how old is this price" display for Till-It Blends (2026-09-01,
// Nathan's request -- needs to spot a stale cost at a glance, not just via
// the one hardcoded Batesville flag). Returns both a short relative label
// and the days-old count so the caller can color it as a warning past some
// threshold.
function daysAgo(isoString) {
  if (!isoString) return null;
  const then = new Date(isoString).getTime();
  if (isNaN(then)) return null;
  return Math.floor((Date.now() - then) / 86400000);
}
function timeAgoLabel(days) {
  if (days == null) return "unknown";
  if (days <= 0) return "today";
  if (days === 1) return "1 day ago";
  if (days < 30) return days + " days ago";
  const months = Math.round(days / 30);
  return months === 1 ? "1 month ago" : months + " months ago";
}

function TillItBlendsView({ tillItBlendPrices, isAdmin, isManager, profile, locations, labelUrls, hideCost }) {
  const [adminDistrict, setAdminDistrict] = useState("wtx");
  const [adminEastLoc, setAdminEastLoc] = useState("lonestar");
  const [managerBucket, setManagerBucket] = useState(null);

  const dist = profile.district;
  const myLocIds = profile.location_ids || [];

  const managerBuckets = useMemo(() => {
    if (!isManager) return [];
    const set = new Set();
    myLocIds.forEach(lid => {
      const b = locationNameToBucket(locations.find(l => l.id === lid)?.name, dist);
      if (b) set.add(b);
    });
    return [...set];
  }, [isManager, myLocIds, locations, dist]);

  let bucket;
  if (isAdmin) {
    bucket = adminDistrict === "wtx" ? "hereford_wtx" : adminEastLoc;
  } else if (isManager) {
    bucket = managerBucket || managerBuckets[0] || null;
  } else {
    bucket = locationNameToBucket(locations.find(l => l.id === (myLocIds[0] || null))?.name, dist);
  }

  const rows = (tillItBlendPrices || []).filter(r => r.location_bucket === bucket)
    .sort((a, b) => a.blend_name.localeCompare(b.blend_name));

  // Grouped the same way Nathan's own FertHub "Pricing Results" page groups
  // them (2026-09-01) -- category comes straight from the row itself
  // (set by generate_till_it_blend_prices.py), not inferred client-side.
  const CATEGORY_ORDER = ["nitrogen", "phosphate", "dry"];
  const CATEGORY_LABELS = { nitrogen: "NITROGEN BLENDS", phosphate: "PHOSPHATE STARTER BLENDS", dry: "DRY BLENDS ($/lb)" };
  // Distinct color + icon per section (2026-09-01, Nathan's request --
  // plain same-color text doesn't stand out for him) -- reuses the same
  // green/blue/amber distinction already used for West/East/admin accents
  // elsewhere in this app, so it stays visually consistent, not arbitrary.
  const CATEGORY_COLORS = { nitrogen: S.blue, phosphate: S.green, dry: S.amber };
  const CATEGORY_TINT = { nitrogen: "rgba(91,155,213,.14)", phosphate: "rgba(76,175,106,.14)", dry: "rgba(232,162,48,.14)" };
  const CATEGORY_ICONS = { nitrogen: "💧", phosphate: "🌱", dry: "⚪" };
  const groupedRows = CATEGORY_ORDER.map(cat => ({ cat, items: rows.filter(r => (r.category || "nitrogen") === cat) })).filter(g => g.items.length > 0);

  return (
    <div>
      {isAdmin && (
        <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 14, flexWrap: "wrap" }}>
          <div style={{ display: "flex", gap: 6 }}>
            {["wtx", "etx"].map(key => (

function HourlyChart({ data }) {
  const canvasRef = useRef(null);

  useEffect(() => {
    if (!canvasRef.current || !data) return;
    if (chartRef.current) chartRef.current.destroy();

// ═══ ACCESS REQUESTS (Admin Only) ═══
// Matches a request's free-text "location_text" (typed by the requester
// before login, when there's no real locations list to pick from -- see
// RequestAccessModal) against the real `locations` table so Approve can
// generate a complete, ready-to-paste SQL block with no manual lookup.
// Exact name match wins outright; otherwise falls back to a substring match
// (either direction, case-insensitive) so "Hart" matches "Hart" and a typo
// like "Herford" still catches "Hereford". Multiple/no matches means the
// generated SQL falls back to the old placeholder comment instead of
// guessing wrong.
function matchLocations(text, locations) {
  if (!text || !locations?.length) return [];
  const q = text.trim().toLowerCase();
  if (!q) return [];
  const exact = locations.filter(l => (l.name || "").toLowerCase() === q);
  if (exact.length) return exact;
  return locations.filter(l => {
    const n = (l.name || "").toLowerCase();
    return n.includes(q) || q.includes(n);
  });
}

function AccessRequestsPanel({ requests, onRefresh, locations }) {
  const [approvingId, setApprovingId] = useState(null);
  const [uidInput, setUidInput] = useState("");
  const [generatedSql, setGeneratedSql] = useState("");
  const [actionError, setActionError] = useState("");
  const [busyId, setBusyId] = useState(null);

  const pending = requests.filter(r => r.status === "pending");
  const decided = requests.filter(r => r.status !== "pending").slice(0, 20);

  async function deny(id) {
    setBusyId(id);
    setActionError("");
    const { error } = await supabaseClient.from("access_requests").update({ status: "denied", decided_at: new Date().toISOString() }).eq("id", id);
    setBusyId(null);
    if (error) { setActionError("Couldn't deny: " + error.message); return; }
    onRefresh();
  }

  function startApprove(id) {
    setApprovingId(id);
    setUidInput("");
    setGeneratedSql("");
    setActionError("");
  }

  function generateSql(r) {
    if (!uidInput.trim()) { setActionError("Paste the User ID from Supabase first."); return; }
    setActionError("");
    const esc = s => (s || "").replace(/'/g, "''");
    const matches = matchLocations(r.location_text, locations);

    let locationClause, locationNote;
    if (matches.length === 1) {
      locationClause = `, location_ids)\nvalues ('${esc(uidInput.trim())}', '${r.requested_role}', '${r.requested_district}', '${esc(r.name)}', '${esc(r.email)}', array['${esc(matches[0].id)}']);`;
      locationNote = `-- matched location: ${matches[0].name} (${matches[0].id})`;
    } else {
      locationClause = `)\nvalues ('${esc(uidInput.trim())}', '${r.requested_role}', '${r.requested_district}', '${esc(r.name)}', '${esc(r.email)}');`;
      locationNote = matches.length === 0
        ? `-- no location match for "${esc(r.location_text) || "unspecified"}" -- confirm the real location id in the locations table, then run:\n-- update public.profiles set location_ids = array['...'] where id = '${esc(uidInput.trim())}';`
        : `-- multiple locations matched "${esc(r.location_text)}" (${matches.map(m => m.name + " / " + m.id).join(", ")}) -- pick the right one, then run:\n-- update public.profiles set location_ids = array['...'] where id = '${esc(uidInput.trim())}';`;
    }

    const sql =
`insert into public.profiles (id, role, district, name, username${locationClause}
${locationNote}

update public.access_requests set status = 'approved', decided_at = now() where id = '${r.id}';`;
    setGeneratedSql(sql);
  }

  const rowStyle = { background: S.card, border: "1px solid " + S.border, borderRadius: 10, padding: 14, marginBottom: 10 };

  return (
    <div style={{ padding: "6px 12px 80px" }}>
      <div style={{ fontSize: 16, fontWeight: 800, color: S.text, marginBottom: 2 }}>🔔 Access Requests</div>
      <div style={{ fontSize: 11, color: S.muted, marginBottom: 16 }}>
        Submitted from the login screen's "Request access" link.{" "}
        <span onClick={onRefresh} style={{ color: S.blue, cursor: "pointer", textDecoration: "underline" }}>🔄 Refresh</span>
      </div>

      {actionError && <div style={{ fontSize: 12, color: "#ef4444", marginBottom: 12 }}>{actionError}</div>}

      {pending.length === 0 ? (
        <div style={{ textAlign: "center", padding: "40px 20px", color: S.muted }}>
          <div style={{ fontSize: 32, marginBottom: 10 }}>📭</div>
          <div style={{ fontSize: 13 }}>No pending requests</div>
        </div>
      ) : pending.map(r => (
        <div key={r.id} style={rowStyle}>
          <div style={{ display: "flex", justifyContent: "space-between", flexWrap: "wrap", gap: 8 }}>
            <div>
              <div style={{ fontSize: 14, fontWeight: 700, color: S.text }}>{r.name}</div>
              <div style={{ fontSize: 12, color: S.muted }}>{r.email}</div>
            </div>
            <div style={{ fontSize: 10, color: S.muted, textAlign: "right" }}>
              {new Date(r.requested_at).toLocaleString()}
            </div>
          </div>
          <div style={{ display: "flex", gap: 6, flexWrap: "wrap", marginTop: 8, marginBottom: 10 }}>
            <span style={{ fontSize: 10, fontWeight: 700, color: S.blue, background: "rgba(91,155,213,.1)", border: "1px solid rgba(91,155,213,.3)", borderRadius: 6, padding: "3px 8px" }}>{r.requested_role === "manager" ? "Manager" : "Sales"}</span>
            <span style={{ fontSize: 10, fontWeight: 700, color: S.amber, background: "rgba(232,162,48,.1)", border: "1px solid rgba(232,162,48,.3)", borderRadius: 6, padding: "3px 8px" }}>{r.requested_district === "wtx" ? "West TX" : "East TX"}</span>
            {r.location_text && <span style={{ fontSize: 10, fontWeight: 700, color: S.green, background: "rgba(76,175,106,.1)", border: "1px solid rgba(76,175,106,.3)", borderRadius: 6, padding: "3px 8px" }}>{r.location_text}</span>}
          </div>

          {approvingId === r.id ? (
            <div style={{ background: S.bg, border: "1px solid " + S.border, borderRadius: 8, padding: 12 }}>
              <div style={{ fontSize: 11, color: S.muted, marginBottom: 8, lineHeight: 1.5 }}>
                1. In Supabase: Authentication → Users → Add User → enter <b>{r.email}</b> (Auto Confirm on, no password needed). Copy the new User UID.<br />
                2. Paste that UID below and generate the SQL to finish setting up their profile.

                style={{ width: "100%", background: S.inputBg, border: "1px solid " + S.border, borderRadius: 6, color: S.text, fontSize: 12, padding: "7px 9px", outline: "none", boxSizing: "border-box", marginBottom: 8 }} />

                  <button onClick={() => navigator.clipboard?.writeText(generatedSql)}
                    style={{ marginTop: 6, fontSize: 11, color: S.blue, background: "rgba(91,155,213,.1)", border: "1px solid rgba(91,155,213,.3)", borderRadius: 6, padding: "5px 10px", cursor: "pointer" }}>📋 Copy SQL</button>

            <div style={{ display: "flex", gap: 6 }}>
              <button onClick={() => deny(r.id)} disabled={busyId === r.id}

              <button onClick={() => startApprove(r.id)}
                style={{ flex: 1, fontSize: 11, fontWeight: 700, color: S.onAccent, background: S.green, border: "none", padding: "7px 12px", borderRadius: 6, cursor: "pointer" }}>✓ Approve</button>
            </div>
          )}

      ))}

      {decided.length > 0 && (
        <React.Fragment>
          <div style={{ fontSize: 11, fontWeight: 700, color: S.muted, textTransform: "uppercase", letterSpacing: 1, margin: "20px 0 8px" }}>Recent Decisions</div>
